<script>
window.sprint5Features=window.sprint5Features||{};
window.sprint5Features['Cảnh báo công nợ']={path:'canh-bao-cong-no',permission:'customers.credit',render(){const ui=financeUi,e=ui.e,m=ui.m;
 ui.screen('Cảnh báo và khóa bán','Đánh giá từ công nợ thực tế, tự động mỗi ngày và sau thu tiền. Cấu hình áp dụng ở cả API và database.','credit-alerts',(data,body,revision)=>{
  body.innerHTML='<div class="finance-toolbar"><label>Vượt hạn mức <select id="riskOver"><option value="REVIEW">Cần duyệt</option><option value="BLOCK">Chặn đơn mới</option></select></label><label>Nợ quá hạn <select id="riskLate"><option value="BLOCK">Chặn đơn mới</option><option value="REVIEW">Cần duyệt</option></select></label><button class="primary" id="riskSave">Lưu chính sách</button></div><div id="riskError" role="alert"></div>'+ui.table(['Đại lý','Hạn mức','Công nợ và cam kết','Còn lại','Nợ quá hạn','Số ngày trễ','Đánh giá gần nhất'],data.items.map(r=>[e(r.code+' · '+r.name),m(r.credit_limit),m(r.outstanding),m(r.available),m(r.overdue_amount),e(r.max_overdue_days),e(r.evaluated_at)]));
  body.querySelector('#riskOver').value=data.policy.over_limit_mode;body.querySelector('#riskLate').value=data.policy.overdue_mode;
  body.querySelector('#riskSave').onclick=async()=>{const button=body.querySelector('#riskSave');button.disabled=true;try{await apiRequest('credit-alerts',jsonRequestOptions('POST',{overLimitMode:body.querySelector('#riskOver').value,overdueMode:body.querySelector('#riskLate').value}));if(revision===viewRevision)window.sprint5Features['Cảnh báo công nợ'].render();}catch(error){if(revision===viewRevision)body.querySelector('#riskError').textContent=error.message;}finally{button.disabled=false;}};
 });}};
</script>
