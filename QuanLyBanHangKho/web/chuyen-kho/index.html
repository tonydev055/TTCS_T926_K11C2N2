<script>
window.sprint5Features=window.sprint5Features||{};
window.sprint5Features['Chuyển kho']={path:'chuyen-kho',permission:'inventory.write',render:()=>warehouseUi.screen('Chuyển kho nội bộ','Kho đi xuất chuyển thì giảm tồn. Hàng đang trên đường chưa cộng kho đến; kho đến xác nhận số thực nhận.',async()=>({rows:await apiRequest('stock-transfers'),masters:await apiRequest('stock-transfers/masters')}),(host,{rows,masters})=>{
 const ui=warehouseUi,e=ui.esc,reload=()=>sprint5Features['Chuyển kho'].render(),labels={DRAFT:'Nháp',IN_TRANSIT:'Đang trên đường',RECEIVED:'Đã nhận',CANCELLED:'Đã hủy'};
 const has=id=>masters.warehouses.some(w=>w.id===Number(id));
 host.innerHTML='<button class="orange-button" id="ckNew">Lập phiếu chuyển</button>'+ui.table(['Mã phiếu','Kho đi','Kho đến','Trạng thái','Thao tác'],rows.map(r=>'<tr><td>'+e(r.code)+'</td><td>'+e(r.source_name)+'</td><td>'+e(r.destination_name)+'</td><td>'+labels[r.status]+'</td><td><button data-open="'+r.id+'">Chi tiết</button></td></tr>'));
 host.querySelector('#ckNew').onclick=()=>{
  const {form,close}=openFormDialog('Lập phiếu chuyển',ui.field('sourceId','Kho đi','','text',true,ui.opts(masters.warehouses.filter(w=>w.active)))+ui.field('destinationId','Kho đến','','text',true,ui.opts(masters.destinations))+ui.field('note','Ghi chú','','textarea',false)+'<div class="form-group full" id="ckLines"><div class="wh-lines"></div><button type="button" id="ckAdd">Thêm dòng</button></div>','Lưu nháp');
  const list=form.querySelector('.wh-lines');
  function add(){const row=document.createElement('div');row.className='wh-line';row.innerHTML='<label>Lô/vị trí *<select data-bin required></select></label><label>Đơn vị *<select data-unit required></select></label><label>Số lượng *<input data-qty type="number" min="0.000001" step="0.000001" value="1" required></label><button type="button" data-remove>Xóa</button>';list.append(row);
   row.querySelector('[data-bin]').innerHTML='<option value="">Chọn lô/vị trí</option>'+masters.bins.filter(b=>String(b.warehouse_id)===form.querySelector('[name=sourceId]').value).map(b=>'<option value="'+b.id+'">'+e(b.sku+' · '+b.location_name+' · Lô '+(b.lot_number||'—')+' · Tồn '+b.on_hand)+'</option>').join('');
   row.querySelector('[data-bin]').onchange=()=>{const bin=masters.bins.find(b=>String(b.id)===row.querySelector('[data-bin]').value),p=masters.products.find(p=>p.id===bin?.product_id);row.querySelector('[data-unit]').innerHTML=(p?.units||[]).map(u=>'<option value="'+u.id+'">'+e(u.name)+'</option>').join('');};row.querySelector('[data-remove]').onclick=()=>row.remove();
  }
  form.querySelector('#ckAdd').onclick=add;form.querySelector('[name=sourceId]').onchange=()=>{list.innerHTML='';add();};add();
  form.onsubmit=event=>{event.preventDefault();const f=new FormData(form);ui.submit(form,'stock-transfers','POST',{sourceId:Number(f.get('sourceId')),destinationId:Number(f.get('destinationId')),note:f.get('note'),lines:Array.from(list.children).map(r=>({binId:Number(r.querySelector('[data-bin]').value),unitId:Number(r.querySelector('[data-unit]').value),quantity:r.querySelector('[data-qty]').value}))},close,reload);};
 };
 async function detail(id){const r=await apiRequest('stock-transfers/'+id);const receiving=r.status==='IN_TRANSIT'&&has(r.destination_warehouse_id),sending=r.status==='DRAFT'&&has(r.source_warehouse_id);
  const lines=r.lines.map(l=>'<tr><td>'+e(l.sku+' · '+l.name)+'</td><td>'+e(l.lot_number)+'</td><td>'+l.quantity+' '+e(l.unit_name)+'</td><td>'+(receiving?'<input name="qty'+l.id+'" type="number" min="0" step="0.000001" required value="'+l.quantity+'">':e(l.received_quantity??'Chưa nhận'))+'</td><td>'+(receiving?'<select name="loc'+l.id+'" required><option value="">Chọn vị trí</option>'+masters.locations.filter(x=>x.active&&x.warehouse_id===r.destination_warehouse_id).map(x=>'<option value="'+x.id+'">'+e(x.name)+'</option>').join('')+'</select>':'')+'</td></tr>');
  const {form,close}=openFormDialog('Phiếu '+r.code,ui.table(['SKU','Lô','Số xuất','Số thực nhận','Vị trí kho đến'],lines)+(receiving?ui.field('reason','Lý do chênh lệch','','textarea',false):'<p>'+e(r.receive_reason)+'</p>'),receiving?'Xác nhận nhận hàng':sending?'Xuất chuyển':null);
  if(sending){const cancel=document.createElement('button');cancel.type='button';cancel.className='wh-danger';cancel.textContent='Hủy phiếu nháp';form.append(cancel);cancel.onclick=()=>{close();const d=openFormDialog('Hủy phiếu '+r.code,ui.field('reason','Lý do hủy','','textarea',true),'Hủy phiếu nháp');d.form.onsubmit=event=>{event.preventDefault();ui.submit(d.form,'stock-transfers/'+id+'/cancel','POST',{reason:new FormData(d.form).get('reason')},d.close,reload);};};}
  form.onsubmit=event=>{event.preventDefault();const body=receiving?{reason:new FormData(form).get('reason'),lines:r.lines.map(l=>({lineId:l.id,receivedQuantity:form.querySelector('[name=qty'+l.id+']').value,locationId:Number(form.querySelector('[name=loc'+l.id+']').value)}))}:{};ui.submit(form,'stock-transfers/'+id+(receiving?'/receive':'/send'),'POST',body,close,reload);};
 }
 host.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>detail(b.dataset.open).catch(err=>showToast(err.message,'error')));
})};
</script>
