<script>
window.sprint5Features=window.sprint5Features||{};
window.sprint5Features['Công nợ của tôi']={path:'cong-no',permission:'invoices.self',render(){
 const ui=financeUi,e=ui.e,m=ui.m;
 ui.screen('Công nợ của tôi','Tra cứu hóa đơn đã phát hành, tiền đã đối trừ và hạn mức còn lại của đại lý.','dealer-debt',(data,body,revision)=>{
  const s=data.summary;
  body.innerHTML='<h3>'+e(s.code+' · '+s.name)+'</h3><p class="finance-summary">Còn nợ: '+m(s.total_outstanding)+' · Quá hạn: '+m(s.overdue_debt)+'</p><p>Hạn mức: '+m(s.credit_limit)+' · Còn được lấy hàng: '+m(s.remaining_credit)+'</p><div class="finance-toolbar"><input id="debtQ" aria-label="Tìm hóa đơn" placeholder="Tìm số hóa đơn"><select id="debtStatus" aria-label="Trạng thái"><option value="">Tất cả</option><option value="UNPAID">Chưa thanh toán</option><option value="PARTIAL">Thanh toán một phần</option><option value="PAID">Đã thanh toán</option><option value="OVERDUE">Có nợ quá hạn</option></select><label>Từ ngày <input type="date" id="debtFrom"></label><label>Đến ngày <input type="date" id="debtTo"></label></div><div id="debtRows"></div>';
  function render(){const q=body.querySelector('#debtQ').value.toLowerCase(),status=body.querySelector('#debtStatus').value,from=body.querySelector('#debtFrom').value,to=body.querySelector('#debtTo').value;const list=data.invoices.filter(i=>i.invoice_number.toLowerCase().includes(q)&&(!status||(status==='OVERDUE'?i.overdue:i.status===status))&&(!from||i.issue_date>=from)&&(!to||i.issue_date<=to));body.querySelector('#debtRows').innerHTML=ui.table(['Hóa đơn','Ngày phát hành','Hạn thanh toán','Phải thu sau điều chỉnh','Đã thu','Còn nợ','Trạng thái','Thao tác'],list.map(i=>[e(i.invoice_number),e(i.issue_date),e(i.due_date),m(Number(i.total_amount)+Number(i.adjustment_amount)),m(i.paid_amount),m(i.outstanding),e(({UNPAID:'Chưa thanh toán',PARTIAL:'Thanh toán một phần',PAID:'Đã thanh toán',OVERDUE:'Quá hạn'})[i.status])+(i.overdue&&i.status==='PARTIAL'?' · Quá hạn':''),'<button data-invoice="'+i.id+'">Xem / tải PDF</button>']));}
  render();['debtQ','debtStatus','debtFrom','debtTo'].forEach(id=>body.querySelector('#'+id).oninput=render);
  body.onclick=async event=>{const button=event.target.closest('[data-invoice]');if(!button)return;button.disabled=true;try{const i=await apiRequest('dealer-debt/'+button.dataset.invoice);if(revision!==viewRevision)return;const html='<p>Hóa đơn: '+e(i.invoice_number)+'</p><p>Đại lý: '+e(i.customer_code+' · '+i.customer_name)+'</p><p>Mã số thuế: '+e(i.tax_code||'—')+'</p><p>Kỳ: '+e(i.period_from)+' – '+e(i.period_to)+'</p>'+ui.table(['Sản phẩm','Đơn vị','Thực giao','Đơn giá','Chiết khấu','Thành tiền'],i.lines.map(l=>[e(l.sku+' · '+l.name),e(l.unit_name),e(l.delivered_quantity),m(l.unit_price),m(l.discount_amount),m(l.line_total)]))+'<p>Tổng hóa đơn: '+m(i.total_amount)+'</p>'+ui.table(['Chứng từ điều chỉnh','Số tiền','Lý do'],i.adjustments.map(a=>[e(a.adjustment_number),m(a.amount),e(a.reason)]));const dialog=openFormDialog('Hóa đơn '+i.invoice_number,html+'<button type="button" id="debtPrint">In / Lưu PDF</button>',null);dialog.form.querySelector('#debtPrint').onclick=()=>ui.print('Hóa đơn bán hàng',html);}catch(error){showRequestError(error);}finally{button.disabled=false;}};
 });
}};
</script>
