<!-- Loaded by the application shell: ../index.html — S8-05 Dashboard điều hành bán hàng & kho -->
<style>
/* ===== S8-05 Dashboard: scoped under #db05 ===== */
#db05 { display: flex; flex-direction: column; gap: 24px; padding: 4px 0; font-family: 'Be Vietnam Pro', Arial, sans-serif; }
#db05 .db05-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
#db05 .db05-toolbar h2 { margin: 0; font-size: 18px; font-weight: 700; color: var(--ink, #17120e); }
#db05 .db05-toolbar small { display: block; font-size: 12px; font-weight: 400; color: var(--muted, #786d64); margin-top: 2px; }
#db05 .db05-refresh { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted, #786d64); }
#db05 .db05-refresh button { padding: 6px 14px; background: var(--orange, #f47a00); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s; }
#db05 .db05-refresh button:hover { background: var(--orange-dark, #d96500); }
#db05 .db05-refresh button:disabled { opacity: .6; cursor: default; }

/* Metric Cards */
#db05 .db05-metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
#db05 .db05-card { background: var(--panel, #fff); border: 1px solid var(--line, #eee4da); border-radius: 14px; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 2px 8px rgba(83,48,17,.05); transition: box-shadow .2s, transform .2s; position: relative; overflow: hidden; }
#db05 .db05-card:hover { box-shadow: 0 6px 20px rgba(83,48,17,.10); transform: translateY(-2px); }
#db05 .db05-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--card-accent, var(--orange, #f47a00)); border-radius: 14px 14px 0 0; }
#db05 .db05-card.accent-green::before  { --card-accent: #22c55e; }
#db05 .db05-card.accent-blue::before   { --card-accent: #3b82f6; }
#db05 .db05-card.accent-amber::before  { --card-accent: #f59e0b; }
#db05 .db05-card.accent-red::before    { --card-accent: #ef4444; }
#db05 .db05-card.accent-violet::before { --card-accent: #8b5cf6; }
#db05 .db05-card-icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; background: var(--orange-soft, #fff1df); color: var(--orange, #f47a00); flex-shrink: 0; }
#db05 .db05-card.accent-green  .db05-card-icon { background: #dcfce7; color: #16a34a; }
#db05 .db05-card.accent-blue   .db05-card-icon { background: #dbeafe; color: #2563eb; }
#db05 .db05-card.accent-amber  .db05-card-icon { background: #fef3c7; color: #d97706; }
#db05 .db05-card.accent-red    .db05-card-icon { background: #fee2e2; color: #dc2626; }
#db05 .db05-card.accent-violet .db05-card-icon { background: #ede9fe; color: #7c3aed; }
#db05 .db05-card-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted, #786d64); }
#db05 .db05-card-value { font-size: 22px; font-weight: 700; color: var(--ink, #17120e); min-height: 32px; display: flex; align-items: center; }
#db05 .db05-card-value.loading { background: linear-gradient(90deg, #eee4da 25%, #fff1df 50%, #eee4da 75%); background-size: 200% 100%; animation: db05-shimmer 1.4s infinite; border-radius: 6px; width: 80%; height: 28px; color: transparent; }
@keyframes db05-shimmer { 0%{background-position: 200% 0} 100%{background-position: -200% 0} }
#db05 .db05-card-sub { font-size: 11px; color: var(--muted, #786d64); }
#db05 .db05-card-value.error { font-size: 13px; color: #dc2626; font-weight: 500; }

/* Charts */
#db05 .db05-charts { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; }
@media (max-width: 900px) { #db05 .db05-charts { grid-template-columns: 1fr; } }
#db05 .db05-chart-box { background: var(--panel, #fff); border: 1px solid var(--line, #eee4da); border-radius: 14px; padding: 20px; box-shadow: 0 2px 8px rgba(83,48,17,.05); }
#db05 .db05-chart-title { font-size: 13px; font-weight: 700; color: var(--ink, #17120e); margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
#db05 .db05-chart-title span { font-size: 11px; font-weight: 500; color: var(--muted, #786d64); margin-left: auto; }
#db05 .db05-chart-sub { font-size: 11px; color: var(--muted, #786d64); margin: 0 0 16px; }
#db05 .db05-chart-wrap { position: relative; height: 220px; }
#db05 .db05-chart-wrap canvas { width: 100% !important; height: 100% !important; }
#db05 .db05-chart-placeholder { display: flex; align-items: center; justify-content: center; height: 220px; color: var(--muted, #786d64); font-size: 13px; }

/* Overdue Table */
#db05 .db05-section { background: var(--panel, #fff); border: 1px solid var(--line, #eee4da); border-radius: 14px; padding: 20px; box-shadow: 0 2px 8px rgba(83,48,17,.05); }
#db05 .db05-section-header { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
#db05 .db05-section-header h3 { margin: 0; font-size: 14px; font-weight: 700; color: var(--ink, #17120e); }
#db05 .db05-section-header p { margin: 4px 0 0; font-size: 11px; color: var(--muted, #786d64); }
#db05 .db05-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; background: #fee2e2; color: #dc2626; }
#db05 .db05-table-wrap { overflow-x: auto; }
#db05 .db05-table { width: 100%; border-collapse: collapse; font-size: 13px; }
#db05 .db05-table th { text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted, #786d64); border-bottom: 2px solid var(--line, #eee4da); white-space: nowrap; }
#db05 .db05-table td { padding: 10px 12px; color: var(--ink, #17120e); border-bottom: 1px solid var(--line, #eee4da); }
#db05 .db05-table tr:last-child td { border-bottom: none; }
#db05 .db05-table tr:hover td { background: var(--orange-soft, #fff1df); }
#db05 .db05-table .amount { font-weight: 700; color: #dc2626; text-align: right; }
#db05 .db05-table .days-late { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; background: #fef3c7; color: #d97706; }
#db05 .db05-table .days-late.critical { background: #fee2e2; color: #dc2626; }
#db05 .db05-empty { text-align: center; padding: 32px 0; color: var(--muted, #786d64); font-size: 13px; }
#db05 .db05-error-row { text-align: center; padding: 24px 0; color: #dc2626; font-size: 13px; }
</style>

<script>
(function(){
'use strict';
window.sprint5Features = window.sprint5Features || {};

var _chartDaily = null, _chartRegion = null;
var _chartJsPromise = window._db05ChartJsPromise || null;

function ensureChartJs(){
  if(_chartJsPromise) return _chartJsPromise;
  _chartJsPromise = new Promise(function(resolve, reject){
    if(window.Chart){ resolve(); return; }
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
  window._db05ChartJsPromise = _chartJsPromise;
  return _chartJsPromise;
}

function esc(s){
  if(s==null)return '\u2014';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function money(v){
  if(v==null)return '\u2014';
  return new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND'}).format(Number(v));
}
function num(v){
  if(v==null)return '\u2014';
  return new Intl.NumberFormat('vi-VN').format(Number(v));
}

function destroyCharts(){
  if(_chartDaily){ _chartDaily.destroy(); _chartDaily = null; }
  if(_chartRegion){ _chartRegion.destroy(); _chartRegion = null; }
}

function renderSkeleton(host){
  var today = new Date();
  var monthLabel = 'Tháng ' + (today.getMonth() + 1) + '/' + today.getFullYear();
  var dateLabel = today.toLocaleDateString('vi-VN', {day:'2-digit', month:'2-digit', year:'numeric'});
  var CARDS = [
    {id:'db05-today',        labelVI:'Doanh số hôm nay',        icon:'₫',  accent:''},
    {id:'db05-month',        labelVI:'Doanh số tháng này',      icon:'📈', accent:'accent-green'},
    {id:'db05-pend-approve', labelVI:'Đơn chờ duyệt',           icon:'⏳', accent:'accent-amber'},
    {id:'db05-pend-ship',    labelVI:'Đơn chờ xuất kho',        icon:'📦', accent:'accent-blue'},
    {id:'db05-overdue-amt',  labelVI:'Công nợ quá hạn',         icon:'⚠️', accent:'accent-red'},
    {id:'db05-low-sku',      labelVI:'SKU dưới tồn tối thiểu',  icon:'📉', accent:'accent-violet'},
  ];
  var cardsHtml = CARDS.map(function(c){
    return '<article class="db05-card ' + c.accent + '" aria-label="' + esc(c.labelVI) + '">' +
      '<div class="db05-card-icon">' + c.icon + '</div>' +
      '<div class="db05-card-label">' + esc(c.labelVI) + '</div>' +
      '<div class="db05-card-value loading" id="' + c.id + '">&#8203;</div>' +
      '<div class="db05-card-sub" id="' + c.id + '-sub"></div>' +
      '</article>';
  }).join('');

  host.innerHTML =
    '<div id="db05">' +
      '<div class="db05-toolbar">' +
        '<div><h2>Dashboard điều hành bán hàng &amp; kho</h2><small>Cập nhật tự động · ' + dateLabel + '</small></div>' +
        '<div class="db05-refresh"><span id="db05LastUpdate">Đang tải...</span><button id="db05BtnRefresh">↻ Làm mới</button></div>' +
      '</div>' +
      '<div class="db05-metrics" id="db05Metrics">' + cardsHtml + '</div>' +
      '<div class="db05-charts">' +
        '<div class="db05-chart-box">' +
          '<p class="db05-chart-title">Doanh số theo ngày <span>' + monthLabel + '</span></p>' +
          '<p class="db05-chart-sub">Giá trị đơn hàng đã xác nhận — đơn vị: VND</p>' +
          '<div class="db05-chart-wrap"><div class="db05-chart-placeholder" id="db05DailyPH">Đang tải biểu đồ...</div><canvas id="db05ChartDaily" style="display:none"></canvas></div>' +
        '</div>' +
        '<div class="db05-chart-box">' +
          '<p class="db05-chart-title">Doanh số theo khu vực <span>' + monthLabel + '</span></p>' +
          '<p class="db05-chart-sub">Tổng giá trị theo khu vực — tháng hiện tại</p>' +
          '<div class="db05-chart-wrap"><div class="db05-chart-placeholder" id="db05RegionPH">Đang tải biểu đồ...</div><canvas id="db05ChartRegion" style="display:none"></canvas></div>' +
        '</div>' +
      '</div>' +
      '<div class="db05-section">' +
        '<div class="db05-section-header">' +
          '<div><h3>Đại lý quá hạn công nợ</h3><p>Sắp xếp giảm dần theo số tiền còn nợ quá hạn · tối đa 50 đại lý</p></div>' +
          '<span class="db05-badge" id="db05Badge">Đang tải...</span>' +
        '</div>' +
        '<div class="db05-table-wrap"><div id="db05OverdueBody"><p class="db05-empty">Đang tải dữ liệu...</p></div></div>' +
      '</div>' +
    '</div>';

  document.getElementById('db05BtnRefresh').addEventListener('click', function(){
    window.sprint5Features['Dashboard kinh doanh'].render();
  });
}

function fillSummary(data){
  function set(id, val, sub){
    var el = document.getElementById(id);
    if(!el) return;
    el.classList.remove('loading', 'error');
    el.textContent = val;
    var se = document.getElementById(id + '-sub');
    if(se && sub) se.textContent = sub;
  }
  set('db05-today',        money(data.todayRevenue),  'Tính đến hiện tại hôm nay');
  set('db05-month',        money(data.monthRevenue),  'Đơn đã xác nhận trong tháng');
  set('db05-pend-approve', num(data.pendingApprove),  'Chờ nhân viên/quản lý duyệt');
  set('db05-pend-ship',    num(data.pendingShip),     'Đã duyệt, chưa xuất kho');
  set('db05-overdue-amt',  money(data.overdueAmount), 'Tổng nợ vượt ngày đến hạn');
  set('db05-low-sku',      num(data.lowSkuCount),     'Sản phẩm dưới ngưỡng tối thiểu');
}

function markErr(id){
  var el = document.getElementById(id);
  if(!el) return;
  el.classList.remove('loading');
  el.classList.add('error');
  el.textContent = 'Không tải được';
}

var COLORS = ['#f47a00','#3b82f6','#22c55e','#8b5cf6','#f59e0b','#06b6d4','#ec4899','#10b981','#ef4444','#64748b'];

function drawDaily(rows){
  var canvas = document.getElementById('db05ChartDaily');
  var ph = document.getElementById('db05DailyPH');
  if(!canvas) return;
  if(!rows || rows.length === 0){ if(ph) ph.textContent = 'Chưa có dữ liệu trong tháng này.'; return; }
  canvas.style.display = 'block'; if(ph) ph.style.display = 'none';
  var labels = rows.map(function(r){ var d = new Date(r.day); return (d.getDate()) + '/' + (d.getMonth() + 1); });
  var values = rows.map(function(r){ return Number(r.revenue); });
  _chartDaily = new Chart(canvas, {
    type: 'bar',
    data: { labels: labels, datasets: [{ label: 'Doanh số (VND)', data: values, backgroundColor: 'rgba(244,122,0,0.75)', borderColor: '#f47a00', borderWidth: 1.5, borderRadius: 5, borderSkipped: false }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(ctx){ return new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND'}).format(ctx.parsed.y); } } } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#786d64' } },
        y: { beginAtZero: true, grid: { color: '#eee4da' }, ticks: { font: { size: 11 }, color: '#786d64', callback: function(v){
          if(v>=1000000000) return (v/1000000000).toFixed(1) + 'B';
          if(v>=1000000) return (v/1000000).toFixed(0) + 'M';
          if(v>=1000) return (v/1000).toFixed(0) + 'K';
          return v;
        }}}
      }
    }
  });
}

function drawRegion(rows){
  var canvas = document.getElementById('db05ChartRegion');
  var ph = document.getElementById('db05RegionPH');
  if(!canvas) return;
  if(!rows || rows.length === 0){ if(ph) ph.textContent = 'Chưa có dữ liệu khu vực.'; return; }
  canvas.style.display = 'block'; if(ph) ph.style.display = 'none';
  var labels = rows.map(function(r){ return r.region || 'Không xác định'; });
  var values = rows.map(function(r){ return Number(r.revenue); });
  _chartRegion = new Chart(canvas, {
    type: 'doughnut',
    data: { labels: labels, datasets: [{ data: values, backgroundColor: rows.map(function(_,i){ return COLORS[i % COLORS.length]; }), borderWidth: 2, borderColor: '#fff', hoverOffset: 8 }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '62%',
      plugins: {
        legend: { position: 'right', labels: { font: { size: 11 }, color: '#17120e', padding: 10, boxWidth: 12 } },
        tooltip: { callbacks: { label: function(ctx){
          var total = ctx.dataset.data.reduce(function(a,b){ return a+b; }, 0);
          var pct = total ? ((ctx.parsed / total) * 100).toFixed(1) : 0;
          return ctx.label + ': ' + new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND'}).format(ctx.parsed) + ' (' + pct + '%)';
        }}}
      }
    }
  });
}

function renderOverdue(rows){
  var badge = document.getElementById('db05Badge');
  var body = document.getElementById('db05OverdueBody');
  if(badge) badge.textContent = rows.length + ' đại lý';
  if(!body) return;
  if(rows.length === 0){ body.innerHTML = '<p class="db05-empty">✓ Không có đại lý nào quá hạn công nợ.</p>'; return; }
  var html = rows.map(function(r, i){
    var days = Number(r.maxDaysLate) || 0;
    var cls = days > 60 ? ' critical' : '';
    return '<tr><td>' + (i + 1) + '</td><td><strong>' + esc(r.code) + '</strong></td><td>' + esc(r.name) + '</td><td>' + (esc(r.region) || '\u2014') + '</td><td class="amount">' + money(r.overdueAmount) + '</td><td>' + (esc(r.latestDue) || '\u2014') + '</td><td><span class="days-late' + cls + '">' + days + ' ngày</span></td></tr>';
  }).join('');
  body.innerHTML = '<table class="db05-table" aria-label="Đại lý quá hạn công nợ">' +
    '<thead><tr><th>#</th><th>Mã ĐL</th><th>Tên đại lý</th><th>Khu vực</th><th style="text-align:right">Số tiền quá hạn</th><th>Hạn cuối</th><th>Số ngày trễ</th></tr></thead>' +
    '<tbody>' + html + '</tbody></table>';
}

async function renderDashboard(){
  var host = moduleContent;
  destroyCharts();
  renderSkeleton(host);
  var revision = viewRevision;
  try {
    var sum = await apiRequest('dashboard/summary');
    if(revision !== viewRevision || !host.isConnected) return;
    fillSummary(sum);
  } catch(e) {
    ['db05-today','db05-month','db05-pend-approve','db05-pend-ship','db05-overdue-amt','db05-low-sku'].forEach(markErr);
  }

  try {
    var [daily, region] = await Promise.all([
      apiRequest('dashboard/daily'),
      apiRequest('dashboard/region')
    ]);
    await ensureChartJs();
    if(revision !== viewRevision || !host.isConnected) return;
    drawDaily(daily);
    drawRegion(region);
  } catch(e) {
    var p1 = document.getElementById('db05DailyPH'), p2 = document.getElementById('db05RegionPH');
    if(p1) p1.textContent = 'Không tải được biểu đồ.';
    if(p2) p2.textContent = 'Không tải được biểu đồ.';
  }

  try {
    var overdue = await apiRequest('dashboard/overdue');
    if(revision !== viewRevision || !host.isConnected) return;
    renderOverdue(overdue);
  } catch(e) {
    var b = document.getElementById('db05Badge'), ob = document.getElementById('db05OverdueBody');
    if(b) b.textContent = 'Lỗi';
    if(ob) ob.innerHTML = '<p class="db05-error-row">Không tải được danh sách đại lý quá hạn.</p>';
  }

  var ts = document.getElementById('db05LastUpdate');
  if(ts) {
    var now = new Date();
    ts.textContent = 'Cập nhật lúc ' + now.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  }
}

window.sprint5Features['Dashboard kinh doanh'] = {
  path: 'dashboard-kinh-doanh',
  permission: 'reports.sales',
  render: function(){
    renderDashboard();
  }
};
})();
</script>
