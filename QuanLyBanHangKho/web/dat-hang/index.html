  #dealerPortal .dp-field label { color: #334155; font-size: 13px; font-weight: 600; }
  #dealerPortal .dp-field select,
  #dealerPortal .dp-field input,

  #dealerPortal .dp-bar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; max-width: 980px; margin: 0 auto; }
  #dealerPortal .dp-total { flex: 1 1 200px; display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0; }
  #dealerPortal .dp-total dt { color: #7a8699; font-size: 11px; }
  #dealerPortal .dp-total dd { margin: 0; color: #172033; font-size: 14px; font-weight: 700; }
  #dealerPortal .dp-total .pay dd { color: var(--orange-dark, #d96500); font-size: 18px; }
  #dealerPortal .dp-total dd.neg { color: #b42318; }
  #dealerPortal .dp-bar .dp-btn { flex: 0 0 auto; min-width: 150px; min-height: 46px; }
  #dealerPortal .dp-orders { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
  #dealerPortal .dp-order { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 14px; border: 1px solid #e5eaf0; border-radius: 12px; background: #fff; font: inherit; text-align: left; cursor: pointer; }
  #dealerPortal .dp-order:hover { background: #fffaf6; }
  #dealerPortal .dp-order strong { display: block; color: #172033; }
  #dealerPortal .dp-order small { color: #7a8699; font-size: 12px; }
  #dealerPortal .dp-order .right { text-align: right; }
  #dealerPortal .dp-status { display: inline-block; margin-top: 3px; padding: 2px 8px; border-radius: 999px; background: #f2f4f7; color: #475467; font-size: 11px; font-weight: 700; }
  #dealerPortal .dp-status.s-PENDING_CONFIRM,
  #dealerPortal .dp-status.s-PENDING_APPROVAL { background: #fffaeb; color: #b54708; }
  #dealerPortal .dp-status.s-APPROVED,
  #dealerPortal .dp-status.s-PICKING { background: #eff8ff; color: #175cd3; }
  #dealerPortal .dp-status.s-SHIPPED,
  #dealerPortal .dp-status.s-DELIVERED,
  #dealerPortal .dp-status.s-CLOSED { background: #ecfdf3; color: #067647; }
  #dealerPortal .dp-status.s-REJECTED,
  #dealerPortal .dp-status.s-CANCELLED { background: #fef3f2; color: #b42318; }
  #dealerPortal .dp-detail-lines { width: 100%; border-collapse: collapse; font-size: 13px; }
  #dealerPortal .dp-detail-lines td { padding: 8px 0; border-bottom: 1px solid #edf1f5; vertical-align: top; }
  #dealerPortal .dp-detail-lines td:last-child { text-align: right; white-space: nowrap; }
  #dealerPortal .dp-detail-lines small { display: block; color: #8490a2; }

  #dealerPortal .dp-timeline li { margin-bottom: 8px; }
  #dealerPortal .dp-timeline small { display: block; color: #7a8699; }
  @media (max-width: 720px) {
    #dealerPortal .dp-hello,
    #dealerPortal .dp-section { padding: 14px 16px; }
    #dealerPortal .dp-credit div { padding: 10px 12px; }
    #dealerPortal .dp-credit dd { font-size: 13px; }
    #dealerPortal .dp-products { grid-template-columns: minmax(0, 1fr); }
    #dealerPortal .dp-product { min-width: 0; }
    #dealerPortal .dp-row { flex-wrap: wrap; }
    #dealerPortal .dp-row select { flex: 1 1 120px; }
    #dealerPortal .dp-row .dp-step { flex: 0 0 auto; }
    #dealerPortal .dp-bar .dp-btn { flex: 1 1 100%; }
  }
  @media (min-width: 1025px) { #dealerPortal { --dp-bar-left: 272px; } }
</style>
<script>
window.dealerPortalFeature = (() => {
  let generation = 0;
  let me = null;
  let products = [];
  let cart = [];
  let quote = null;
  let quoteSeq = 0;
  let quoteTimer = null;
  let submitting = false;
  let tab = 'order';

  const esc = (value) => escapeHtml(value == null ? '' : String(value));
  const money = (value) => value == null ? '—' : `${Number(value).toLocaleString('vi-VN', { maximumFractionDigits: 2 })} đ`;
  const num = (value) => Number(value).toLocaleString('vi-VN', { maximumFractionDigits: 6 });
  const when = (value) => value ? new Date(value).toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' }) : '—';
  const alive = (revision) => revision === generation && !!document.getElementById('dealerPortal');
  const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);

  async function render() {
    const revision = ++generation;
    ++quoteSeq;
    clearTimeout(quoteTimer);
    submitting = false;
    cart = [];
    quote = null;
    tab = 'order';
    moduleContent.innerHTML = '<section id="dealerPortal"><div class="dp-card dp-hello"><div><h2>Đang tải…</h2></div></div></section>';
    try {
      me = await apiRequest('portal/me');
      if (!alive(revision)) return;
      shell(revision);
    } catch (error) {
      if (alive(revision)) document.getElementById('dealerPortal').innerHTML = `<p class="dp-banner" role="alert">${esc(error.message)}</p>`;
    }
  }

  function creditCells(credit, after) {
    const limit = Number(credit.creditLimit);
    return `<div><dt>Công nợ hiện tại</dt><dd>${esc(money(credit.outstanding))}</dd></div>
      <div><dt>Hạn mức</dt><dd>${limit > 0 ? esc(money(limit)) : 'Thanh toán ngay'}</dd></div>
      <div><dt>${after == null ? 'Còn được nợ' : 'Còn được nợ sau đơn này'}</dt><dd class="${Number(after ?? credit.available) < 0 ? 'neg' : ''}">${esc(money(after ?? credit.available))}</dd></div>`;
  }

  function shell(revision) {
    const host = document.getElementById('dealerPortal');
    host.innerHTML = `<div class="dp-card">
        <div class="dp-hello"><div><h2>${esc(me.name)}</h2>
          <p>${esc(me.code)} · ${esc(me.groupName)}${me.priceList ? ` · ${esc(me.priceList.name)}` : ''}</p>
          <p>Nhân viên phụ trách: ${esc(me.salesRepName || 'chưa có')}${me.salesRepPhone ? ` · <a href="tel:${esc(me.salesRepPhone)}">${esc(me.salesRepPhone)}</a>` : ''}</p></div></div>
        <dl class="dp-credit" id="dpCredit">${creditCells(me.credit)}</dl>
      </div>
      ${!me.canOrder || me.cannotOrderReason ? `<p class="dp-banner" role="alert">${esc(me.cannotOrderReason || 'Hiện chưa đặt hàng được.')}</p>` : ''}
      <div class="dp-tabs" role="tablist">
        <button type="button" class="dp-tab" role="tab" id="dpTabOrder" aria-selected="${tab === 'order'}" aria-controls="dpPanel">Đặt hàng</button>
        <button type="button" class="dp-tab" role="tab" id="dpTabMine" aria-selected="${tab === 'mine'}" aria-controls="dpPanel">Đơn của tôi</button>
      </div>
      <div id="dpPanel" role="tabpanel"></div>`;
    document.getElementById('dpTabOrder').onclick = () => { tab = 'order'; shell(revision); };
    document.getElementById('dpTabMine').onclick = () => { tab = 'mine'; shell(revision); };
    if (tab === 'order') renderOrder(revision);
    else renderMine(revision);
  }

  // ----- Đặt hàng -----
  function renderOrder(revision) {
    const locked = !me.canOrder || !!me.cannotOrderReason;
    const points = me.deliveryPoints || [];
    document.getElementById('dpPanel').innerHTML = `<div class="dp-card">
        <div class="dp-section"><h3>Sản phẩm <small>giá theo nhóm ${esc(me.groupName)}</small></h3>
          <input class="dp-search" id="dpSearch" type="search" placeholder="Tìm theo tên hoặc mã sản phẩm" aria-label="Tìm sản phẩm" ${locked ? 'disabled' : ''}>
          <ul class="dp-products" id="dpProducts"><li class="dp-empty">Đang tải sản phẩm…</li></ul></div>
        <div class="dp-section"><h3>Giỏ hàng <small id="dpCartCount"></small></h3><ul class="dp-cart" id="dpCart"></ul></div>
        <div class="dp-section"><h3>Giao hàng</h3>
          <div class="dp-field"><label for="dpPoint">Điểm giao *</label>
            <select id="dpPoint">${points.length ? points.map((p) => `<option value="${esc(p.id)}" ${p.isDefault ? 'selected' : ''}>${esc(p.receiverName)} — ${esc(p.address)}</option>`).join('') : '<option value="">Chưa có điểm giao — liên hệ nhân viên phụ trách</option>'}</select></div>
          <div class="dp-field"><label for="dpDate">Ngày giao mong muốn *</label><input id="dpDate" type="date" min="${today()}"></div>
          <div class="dp-field"><label for="dpNote">Ghi chú</label><textarea id="dpNote" rows="2" maxlength="1000" placeholder="Ví dụ: giao buổi sáng, gọi trước khi đến"></textarea></div>
        </div>
      </div>
      <div class="dp-bar" id="dpBar"><div class="dp-bar-in">
        <dl class="dp-total" aria-live="polite">
          <div><dt>Tiền hàng</dt><dd id="dpSub">0 đ</dd></div>
          <div><dt>Chiết khấu</dt><dd id="dpDisc">0 đ</dd></div>
          <div class="pay"><dt>Phải thu</dt><dd id="dpPay">0 đ</dd></div>
          <div><dt>Còn được nợ sau đơn</dt><dd id="dpAfter">—</dd></div>
        </dl>
        <button type="button" class="dp-btn primary" id="dpSubmit" disabled>Gửi đơn</button>
      </div></div>`;
    let searchTimer;
    document.getElementById('dpSearch').addEventListener('input', (event) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => loadProducts(revision, event.target.value.trim()), 250);
    });
    document.getElementById('dpSubmit').onclick = () => submit(revision);
    loadProducts(revision, '');
    renderCart(revision);
  }

  async function loadProducts(revision, q) {
    const host = document.getElementById('dpProducts');
    try {
      products = await apiRequest(`portal/products?q=${encodeURIComponent(q)}`);
      if (!alive(revision) || !host.isConnected) return;
      const locked = !me.canOrder || !!me.cannotOrderReason;
      host.innerHTML = products.length ? products.map((p) => `<li class="dp-product" data-id="${esc(p.id)}">
          <div><strong>${esc(p.name)}</strong><small>${esc(p.sku)}</small></div>
          <div class="dp-price" data-price>${esc(money(p.price))} / ${esc(p.baseUnit)}</div>
          <div class="dp-row"><select aria-label="Đơn vị tính ${esc(p.name)}">${(p.units || []).map((u) => `<option value="${esc(u.id)}" data-factor="${esc(u.factor)}">${esc(u.name)}${Number(u.factor) !== 1 ? ` (${esc(num(u.factor))} ${esc(p.baseUnit)})` : ''}</option>`).join('')}</select>
            <span class="dp-step"><button type="button" data-step="-1" aria-label="Giảm">−</button><input type="number" min="1" step="1" value="1" inputmode="numeric" aria-label="Số lượng ${esc(p.name)}"><button type="button" data-step="1" aria-label="Tăng">+</button></span></div>
          <button type="button" class="dp-btn block" data-add ${locked ? 'disabled' : ''}>Thêm vào giỏ</button>
        </li>`).join('') : `<li class="dp-empty">${q ? 'Không có sản phẩm nào khớp.' : 'Chưa có sản phẩm trong bảng giá của đại lý.'}</li>`;
      host.querySelectorAll('.dp-product').forEach((card) => {
        const product = products.find((p) => String(p.id) === card.dataset.id);
        const select = card.querySelector('select');
        const input = card.querySelector('input');
        const price = card.querySelector('[data-price]');
        select.onchange = () => {
          const unit = product.units.find((u) => String(u.id) === select.value);
          price.textContent = `${money(Number(product.price) * Number(unit.factor))} / ${unit.name}`;
        };
        select.onchange();
        card.querySelectorAll('[data-step]').forEach((b) => b.onclick = () => { input.value = Math.max(1, (Number(input.value) || 1) + Number(b.dataset.step)); });
        card.querySelector('[data-add]').onclick = () => {
          const quantity = Math.floor(Number(input.value));
          if (!(quantity > 0)) { showToast('Số lượng phải lớn hơn 0', 'error'); input.focus(); return; }
          const unit = product.units.find((u) => String(u.id) === select.value);
          const existing = cart.find((c) => c.productId === product.id && c.unitId === unit.id);
          if (existing) existing.quantity += quantity;
          else cart.push({ productId: product.id, unitId: unit.id, quantity, name: product.name, sku: product.sku, units: product.units });
          input.value = 1;
          showToast(`Đã thêm ${product.name} vào giỏ`);
          renderCart(revision);
        };
      });
    } catch (error) {
      if (alive(revision) && host.isConnected) host.innerHTML = `<li class="dp-empty" role="alert">${esc(error.message)}</li>`;
    }
  }

  /** Vẽ lại giỏ hàng; requote=false khi vừa nhận kết quả tính tiền (tránh tính lại vòng lặp). */
  function renderCart(revision, requote = true) {
    if (requote) {
      ++quoteSeq;
      clearTimeout(quoteTimer);
      quote = null;
    }
    const host = document.getElementById('dpCart');
    if (!host) return;
    document.getElementById('dpCartCount').textContent = cart.length ? `${cart.length} dòng` : '';
    if (!cart.length) {
      host.innerHTML = '<li class="dp-empty">Giỏ hàng trống. Chọn sản phẩm ở trên để thêm vào giỏ.</li>';
      quote = null;
      renderTotals();
      return;
    }
    host.innerHTML = cart.map((c, index) => {
      const q = quote?.lines?.[index];
      const unit = c.units.find((u) => u.id === c.unitId);
      return `<li class="dp-line ${q?.stockShort ? 'short' : ''}" data-index="${index}">
        <div><strong>${esc(c.name)}</strong><small>${esc(c.sku)}${q ? ` · ${esc(money(q.unitPrice))} / ${esc(unit?.name)}` : ''}</small></div>
        <div class="amount"><strong>${q ? esc(money(q.payable)) : '…'}</strong>${q && Number(q.discount) > 0 ? `<small>Chiết khấu −${esc(money(q.discount))}</small>` : ''}</div>
        <div class="controls"><span class="dp-step"><button type="button" data-step="-1" aria-label="Giảm">−</button><input type="number" min="1" step="1" value="${esc(c.quantity)}" inputmode="numeric" aria-label="Số lượng ${esc(c.name)}"><button type="button" data-step="1" aria-label="Tăng">+</button></span>
          <span>${esc(unit?.name || '')}</span><button type="button" class="remove" data-remove>Xoá</button></div>
        ${q?.stockShort ? `<p class="warn" role="alert">${Number(q.maxQuantity) > 0 ? `Kho chỉ còn đặt được tối đa ${esc(num(q.maxQuantity))} ${esc(unit?.name || '')}.` : 'Mặt hàng tạm hết.'}</p>` : ''}
      </li>`;
    }).join('');
    host.querySelectorAll('.dp-line').forEach((row) => {
      const item = cart[Number(row.dataset.index)];
      const input = row.querySelector('input');
      const update = (value) => { item.quantity = Math.max(1, Math.floor(Number(value)) || 1); scheduleQuote(revision); };
      row.querySelectorAll('[data-step]').forEach((b) => b.onclick = () => { input.value = Math.max(1, (Number(input.value) || 1) + Number(b.dataset.step)); update(input.value); });
      input.onchange = () => update(input.value);
      row.querySelector('[data-remove]').onclick = () => { cart.splice(cart.indexOf(item), 1); quote = null; renderCart(revision); };
    });
    renderTotals();
    if (requote) scheduleQuote(revision);
  }

  function scheduleQuote(revision) {
    ++quoteSeq;
    quote = null;
    renderTotals();
    clearTimeout(quoteTimer);
    // Giỏ vừa đổi: chưa cho gửi tới khi máy chủ tính lại tiền và tồn.
    const submitButton = document.getElementById('dpSubmit');
    if (submitButton) submitButton.disabled = true;
    quoteTimer = setTimeout(() => runQuote(revision), 300);
  }

  async function runQuote(revision) {
    if (!cart.length || !alive(revision)) return;
    const seq = ++quoteSeq;
    try {
      const result = await apiRequest('portal/quote', jsonRequestOptions('POST', { lines: cart.map(({ productId, unitId, quantity }) => ({ productId, unitId, quantity })) }));
      if (seq !== quoteSeq || !alive(revision)) return;
      quote = result;
      renderCart(revision, false);
    } catch (error) {
      if (seq === quoteSeq && alive(revision)) showToast(error.message, 'error');
    }
  }

  function renderTotals() {
    const sub = document.getElementById('dpSub');
    if (!sub) return;
    sub.textContent = money(quote?.subtotal ?? 0);
    document.getElementById('dpDisc').textContent = Number(quote?.discount) > 0 ? '−' + money(quote.discount) : money(0);
    document.getElementById('dpPay').textContent = money(quote?.payable ?? 0);
    const after = quote?.credit?.remainingAfterOrder;
    const afterEl = document.getElementById('dpAfter');
    afterEl.textContent = after == null ? '—' : money(after);
    afterEl.classList.toggle('neg', after != null && Number(after) < 0);
    if (quote?.credit) document.getElementById('dpCredit').innerHTML = creditCells(quote.credit, quote.credit.remainingAfterOrder);
    const stockOk = !quote || quote.stock?.ok !== false;
    document.getElementById('dpSubmit').disabled = submitting || !cart.length || !quote || !stockOk || !me.canOrder || !!me.cannotOrderReason;
  }

  async function submit(revision) {
    if (submitting || !quote || !cart.length || !alive(revision)) return;
    const point = document.getElementById('dpPoint').value;
    const date = document.getElementById('dpDate').value;
    if (!point) { showToast('Chưa có điểm giao hàng. Hãy liên hệ nhân viên phụ trách', 'error'); return; }
    if (!date) { showToast('Vui lòng chọn ngày giao mong muốn', 'error'); document.getElementById('dpDate').focus(); return; }
    if (date < today()) { showToast('Ngày giao mong muốn không được ở quá khứ', 'error'); return; }
    const over = Number(quote?.credit?.remainingAfterOrder) < 0;
    if (!confirm(`Gửi đơn ${money(quote?.payable)} cho nhân viên phụ trách xác nhận?${over ? '\n\nĐơn vượt hạn mức công nợ nên có thể phải chờ quản lý duyệt.' : ''}`)) return;
    submitting = true;
    const button = document.getElementById('dpSubmit');
    button.disabled = true;
    button.textContent = 'Đang gửi…';
    try {
      const order = await apiRequest('portal/orders', jsonRequestOptions('POST', {
        deliveryPointId: Number(point), desiredDate: date, note: document.getElementById('dpNote').value.trim(),
        lines: cart.map(({ productId, unitId, quantity }) => ({ productId, unitId, quantity }))
      }));
      if (!alive(revision)) return;
      showToast(`Đã gửi đơn ${order.code} · ${order.statusLabel}`);
      cart = [];
      quote = null;
      me = await apiRequest('portal/me');
      if (!alive(revision)) return;
      tab = 'mine';
      submitting = false;
      shell(revision);
    } catch (error) {
      showToast(error.message, 'error');
      if (alive(revision)) {
        submitting = false;
        button.textContent = 'Gửi đơn';
        renderTotals();
      }
    }
  }

  // ----- Đơn của tôi -----
  async function renderMine(revision) {
    const panel = document.getElementById('dpPanel');
    panel.innerHTML = '<div class="dp-card dp-section"><p class="dp-empty">Đang tải đơn…</p></div>';
    try {
      const rows = await apiRequest('portal/orders');
      if (!alive(revision) || !panel.isConnected) return;
      panel.innerHTML = `<div class="dp-card dp-section"><h3>Đơn của tôi <small>${esc(rows.length)} đơn gần nhất</small></h3>
        ${rows.length ? `<ul class="dp-orders">${rows.map((o) => `<li><button type="button" class="dp-order" data-id="${esc(o.id)}">
          <span><strong>${esc(o.code)}</strong><small>${esc(when(o.createdAt))} · ${esc(o.lineCount)} dòng${o.source === 'STAFF' ? ' · NV lập' : ''}</small><small>Giao dự kiến: ${esc(o.desiredDate ? o.desiredDate.split('-').reverse().join('/') : 'Chưa xác định')}</small></span>
          <span class="right"><strong>${esc(money(o.payable))}</strong><span class="dp-status s-${esc(o.status)}">${esc(o.statusLabel)}</span></span>
        </button></li>`).join('')}</ul>` : '<p class="dp-empty">Chưa có đơn nào. Chọn tab Đặt hàng để đặt đơn đầu tiên.</p>'}</div>`;
      panel.querySelectorAll('.dp-order').forEach((b) => b.onclick = () => renderOrderDetail(revision, b.dataset.id));
    } catch (error) {
      if (alive(revision) && panel.isConnected) panel.innerHTML = `<p class="dp-banner" role="alert">${esc(error.message)}</p>`;
    }
  }

  async function renderOrderDetail(revision, id) {
    const panel = document.getElementById('dpPanel');
    try {
      const o = await apiRequest(`portal/orders/${encodeURIComponent(id)}`);
      if (!alive(revision) || !panel.isConnected) return;
      panel.innerHTML = `<div class="dp-card">
        <div class="dp-section"><button type="button" class="dp-btn" id="dpBack">← Đơn của tôi</button></div>
        <div class="dp-section"><h3>${esc(o.code)} <span class="dp-status s-${esc(o.status)}">${esc(o.statusLabel)}</span></h3>
          <p style="margin:0 0 12px;color:#64748b;font-size:13px">${esc(o.deliveryAddress)} · Giao ${esc(o.desiredDate ? o.desiredDate.split('-').reverse().join('/') : '—')}</p>
          <table class="dp-detail-lines"><tbody>${o.lines.map((l) => `<tr><td>${esc(l.name)}<small>${esc(num(l.quantity))} ${esc(l.unitName)} × ${esc(money(l.unitPrice))}${Number(l.discount) > 0 ? ` · CK −${esc(money(l.discount))}` : ''}</small><small>${l.deliveredQuantity == null ? 'Thực giao: chưa ghi nhận' : `Thực giao: ${esc(num(l.deliveredQuantity))} ${esc(l.unitName)}${l.deliveryShort ? ' · Giao thiếu' : ''}`}</small></td><td>${esc(money(l.payable))}</td></tr>`).join('')}
            <tr><td><strong>Phải thu</strong></td><td><strong>${esc(money(o.payable))}</strong></td></tr></tbody></table></div>
        <div class="dp-section"><h3>Tiến trình</h3><ol class="dp-timeline">${o.history.map((h) => `<li>${esc(h.toLabel)}<small>${esc(when(h.changedAt))}${h.reason ? ' · ' + esc(h.reason) : ''}</small></li>`).join('')}</ol>
          ${o.canCancel ? '<button type="button" class="dp-btn danger" id="dpCancel">Huỷ đơn</button>' : ''}</div>
      </div>`;
      document.getElementById('dpBack').onclick = () => renderMine(revision);
      document.getElementById('dpCancel')?.addEventListener('click', () => {
        const { form, close } = openFormDialog(`Huỷ đơn ${o.code}`,
          '<div class="form-group full"><label>Lý do huỷ *<textarea name="reason" maxlength="500" required placeholder="Ví dụ: đặt nhầm số lượng"></textarea></label></div><p class="s2-hint" style="grid-column:1/-1">Chỉ huỷ được khi nhân viên chưa xác nhận đơn.</p>', 'Huỷ đơn');
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const submitButton = form.querySelector('[type="submit"]');
          submitButton.disabled = true;
          try {
            await apiRequest(`portal/orders/${o.id}/cancel`, jsonRequestOptions('POST', { reason: form.reason.value }));
            close();
            showToast(`Đã huỷ đơn ${o.code}`);
            if (alive(revision)) renderOrderDetail(revision, o.id);
          } catch (error) {
            document.getElementById('s2FormError').textContent = error.message;
            submitButton.disabled = false;
          }
        });
      });
    } catch (error) {
      showToast(error.message, 'error');
    }
  }

  return { render };
})();
</script>
