<script>
const deliveryPointFeature = (() => {
  const state = {
    customer: null,
    points: [],
    editing: null,
    seq: 0,
    saving: false
  };

  let root = null;
  const ui = {};

  function el(tag, props, ...kids) {
    const e = document.createElement(tag);

    for (const [k, v] of Object.entries(props || {})) {
      if (k === "class") {
        e.className = v;
      } else if (k === "text") {
        e.textContent = v;
      } else if (k.startsWith("on")) {
        e.addEventListener(k.slice(2), v);
      } else if (v === true) {
        e.setAttribute(k, "");
      } else if (v !== false && v != null) {
        e.setAttribute(k, v);
      }
    }

    for (const kid of kids.flat()) {
      if (kid != null) e.append(kid);
    }

    return e;
  }

  const alive = (seq) =>
    root &&
    root.isConnected &&
    seq === state.seq;

  const debounce = (fn, ms) => {
    let t;

    return (...a) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...a), ms);
    };
  };

  function getInitial(name) {
    return String(name || "?")
      .trim()
      .charAt(0)
      .toUpperCase();
  }

  /* =======================================================
     SEARCH CUSTOMER
     ======================================================= */

  function showResults(items, emptyText, build) {
    ui.results.replaceChildren(
      ...(items.length
        ? items.map((i) => el("li", {}, build(i)))
        : [
            el("li", {
              class: "dp-none",
              text: emptyText
            })
          ])
    );

    ui.results.hidden = false;
  }

  function hideResults() {
    ui.results.hidden = true;
    ui.results.replaceChildren();
  }

  const searchCustomers = debounce(async () => {
    const seq = ++state.seq;

    try {
      const rows = await apiRequest(
        "delivery-points/customers?q=" +
        encodeURIComponent(ui.search.value.trim())
      );

      if (!alive(seq) || state.customer) return;

      showResults(
        rows,
        "Không tìm thấy đại lý phù hợp.",
        (c) =>
          el(
            "button",
            {
              type: "button",
              onclick: () => chooseCustomer(c)
            },

            el(
              "span",
              {},
              el("strong", {
                text: c.fullName
              }),
              el("small", {
                text: c.email || "Không có email"
              })
            ),

            el("span", {
              class: "dp-side",
              text:
                (c.phone ? c.phone + " • " : "") +
                c.pointCount +
                " điểm giao"
            })
          )
      );
    } catch (e) {
      if (root && root.isConnected) {
        showRequestError(e);
      }
    }
  }, 250);

  function chooseCustomer(c) {
    state.customer = {
      id: c.id,
      fullName: c.fullName,
      phone: c.phone || ""
    };

    state.editing = null;

    ui.search.value = "";
    hideResults();

    renderCustomer();
    loadPoints();
  }

  /* =======================================================
     CUSTOMER
     ======================================================= */

  function renderCustomer() {
    const c = state.customer;

    ui.chosen.hidden = !c;
    ui.searchBox.hidden = !!c;
    ui.pointsCard.hidden = !c;

    if (c) {
      ui.chosenName.textContent = c.fullName;
      ui.chosenPhone.textContent =
        c.phone || "Chưa có số điện thoại";
      ui.avatar.textContent = getInitial(c.fullName);
    } else {
      state.points = [];
      renderList();
    }

    renderForm();
  }

  /* =======================================================
     LOAD POINTS
     ======================================================= */

  async function loadPoints() {
    const seq = ++state.seq;

    ui.list.replaceChildren(
      el("p", {
        class: "dp-empty",
        text: "Đang tải điểm giao hàng..."
      })
    );

    try {
      const rows = await apiRequest(
        "delivery-points?customerId=" +
        state.customer.id
      );

      if (!alive(seq)) return;

      state.points = rows;
      renderList();
    } catch (e) {
      if (!alive(seq)) return;

      ui.list.replaceChildren(
        el("p", {
          class: "dp-error",
          role: "alert",
          text:
            e.message ||
            "Không tải được điểm giao hàng"
        })
      );
    }
  }

  /* =======================================================
     LIST
     ======================================================= */

  function renderList() {
    if (!state.customer) {
      ui.list.replaceChildren();
      return;
    }

    ui.count.textContent =
      state.points.length
        ? state.points.length + " điểm giao"
        : "Chưa có điểm giao";

    ui.list.replaceChildren(
      ...(
        state.points.length
          ? state.points.map(pointCard)
          : [
              el("p", {
                class: "dp-empty",
                text:
                  "Đại lý này chưa có điểm giao hàng. " +
                  "Bấm “Thêm điểm giao” để tạo điểm đầu tiên."
              })
            ]
      )
    );
  }

  function pointCard(p) {
    return el(
      "article",
      {
        class:
          "dp-point" +
          (p.isDefault ? " is-default" : "")
      },

      el(
        "div",
        { class: "dp-head" },

        el("strong", {
          text: p.receiverName
        }),

        p.isDefault
          ? el("span", {
              class: "dp-badge",
              text: "✓ Mặc định"
            })
          : null
      ),

      el(
        "a",
        {
          class: "dp-phone",
          href:
            "tel:" +
            String(p.phone).replace(
              /[^0-9+]/g,
              ""
            ),
          text: p.phone
        }
      ),

      el("p", {
        class: "dp-addr",
        text: p.address
      }),

      p.routeNote
        ? el("p", {
            class: "dp-note",
            text: "Đường đi: " + p.routeNote
          })
        : null,

      el(
        "div",
        { class: "dp-actions" },

        p.isDefault
          ? null
          : el("button", {
              type: "button",
              class: "dp-btn",
              text: "☆ Đặt mặc định",
              onclick: () => makeDefault(p)
            }),

        el("button", {
          type: "button",
          class: "dp-btn",
          text: "✎ Sửa",
          onclick: () => openForm(p)
        }),

        el("button", {
          type: "button",
          class: "dp-btn dp-danger",
          text: "Xóa",
          onclick: () => remove(p)
        })
      )
    );
  }

  /* =======================================================
     FORM
     ======================================================= */

  function openForm(p) {
    state.editing = p || "new";
    renderForm();

    setTimeout(() => {
      if (ui.receiver) ui.receiver.focus();
    }, 0);
  }

  function closeForm() {
    state.editing = null;
    renderForm();
  }

  function renderForm() {
    const open =
      state.editing !== null &&
      !!state.customer;

    ui.form.hidden = !open;
    ui.error.hidden = true;

    ui.addBtn.hidden =
      !state.customer || open;

    if (!open) return;

    const p =
      state.editing === "new"
        ? null
        : state.editing;

    ui.formTitle.textContent =
      p
        ? "Sửa điểm giao hàng"
        : "Thêm điểm giao hàng";

    ui.formDescription.textContent =
      p
        ? "Cập nhật thông tin điểm giao đang chọn."
        : "Nhập thông tin địa chỉ nhận hàng của đại lý.";

    ui.receiver.value =
      p ? p.receiverName : "";

    ui.phone.value =
      p ? p.phone : "";

    ui.address.value =
      p ? p.address : "";

    ui.note.value =
      p ? p.routeNote : "";

    ui.makeDefault.checked =
      p
        ? !!p.isDefault
        : state.points.length === 0;

    ui.makeDefault.disabled =
      !!(p && p.isDefault);
  }

  async function submitForm(ev) {
    ev.preventDefault();

    if (state.saving) return;

    const body = {
      customerId: state.customer.id,
      receiverName: ui.receiver.value.trim(),
      phone: ui.phone.value.trim(),
      address: ui.address.value.trim(),
      routeNote: ui.note.value.trim(),
      isDefault: ui.makeDefault.checked
    };

    const problem =
      !body.receiverName
        ? "Nhập tên người nhận."
        : !body.address
          ? "Nhập địa chỉ giao hàng."
          : !/^[0-9+(). -]{8,20}$/.test(body.phone)
            ? "Số điện thoại phải có 8 đến 20 chữ số."
            : "";

    if (problem) {
      ui.error.textContent = problem;
      ui.error.hidden = false;
      return;
    }

    const editing =
      state.editing !== "new"
        ? state.editing
        : null;

    state.saving = true;
    ui.save.disabled = true;

    try {
      await apiRequest(
        editing
          ? "delivery-points/" + editing.id
          : "delivery-points",

        jsonRequestOptions(
          editing ? "PUT" : "POST",
          body
        )
      );

      showToast(
        editing
          ? "Đã lưu thay đổi điểm giao"
          : "Đã thêm điểm giao hàng"
      );

      state.editing = null;
      renderForm();

      await loadPoints();
    } catch (e) {
      ui.error.textContent =
        e.message ||
        "Không thể lưu điểm giao hàng";

      ui.error.hidden = false;
    } finally {
      state.saving = false;
      ui.save.disabled = false;
    }
  }

  /* =======================================================
     DEFAULT
     ======================================================= */

  async function makeDefault(p) {
    try {
      await apiRequest(
        "delivery-points/" +
        p.id +
        "/default",

        jsonRequestOptions(
          "POST",
          {
            customerId:
              state.customer.id
          }
        )
      );

      showToast(
        'Đã đặt "' +
        p.receiverName +
        '" làm điểm giao mặc định'
      );

      await loadPoints();
    } catch (e) {
      showRequestError(e);
    }
  }

  /* =======================================================
     DELETE
     ======================================================= */

  async function remove(p) {
    const extra =
      p.isDefault &&
      state.points.length > 1
        ? "\nĐiểm mặc định sẽ chuyển sang điểm còn lại cũ nhất."
        : "";

    if (
      !confirm(
        'Xóa điểm giao "' +
        p.receiverName +
        '"?\n\n' +
        "Các đơn cũ vẫn giữ nguyên địa chỉ đã chọn." +
        extra
      )
    ) {
      return;
    }

    try {
      await apiRequest(
        "delivery-points/" +
        p.id +
        "?customerId=" +
        state.customer.id,
        {
          method: "DELETE"
        }
      );

      showToast("Đã xóa điểm giao hàng");

      await loadPoints();
    } catch (e) {
      showRequestError(e);
    }
  }

  /* =======================================================
     RENDER
     ======================================================= */

  function render() {
    state.customer = null;
    state.points = [];
    state.editing = null;

    ++state.seq;

    /* Search */
    ui.search = el("input", {
      id: "dpSearch",
      type: "search",
      autocomplete: "off",
      placeholder:
        "Tìm tên, số điện thoại hoặc email...",
      oninput: searchCustomers,
      onfocus: searchCustomers
    });

    ui.results = el("ul", {
      class: "dp-results",
      hidden: true
    });

    ui.searchBox = el(
      "div",
      {
        class: "dp-search-wrap"
      },
      ui.search,
      ui.results
    );

    /* Selected customer */
    ui.avatar = el("div", {
      class: "dp-avatar",
      text: "?"
    });

    ui.chosenName = el("strong");

    ui.chosenPhone = el("span");

    ui.chosen = el(
      "div",
      {
        class: "dp-chosen",
        hidden: true
      },

      ui.avatar,

      el(
        "div",
        {
          class: "dp-who"
        },
        ui.chosenName,
        ui.chosenPhone
      ),

      el("button", {
        type: "button",
        class: "dp-linkbtn",
        text: "Đổi đại lý",
        onclick: () => {
          state.customer = null;
          state.editing = null;

          renderCustomer();

          ui.search.focus();
          searchCustomers();
        }
      })
    );

    /* Form fields */
    ui.receiver = el("input", {
      id: "dpReceiver",
      type: "text",
      maxlength: "150",
      autocomplete: "off",
      placeholder:
        "Ví dụ: Anh Minh, thủ kho"
    });

    ui.phone = el("input", {
      id: "dpPhone",
      type: "tel",
      maxlength: "20",
      autocomplete: "off",
      placeholder: "09xxxxxxxx"
    });

    ui.address = el("textarea", {
      id: "dpAddress",
      rows: "2",
      maxlength: "500",
      placeholder:
        "Số nhà, đường, phường/xã, tỉnh/thành"
    });

    ui.note = el("textarea", {
      id: "dpNote",
      rows: "2",
      maxlength: "1000",
      placeholder:
        "Ví dụ: vào cổng sau, gọi trước 15 phút..."
    });

    ui.makeDefault = el("input", {
      id: "dpDefault",
      type: "checkbox"
    });

    ui.formTitle = el("h2");

    ui.formDescription = el("p", {
      class: "dp-sub"
    });

    ui.error = el("div", {
      class: "dp-error",
      role: "alert",
      hidden: true
    });

    ui.save = el("button", {
      type: "submit",
      class: "dp-btn dp-primary",
      text: "Lưu điểm giao"
    });

    ui.form = el(
      "form",
      {
        class: "dp-form",
        hidden: true,
        novalidate: true,
        onsubmit: submitForm
      },

      el(
        "div",
        {
          class: "dp-form-header"
        },
        ui.formTitle,
        ui.formDescription
      ),

      el(
        "div",
        {
          class: "dp-form-grid"
        },

        el(
          "div",
          {
            class: "dp-field"
          },
          el("label", {
            for: "dpReceiver",
            text: "Người nhận *"
          }),
          ui.receiver
        ),

        el(
          "div",
          {
            class: "dp-field"
          },
          el("label", {
            for: "dpPhone",
            text: "Số điện thoại *"
          }),
          ui.phone
        ),

        el(
          "div",
          {
            class: "dp-field full"
          },
          el("label", {
            for: "dpAddress",
            text: "Địa chỉ giao hàng *"
          }),
          ui.address
        ),

        el(
          "div",
          {
            class: "dp-field full"
          },
          el("label", {
            for: "dpNote",
            text: "Ghi chú đường đi"
          }),
          ui.note
        )
      ),

      el(
        "label",
        {
          class: "dp-check",
          for: "dpDefault"
        },
        ui.makeDefault,
        "Đặt làm điểm giao mặc định"
      ),

      ui.error,

      el(
        "div",
        {
          class: "dp-formbtns"
        },

        el("button", {
          type: "button",
          class: "dp-btn",
          text: "Hủy",
          onclick: closeForm
        }),

        ui.save
      )
    );

    /* List */
    ui.count = el("p", {
      class: "dp-count"
    });

    ui.addBtn = el("button", {
      type: "button",
      class: "dp-btn dp-primary",
      text: "+ Thêm điểm giao",
      onclick: () => openForm(null)
    });

    ui.list = el("div", {
      class: "dp-list"
    });

    ui.pointsCard = el(
      "section",
      {
        class: "dp-card",
        hidden: true
      },

      el(
        "div",
        {
          class: "dp-section-head"
        },

        el(
          "div",
          {
            class: "dp-section-title"
          },

          el("div", {
            class: "dp-section-icon",
            text: "⌖"
          }),

          el(
            "div",
            {},
            el("h2", {
              text: "Điểm giao hàng"
            }),
            ui.count
          )
        ),

        ui.addBtn
      ),

      ui.form,
      ui.list
    );

    /* Root */
    root = el(
      "div",
      {
        id: "deliveryPointFeature"
      },

      el(
        "section",
        {
          class: "dp-card"
        },

        el(
          "div",
          {
            class: "dp-customer-header"
          },

          el("div", {
            class: "dp-icon",
            text: "⌕"
          }),

          el(
            "div",
            {},
            el("h2", {
              text: "Chọn đại lý"
            }),
            el("p", {
              class: "dp-sub",
              text:
                "Chọn đại lý để quản lý các địa chỉ giao hàng."
            })
          )
        ),

        ui.searchBox,
        ui.chosen
      ),

      ui.pointsCard
    );

    moduleContent.replaceChildren(root);

    renderCustomer();
  }

  /* =======================================================
     CLOSE SEARCH WHEN CLICK OUTSIDE
     ======================================================= */

  document.addEventListener("click", (e) => {
    if (
      root &&
      root.isConnected &&
      ui.searchBox &&
      !ui.searchBox.contains(e.target)
    ) {
      hideResults();
    }
  });

  return {
    render
  };
})();
</script>
