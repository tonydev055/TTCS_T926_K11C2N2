<script>
(()=>{
 function render(dealer){const ui=financeUi,e=ui.e,m=ui.m,endpoint=dealer?'dealer-reconciliations':'reconciliations',name=dealer?'Xác nhận công nợ':'Đối chiếu công nợ';
  ui.screen(name,'Biên bản lưu số liệu tại thời điểm lập; phản hồi của đại lý được lưu tại máy chủ.',endpoint,(data,body,revision)=>{
   body.innerHTML=(dealer?'':'<button id="reconCreate" class="primary">Lập biên bản theo kỳ</button>')+ui.table(['Biên bản','Đại lý','Kỳ','Đầu kỳ','Tăng','Giảm','Cuối kỳ','Trạng thái','Thao tác'],data.items.map(r=>[e('BBĐC-'+r.id),e(r.customer_code+' · '+r.customer_name),e(r.period_from+' – '+r.period_to),m(r.opening_balance),m(r.debit),m(r.credit),m(r.closing_balance),e(({PENDING:'Chờ xác nhận',CONFIRMED:'Đã xác nhận',DISPUTED:'Phản hồi lệch'})[r.status]),'<button data-recon="'+r.id+'">Xem / In PDF</button>']));
   if(!dealer)body.querySelector('#reconCreate').onclick=()=>{const today=ui.date(),dialog=openFormDialog('Lập biên bản đối chiếu','<div class="form-group full"><label>Đại lý<select name="customerId" required>'+data.customers.map(c=>'<option value="'+c.id+'">'+e(c.code+' · '+c.name)+'</option>').join('')+'</select></label></div><div class="form-group"><label>Từ ngày<input name="from" type="date" required max="'+today+'" value="'+today.slice(0,7)+'-01"></label></div><div class="form-group"><label>Đến ngày<input name="to" type="date" required max="'+today+'" value="'+today+'"></label></div>','Lập biên bản');ui.bindForm(dialog,async form=>{await apiRequest(endpoint,jsonRequestOptions('POST',{customerId:form.customerId.value,from:form.from.value,to:form.to.value}));if(revision===viewRevision)render(dealer);});};
   body.onclick=async event=>{const button=event.target.closest('[data-recon]');if(!button)return;button.disabled=true;try{const r=await apiRequest(endpoint+'/'+button.dataset.recon);if(revision!==viewRevision)return;const html='<p>Biên bản BBĐC-'+e(r.id)+'</p><p>Đại lý: '+e(r.customer_code+' · '+r.customer_name)+'</p><p>Kỳ: '+e(r.period_from)+' – '+e(r.period_to)+'</p><p>Đầu kỳ: '+m(r.opening_balance)+' · Tăng: '+m(r.debit)+' · Giảm: '+m(r.credit)+' · Cuối kỳ: <strong>'+m(r.closing_balance)+'</strong></p>'+ui.table(['Ngày','Chứng từ','Nghiệp vụ','Phát sinh'],r.snapshot.events.map(v=>[e(v.event_date),e(v.reference),e(({INVOICE:'Hóa đơn',ADJUSTMENT:'Điều chỉnh hóa đơn',PAYMENT:'Thu tiền',REVERSAL:'Hoàn tác thu'})[v.kind]),m(v.amount)]))+'<p>Trạng thái: '+e(({PENDING:'Chờ xác nhận',CONFIRMED:'Đã xác nhận',DISPUTED:'Phản hồi lệch số liệu'})[r.status])+'</p>'+(r.responded_at?'<p>Người phản hồi: '+e(r.responded_by_name)+' · '+e(r.responded_at)+'</p>':'')+(r.status==='DISPUTED'?'<p>Số dư theo đại lý: '+m(r.dealer_balance)+' · Lý do: '+e(r.reason)+'</p>':'')+'<p>Đại diện công ty __________________ Đại diện đại lý __________________</p>';
    const dialog=openFormDialog('Biên bản đối chiếu',html+'<div class="finance-actions"><button type="button" id="reconPrint">In / Lưu PDF</button>'+(dealer&&r.status==='PENDING'?'<button type="button" id="reconConfirm">Xác nhận khớp</button><button type="button" id="reconDispute">Phản hồi lệch</button>':'')+'</div>',null);dialog.form.querySelector('#reconPrint').onclick=()=>ui.print('BIÊN BẢN ĐỐI CHIẾU CÔNG NỢ',html);
    if(dealer&&r.status==='PENDING'){
     dialog.form.querySelector('#reconConfirm').onclick=async event=>{if(!confirm('Xác nhận số dư cuối kỳ '+m(r.closing_balance)+' khớp sổ đại lý?'))return;event.target.disabled=true;try{await apiRequest(endpoint+'/'+r.id+'/response',jsonRequestOptions('POST',{status:'CONFIRMED',reason:''}));dialog.close();if(revision===viewRevision)render(dealer);}catch(error){showRequestError(error);event.target.disabled=false;}};
     dialog.form.querySelector('#reconDispute').onclick=()=>{dialog.close();const response=openFormDialog('Phản hồi lệch số liệu','<div class="form-group"><label>Số dư theo đại lý<input name="dealerBalance" type="number" step="0.01" required></label></div><div class="form-group full"><label>Lý do lệch<textarea name="reason" required maxlength="2000"></textarea></label></div>','Gửi phản hồi');ui.bindForm(response,async form=>{await apiRequest(endpoint+'/'+r.id+'/response',jsonRequestOptions('POST',{status:'DISPUTED',dealerBalance:form.dealerBalance.value,reason:form.reason.value}));if(revision===viewRevision)render(dealer);});};
    }
   }catch(error){showRequestError(error);}finally{button.disabled=false;}};
  });
 }
 window.sprint5Features=window.sprint5Features||{};
 sprint5Features['Đối chiếu công nợ']={path:'doi-chieu-cong-no',permission:'receivables.read',render:()=>render(false)};
 sprint5Features['Xác nhận công nợ']={path:'doi-chieu-cong-no',permission:'invoices.self',render:()=>render(true)};
})();
</script>
