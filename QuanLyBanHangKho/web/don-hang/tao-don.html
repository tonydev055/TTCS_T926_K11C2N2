<style>
#salesOrderFeatureRoot{
  --bg:#f5f2ed;
  --white:#fff;
  --surface:#f8fafc;
  --hover:#f1f5f9;
  --border:#e2e8f0;

  --orange:#f26522;
  --orange-dark:#c9460f;
  --orange-light:rgba(242,101,34,.10);

  --text:#1e293b;
  --text2:#475569;
  --text3:#64748b;

  --green:#0f8a63;
  --red:#c62828;

  /* chiều cao thanh tổng tiền (2 hàng) */
  --bottom:124px;

  --radius:10px;
  --radius-lg:16px;

  --shadow:
    0 8px 28px -4px rgba(0,0,0,.09),
    0 2px 8px -2px rgba(0,0,0,.04);
}

#salesOrderFeatureRoot{
  width:100%;
  min-height:100%;
  font-family:"Be Vietnam Pro",Arial,sans-serif;
  color:var(--text);
}

#salesOrderFeatureRoot *,
#salesOrderFeatureRoot *::before,
#salesOrderFeatureRoot *::after{
  box-sizing:border-box;
}

#salesOrderFeatureRoot button,
#salesOrderFeatureRoot input,
#salesOrderFeatureRoot select,
#salesOrderFeatureRoot textarea{
  font:inherit;
  color:inherit;
}

#salesOrderFeatureRoot button{
  cursor:pointer;
}

#salesOrderFeatureRoot button:disabled,
#salesOrderFeatureRoot input:disabled,
#salesOrderFeatureRoot select:disabled{
  cursor:not-allowed;
}

#salesOrderFeatureRoot [hidden]{
  display:none!important;
}

#salesOrderFeatureRoot :focus-visible{
  outline:3px solid rgba(242,101,34,.25);
  outline-offset:2px;
}

/* =========================================================
   CONTENT
   ========================================================= */

#salesOrderFeatureRoot .order-content{
  width:min(1100px,calc(100% - 48px));
  margin:0 auto;
  padding:26px 0 calc(var(--bottom) + 34px);

  display:grid;
  gap:18px;
}

#salesOrderFeatureRoot .page-intro-row{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
}

#salesOrderFeatureRoot .page-intro h2{
  margin:0;
  font-size:21px;
  font-weight:700;
}

#salesOrderFeatureRoot .page-intro p{
  margin:7px 0 0;
  color:var(--text3);
  font-size:12px;
}

#salesOrderFeatureRoot .page-actions{
  display:flex;
  gap:8px;
}

#salesOrderFeatureRoot .card{
  padding:20px;
  background:var(--white);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
}

#salesOrderFeatureRoot .card h2{
  display:flex;
  align-items:center;
  gap:7px;
  margin:0 0 18px;
  font-size:15px;
}

#salesOrderFeatureRoot .count{
  color:var(--text3);
  font-size:12px;
  font-weight:500;
}

#salesOrderFeatureRoot .card label{
  display:block;
  margin:15px 0 7px;
  color:var(--text2);
  font-size:12px;
  font-weight:600;
}

#salesOrderFeatureRoot .card label:first-of-type{
  margin-top:0;
}

#salesOrderFeatureRoot input,
#salesOrderFeatureRoot select,
#salesOrderFeatureRoot textarea{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:#fff;
}

#salesOrderFeatureRoot input,
#salesOrderFeatureRoot select{
  min-height:42px;
  padding:0 12px;
}

#salesOrderFeatureRoot textarea{
  padding:10px 12px;
  resize:vertical;
}

#salesOrderFeatureRoot input::placeholder,
#salesOrderFeatureRoot textarea::placeholder{
  color:#94a3b8;
}

#salesOrderFeatureRoot input:focus,
#salesOrderFeatureRoot select:focus,
#salesOrderFeatureRoot textarea:focus{
  outline:none;
  border-color:var(--orange);
  box-shadow:0 0 0 3px rgba(242,101,34,.10);
}

#salesOrderFeatureRoot input:disabled,
#salesOrderFeatureRoot select:disabled{
  background:#f8fafc;
  color:#94a3b8;
}

/* =========================================================
   CUSTOMER
   ========================================================= */

#salesOrderFeatureRoot .chosen{
  min-height:54px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px 12px;
  border:1px solid #fed7aa;
  border-radius:9px;
  background:#fff7ed;
}

#salesOrderFeatureRoot .who{
  display:flex;
  flex-direction:column;
}

#salesOrderFeatureRoot .who strong{
  color:#9a3412;
  font-size:13px;
}

#salesOrderFeatureRoot .who span{
  margin-top:2px;
  color:#c2410c;
  font-size:11px;
}

#salesOrderFeatureRoot .linkbtn{
  padding:6px 9px;
  border:0;
  border-radius:6px;
  background:transparent;
  color:var(--orange-dark);
  font-size:12px;
  font-weight:600;
}

#salesOrderFeatureRoot .linkbtn:hover{
  background:#ffedd5;
}

/* =========================================================
   SEARCH
   ========================================================= */

#salesOrderFeatureRoot #customerSearch{
  position:relative;
}

/* Kết quả tìm sản phẩm bám theo khung Hàng hoá, không tràn ra ngoài (để thấy giá và nhãn "Chưa có giá"). */
#salesOrderFeatureRoot section[aria-labelledby="hLines"]{
  position:relative;
}

#salesOrderFeatureRoot #productResults{
  left:20px;
  right:20px;
  width:auto;
}

@media(max-width:720px){
  #salesOrderFeatureRoot #productResults{
    left:16px;
    right:16px;
  }
}

#salesOrderFeatureRoot .results{
  position:absolute;
  z-index:40;
  width:100%;
  margin:5px 0 0;
  padding:5px;
  list-style:none;
  background:#fff;
  border:1px solid var(--border);
  border-radius:10px;
  box-shadow:0 12px 30px rgba(15,23,42,.13);
  max-height:280px;
  overflow:auto;
}

#salesOrderFeatureRoot .results li{
  margin:0;
  padding:0;
}

#salesOrderFeatureRoot .results button{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px;
  border:0;
  border-radius:7px;
  background:#fff;
  text-align:left;
}

#salesOrderFeatureRoot .results button:hover{
  background:var(--hover);
}

#salesOrderFeatureRoot .results .main{
  min-width:0;
  display:flex;
  flex-direction:column;
}

#salesOrderFeatureRoot .results strong{
  font-size:12px;
}

#salesOrderFeatureRoot .results small{
  margin-top:2px;
  color:var(--text3);
  font-size:10px;
}

#salesOrderFeatureRoot .results .side{
  flex:none;
  color:var(--text2);
  font-size:11px;
}

#salesOrderFeatureRoot .results .none{
  padding:12px;
  color:var(--text3);
  font-size:11px;
}

/* =========================================================
   MESSAGE
   ========================================================= */

#salesOrderFeatureRoot .hint{
  margin:7px 0 0;
  color:var(--text3);
  font-size:11px;
}

#salesOrderFeatureRoot .lock-warn{
  margin-top:8px;
  padding:10px 12px;
  border:1px solid #fecaca;
  border-radius:8px;
  background:#fef2f2;
  color:#991b1b;
  font-size:12px;
  line-height:1.45;
}

/* S4-02: công nợ của đại lý */
#salesOrderFeatureRoot .credit{
  margin-top:10px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--surface);
}

#salesOrderFeatureRoot .credit-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin:0;
}

#salesOrderFeatureRoot .credit-grid dt{
  color:var(--text3);
  font-size:10px;
}

#salesOrderFeatureRoot .credit-grid dd{
  margin:3px 0 0;
  color:var(--text);
  font-size:13px;
  font-weight:700;
}

#salesOrderFeatureRoot .credit-grid dd.neg{
  color:var(--red);
}

#salesOrderFeatureRoot .credit .lock-warn{
  margin-top:10px;
}

@media(max-width:720px){
  #salesOrderFeatureRoot .credit-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

#salesOrderFeatureRoot .lock-tag{
  display:inline-block;
  margin-left:6px;
  padding:1px 6px;
  border-radius:999px;
  background:#fee2e2;
  color:#b91c1c;
  font-size:10px;
  font-weight:600;
}

#salesOrderFeatureRoot .msg{
  margin-top:12px;
  padding:10px 12px;
  border-radius:8px;
  background:#fef2f2;
  color:#991b1b;
  font-size:11px;
}

/* =========================================================
   ORDER LINES
   ========================================================= */

#salesOrderFeatureRoot .lines{
  display:grid;
  gap:10px;
  margin-top:14px;
}

#salesOrderFeatureRoot .empty{
  margin:14px 0 0;
  padding:15px;
  border:1px dashed #cbd5e1;
  border-radius:9px;
  background:#f8fafc;
  color:var(--text3);
  text-align:center;
  font-size:11px;
}

#salesOrderFeatureRoot .line{
  padding:14px;
  border:1px solid var(--border);
  border-radius:11px;
  background:#fff;
}

#salesOrderFeatureRoot .line-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

#salesOrderFeatureRoot .nm{
  display:flex;
  flex-direction:column;
}

#salesOrderFeatureRoot .nm strong{
  font-size:13px;
}

#salesOrderFeatureRoot .nm small{
  margin-top:3px;
  color:var(--text3);
  font-size:10px;
}

#salesOrderFeatureRoot .rm{
  width:28px;
  height:28px;
  border:0;
  border-radius:7px;
  background:#fef2f2;
  color:#b91c1c;
  font-size:18px;
}

#salesOrderFeatureRoot .rm:hover{
  background:#fee2e2;
}

#salesOrderFeatureRoot .line-ctl{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:12px;
}

#salesOrderFeatureRoot .line-ctl select{
  width:auto!important;
  min-width:150px;
}

#salesOrderFeatureRoot .stepper{
  display:flex;
  align-items:center;
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
}

#salesOrderFeatureRoot .stepper button{
  width:34px;
  height:38px;
  border:0;
  background:#f8fafc;
  font-size:16px;
}

#salesOrderFeatureRoot .stepper button:hover{
  background:var(--hover);
}

#salesOrderFeatureRoot .stepper input{
  width:52px!important;
  min-height:38px!important;
  border:0!important;
  border-left:1px solid var(--border)!important;
  border-right:1px solid var(--border)!important;
  border-radius:0!important;
  text-align:center;
}

#salesOrderFeatureRoot .unitprice{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px 12px;
  margin-top:12px;
  color:var(--text3);
  font-size:11px;
}

/* S4-01: đơn giá sửa được, giá bảng giá / giá sàn */
#salesOrderFeatureRoot .price-field{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0;
  color:var(--text2);
  font-size:12px;
  font-weight:600;
}

#salesOrderFeatureRoot .price-field input{
  width:140px!important;
  min-height:36px!important;
  text-align:right;
}

#salesOrderFeatureRoot .price-field input.overridden{
  border-color:var(--orange)!important;
  background:var(--orange-light)!important;
}

#salesOrderFeatureRoot .price-meta{
  color:var(--text3);
  font-size:11px;
}

#salesOrderFeatureRoot .price-reset{
  padding:0;
  font-size:11px;
}

#salesOrderFeatureRoot .floor-warn{
  margin:8px 0 0;
  padding:8px 10px;
  border:1px solid #fde68a;
  border-radius:8px;
  background:#fffbeb;
  color:#92400e;
  font-size:11px;
  line-height:1.45;
}

/* S4-03: tồn khả dụng */
#salesOrderFeatureRoot .stock-warn{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px 10px;
  margin:8px 0 0;
  padding:8px 10px;
  border:1px solid #fecaca;
  border-radius:8px;
  background:#fef2f2;
  color:#991b1b;
  font-size:11px;
  line-height:1.45;
}

#salesOrderFeatureRoot .stock-warn button{
  padding:0;
  font-size:11px;
}

#salesOrderFeatureRoot .stock-note{
  margin:6px 0 0;
  color:var(--text3);
  font-size:11px;
}

#salesOrderFeatureRoot .stock-note.bad{
  margin-top:12px;
  padding:10px 12px;
  border:1px solid #fecaca;
  border-radius:8px;
  background:#fef2f2;
  color:#991b1b;
  font-size:12px;
}

/* S4-05: ý kiến của quản lý khi trả lại đơn để sửa */
#salesOrderFeatureRoot .return-note{
  margin:0 0 16px;
  padding:12px 14px;
  border:1px solid #fde68a;
  border-left:4px solid #f59e0b;
  border-radius:10px;
  background:#fffbeb;
  color:#78350f;
  font-size:12px;
  line-height:1.5;
}

#salesOrderFeatureRoot .return-note strong{
  display:block;
  margin-bottom:3px;
  font-size:13px;
}

#salesOrderFeatureRoot .return-note q{
  display:block;
  margin-top:4px;
  color:#451a03;
  font-size:13px;
  white-space:pre-line;
  quotes:none;
}

#salesOrderFeatureRoot .approval-note{
  margin-top:12px;
  padding:10px 12px;
  border:1px solid #fde68a;
  border-radius:8px;
  background:#fffbeb;
  color:#92400e;
  font-size:12px;
  line-height:1.5;
}

#salesOrderFeatureRoot .approval-note strong{
  display:block;
  margin-bottom:4px;
}

#salesOrderFeatureRoot .approval-note ul{
  margin:0;
  padding-left:18px;
}

#salesOrderFeatureRoot .results button.unpriced{
  cursor:not-allowed;
  opacity:.7;
}

#salesOrderFeatureRoot .results button.unpriced .side{
  color:#b45309;
  font-weight:600;
}

#salesOrderFeatureRoot .calc{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:12px 0 0;
}

#salesOrderFeatureRoot .calc > div{
  padding:9px 10px;
  border-radius:8px;
  background:#f8fafc;
}

#salesOrderFeatureRoot .calc dt{
  margin-bottom:3px;
  color:var(--text3);
  font-size:9px;
}

#salesOrderFeatureRoot .calc dd{
  margin:0;
  font-size:12px;
  font-weight:600;
}

#salesOrderFeatureRoot .calc dd.off{
  color:var(--text3);
  font-weight:500;
}

#salesOrderFeatureRoot .calc dd.cut{
  color:var(--green);
}

/* =========================================================
   BOTTOM BAR
   Hàng 1:  Tiền hàng | Chiết khấu | Phải thu  (sát mép trái/phải)
   Hàng 2:  [ Lưu nháp ] [ Gửi đơn ]      (căn giữa)

   left + width do JS (syncOrderBottomBar) gán theo .order-content
   nên thanh luôn khớp mép trái/phải của form.
   ========================================================= */

#salesOrderFeatureRoot .order-bottom-wrap{
  position:fixed;
  z-index:60;
  bottom:0;
  left:0;
  width:100%;
  pointer-events:none;
}

#salesOrderFeatureRoot .order-bottom-wrap .bar{
  width:100%;
  background:rgba(255,255,255,.98);
  border:1px solid var(--border);
  border-bottom:0;
  border-radius:14px 14px 0 0;
  box-shadow:0 -6px 20px rgba(15,23,42,.08);
  backdrop-filter:blur(8px);
  pointer-events:auto;
}

#salesOrderFeatureRoot .order-bottom-wrap .bar-in{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:12px 20px 14px;
}

/* --- hàng 1: 3 cột đều nhau --- */
#salesOrderFeatureRoot .order-bottom-wrap .sum{
  width:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:0;
  padding:0;
}

#salesOrderFeatureRoot .order-bottom-wrap .sum > div{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:3px;
}

/* cột 1 sát trái, cột 2 giữa, cột 3 sát phải */
#salesOrderFeatureRoot .order-bottom-wrap .sum > div:nth-child(1){
  align-items:flex-start;
  text-align:left;
}
#salesOrderFeatureRoot .order-bottom-wrap .sum > div:nth-child(2){
  align-items:center;
  text-align:center;
}
#salesOrderFeatureRoot .order-bottom-wrap .sum > div:nth-child(3){
  align-items:flex-end;
  text-align:right;
}

#salesOrderFeatureRoot .order-bottom-wrap .sum dt{
  margin:0;
  color:var(--text3);
  font-size:11px;
  font-weight:600;
}

#salesOrderFeatureRoot .order-bottom-wrap .sum dd{
  margin:0;
  color:#334155;
  font-size:15px;
  font-weight:700;
  white-space:nowrap;
}

#salesOrderFeatureRoot .order-bottom-wrap .sum .pay dd{
  color:var(--green);
  font-size:17px;
}

#salesOrderFeatureRoot .order-bottom-wrap .sum.busy dd{
  opacity:.55;
}

/* --- hàng 2: 2 nút giữa --- */
#salesOrderFeatureRoot .order-bottom-wrap .order-actions{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin:0;
  padding:0;
}

#salesOrderFeatureRoot .order-bottom-wrap .order-actions button{
  width:160px;
  height:40px;
  padding:0 14px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}

#salesOrderFeatureRoot .order-bottom-wrap #btnSave{
  border:1px solid #dbe2e8;
  background:#f8fafc;
  color:#475569;
}

#salesOrderFeatureRoot .order-bottom-wrap #btnSave:hover:not(:disabled){
  background:#f1f5f9;
}

#salesOrderFeatureRoot .order-bottom-wrap #btnComplete{
  border:1px solid #bfdcc9;
  background:#f3f9f5;
  color:#3f7a58;
}

#salesOrderFeatureRoot .order-bottom-wrap #btnComplete:hover:not(:disabled){
  background:#e4f3e9;
}

#salesOrderFeatureRoot .order-bottom-wrap .order-actions button:disabled{
  opacity:.6;
}

@media(max-width:720px){
  #salesOrderFeatureRoot{
    --bottom:132px;
  }

  #salesOrderFeatureRoot .order-bottom-wrap .bar{
    border-radius:12px 12px 0 0;
  }

  #salesOrderFeatureRoot .order-bottom-wrap .bar-in{
    padding:10px 12px 12px;
    gap:10px;
  }

  #salesOrderFeatureRoot .order-bottom-wrap .sum{
    gap:8px;
  }

  #salesOrderFeatureRoot .order-bottom-wrap .sum dt{
    font-size:10px;
  }

  #salesOrderFeatureRoot .order-bottom-wrap .sum dd{
    font-size:13px;
  }

  #salesOrderFeatureRoot .order-bottom-wrap .sum .pay dd{
    font-size:14px;
  }

  #salesOrderFeatureRoot .order-bottom-wrap .order-actions{
    gap:8px;
  }

  #salesOrderFeatureRoot .order-bottom-wrap .order-actions button{
    width:auto;
    flex:1 1 0;
    min-width:0;
  }
}

/* =========================================================
   DRAFT SHEET
   ========================================================= */

#salesOrderFeatureRoot .sheet{
  position:fixed;
  inset:0;
  z-index:200;

  display:flex;
  justify-content:flex-end;

  background:rgba(15,23,42,.35);
}

#salesOrderFeatureRoot .sheet-panel{
  width:min(460px,100%);
  height:100%;

  display:flex;
  flex-direction:column;

  background:#fff;

  box-shadow:-12px 0 35px rgba(15,23,42,.15);
}

#salesOrderFeatureRoot .sheet-head{
  min-height:68px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 20px;

  border-bottom:1px solid var(--border);
}

#salesOrderFeatureRoot .sheet-head h2{
  margin:0;
  font-size:15px;
}

#salesOrderFeatureRoot .sheet-body{
  flex:1;
  padding:15px;
  overflow:auto;
}

#salesOrderFeatureRoot .draft{
  width:100%;
  display:block;
  margin-bottom:8px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:9px;
  background:#fff;
  text-align:left;
}

#salesOrderFeatureRoot .draft:hover{
  background:var(--hover);
}

#salesOrderFeatureRoot .draft .r1{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  font-weight:600;
}

#salesOrderFeatureRoot .draft .r2{
  margin-top:5px;
  color:var(--text3);
  font-size:10px;
}

/* =========================================================
   GATE
   ========================================================= */

#salesOrderFeatureRoot .gate{
  width:min(560px,calc(100% - 48px));
  margin:90px auto;
  padding:32px;

  background:#fff;

  border:1px solid var(--border);
  border-radius:16px;

  box-shadow:var(--shadow);

  text-align:center;
}

#salesOrderFeatureRoot .gate h1{
  margin:0;
  font-size:20px;
}

#salesOrderFeatureRoot .gate p{
  margin:10px 0 20px;
  color:var(--text3);
  font-size:13px;
}

#salesOrderFeatureRoot .gate a{
  display:inline-flex;
  align-items:center;
  min-height:40px;
  padding:0 16px;
  border-radius:8px;
  background:var(--orange);
  color:#fff;
  text-decoration:none;
  font-size:12px;
  font-weight:600;
}

/* =========================================================
   TOAST
   ========================================================= */

#salesOrderFeatureRoot .toast{
  position:fixed;
  z-index:300;
  right:22px;
  bottom:calc(var(--bottom) + 18px);

  max-width:360px;

  padding:11px 14px;

  border-radius:9px;

  background:#0f172a;
  color:#fff;

  box-shadow:0 10px 25px rgba(15,23,42,.2);

  font-size:11px;
}

#salesOrderFeatureRoot .toast.error{
  background:#b91c1c;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:900px){
  #salesOrderFeatureRoot .order-content{
    width:calc(100% - 32px);
  }
}

@media(max-width:720px){
  #salesOrderFeatureRoot .order-content{
    width:calc(100% - 24px);
    padding-top:18px;
  }

<script>
window.salesOrderFeature = (() => {

  'use strict';

  /* ========================================================
     API
     ======================================================== */

  /*
   * Module này chạy trong: /QuanLyBanHangKho/
   * BASE phải lấy context root.
   */

  const path = window.location.pathname || '/';

  const BASE =
    path.endsWith('/')
      ? path.slice(0, -1)
      : path.substring(
          0,
          path.lastIndexOf('/')
        );

  const API =
    BASE + '/api/sales-orders';

  const POINTS_API =
    BASE + '/api/delivery-points';

  const HOME =
    BASE + '/';


  /* ========================================================
     HELPERS
     ======================================================== */

  const $ = id =>
    document.getElementById(id);


  const nf =
    new Intl.NumberFormat(
      'vi-VN',
      {
        maximumFractionDigits:2
      }
    );


  const money = value =>
    nf.format(Number(value) || 0) + ' đ';


  function el(
    tag,
    props = {},
    ...children
  ){

    const node =
      document.createElement(tag);

    Object.entries(props).forEach(
      ([key,value]) => {

        if(key === 'class'){
          node.className = value;
          return;
        }

        if(key === 'text'){
          node.textContent = value;
          return;
        }

        if(key.startsWith('on')){
          node.addEventListener(
            key.slice(2),
            value
          );
          return;
        }

        if(value === true){
          node.setAttribute(key,'');
          return;
        }

        if(
          value !== false &&
          value != null
        ){
          node.setAttribute(
            key,
            value
          );
        }

      }
    );


    children
      .flat()
      .forEach(child => {

        if(child != null){
          node.append(child);
        }

      });


    return node;
  }


  function debounce(
    fn,
    ms
  ){

    let timer;

    return (...args) => {

      clearTimeout(timer);

      timer =
        setTimeout(
          () => fn(...args),
          ms
        );

    };
  }


  /* ========================================================
     REQUEST
     ======================================================== */

  let renderRevision = -1;
  const isActive = revision => revision === viewRevision && !!document.getElementById('salesOrderFeatureRoot');
  let disabledControls = [];
  function setSaving(busy) {
    S.saving = busy;
    if (busy) {
      disabledControls = [...document.getElementById('salesOrderFeatureRoot').querySelectorAll('button,input,select,textarea')]
        .map(node => [node, node.disabled]);
      disabledControls.forEach(([node]) => { node.disabled = true; });
    } else {
      disabledControls.forEach(([node, disabled]) => { node.disabled = disabled; });
      disabledControls = [];
    }
  }
  function updateOrderUrl(id) {
    const url = new URL(location.href);
    if (id) url.searchParams.set('id', id);
    else url.searchParams.delete('id');
    url.hash = 'Tạo đơn hàng';
    history.replaceState(null, '', url.pathname + url.search + url.hash);
  }

  async function api(
    method,
    path,
    body,
    base = API
  ){

    const revision = renderRevision;
    if (!isActive(revision)) throw Object.assign(new Error('Màn hình đã thay đổi'), { cancelled:true });
    const response =
      await apiFetch(
        base + path,
        {
          method,

          credentials:'same-origin',

          headers:
            body
              ? {
                  'Content-Type':
                    'application/json'
                }
              : {},

          body:
            body
              ? JSON.stringify(body)
              : undefined
        }
      );


    let data = null;

    try{
      data =
        await response.json();
    }catch(_){}


    if (!isActive(revision)) throw Object.assign(new Error('Màn hình đã thay đổi'), { cancelled:true });
    if(!response.ok){

      const error =
        new Error(
          data?.message ||
          'Không thể xử lý yêu cầu, vui lòng thử lại'
        );

      error.status =
        response.status;

      throw error;
    }


    return data;
  }


  /* ========================================================
     STATE
     ======================================================== */

  const S = {

    id:null,
    code:null,

    customer:null,

    points:[],
    lines:[],

    totals:null,

    flags:[],

    credit:null,

    stock:null,

    dirty:false,

    quoteSeq:0,
    quoting:false,

    saving:false,

    keySeq:0

  };


  let toastTimer;
  let quoteTimer;

  let customerSeq = 0;
  let productSeq = 0;
  let pointsSeq = 0;


  /* ========================================================
     TOAST
     ======================================================== */

  function toast(
    message,
    kind
  ){

    const node =
      $('toast');

    if(!node){
      return;
    }


    node.textContent =
      message;

    node.className =
      'toast' +
      (
        kind === 'error'
          ? ' error'
          : ''
      );

    node.hidden = false;

    clearTimeout(
      toastTimer
    );

    toastTimer =
      setTimeout(
        () => {
          node.hidden = true;
        },
        kind === 'error'
          ? 5000
          : 2500
      );
  }


  /* ========================================================
     GATE
     ======================================================== */

  function gate(
    title,
    message,
    linkText
  ){

    $('app').hidden = true;

    $('gateTitle').textContent =
      title;

    $('gateText').textContent =
      message;

    $('gateLink').textContent =
      linkText ||
      'Về trang chính';

    $('gateLink').href =
      HOME;

    $('gate').hidden = false;
  }


  function handleAuth(
    error
  ){

    if(error.cancelled || !isActive(renderRevision)) return true;

    if(error.status === 401){

      gate(
        'Phiên đăng nhập đã hết hạn',
        'Vui lòng đăng nhập lại. Đơn chưa lưu sẽ không được giữ.',
        'Đăng nhập lại'
      );

      return true;
    }


    if(error.status === 403){

      gate(
        'Chưa có quyền tạo đơn hàng',
        'Tài khoản của bạn không được cấp quyền này. Hãy liên hệ quản trị viên.'
      );

      return true;
    }


    return false;
  }


  /* ========================================================
     TOTAL
     ======================================================== */

  function renderTotals(){
    if (!isActive(renderRevision)) return;

    const total =
      S.totals;


    $('tSub').textContent =
      total
        ? money(total.subtotal)
        : '—';


    $('tDisc').textContent =
      total
        ? (
            Number(total.discount) > 0
              ? '−' +
                money(total.discount)
              : money(0)
          )
        : '—';


    $('tPay').textContent =
      total
        ? money(total.payable)
        : '—';


    $('sum').classList.toggle(
      'busy',
      S.quoting
    );
  }


  /* S4-05: nháp bị quản lý trả lại → hiện ý kiến để nhân viên biết cần sửa gì. */
  function renderReturnNote(review){
    const box = $('returnNote');
    if (!box) return;
    box.replaceChildren();
    box.hidden = !review;
    if (!review) return;
    box.append(
      el('strong', { text:'Quản lý kinh doanh đã trả lại đơn này để sửa' }),
      el('span', {
        text:(review.decidedByName || '') +
          (review.decidedAt ? ' · ' + new Date(review.decidedAt).toLocaleString('vi-VN', { dateStyle:'short', timeStyle:'short' }) : '')
      }),
      el('q', { text:review.comment || '' })
    );
  }


  /* S4-01: lý do đơn sẽ cần quản lý kinh doanh duyệt nếu gửi ngay. */
  function renderApproval(){
    const box = $('approvalNote');
    if (!box) return;
    const flags = S.flags || [];
    box.replaceChildren();
    box.hidden = !flags.length;
    if (!flags.length) return;
    box.append(
      el('strong', { text:'Đơn này sẽ chuyển sang Chờ duyệt khi gửi' }),
      el('ul', {}, flags.map(flag => el('li', { text:flag.message })))
    );
  }


  function showQuoteError(
    message
  ){

    const box =
      $('quoteError');

    box.textContent =
      message || '';

    box.hidden =
      !message;
  }


  /* ========================================================
     CUSTOMER
     ======================================================== */

  /* S4-03: kho phục vụ và lỗi tồn chung (chưa gán kho). Lỗi từng dòng hiện ngay dưới dòng hàng. */
  function renderStock(){
    const note = $('stockNote');
    if (!note) return;
    const stock = S.customer && S.lines.length ? S.stock : null;
    note.hidden = !stock;
    note.classList.toggle('bad', !!stock && !stock.warehouseId);
    if (stock) {
      note.textContent = stock.warehouseId
        ? 'Tồn khả dụng tính tại ' + stock.warehouseName + ' (đã trừ hàng đang giữ cho đơn khác).'
        : (stock.errors || []).join(' ');
    }
    $('btnComplete').disabled = !!S.credit?.blocked || (!!stock && !stock.ok);
  }


  /* S4-02: công nợ hiện tại, hạn mức, còn lại; nợ quá hạn thì chặn tạo/gửi đơn. */
  let creditSeq = 0;

  function renderCredit(){
    const box = $('creditBox');
    if (!box) return;
    const credit = S.customer ? S.credit : null;
    box.hidden = !credit;
    const blocked = !!credit?.blocked;
    $('btnComplete').disabled = blocked || (!!S.stock && !S.stock.ok);
    $('btnSave').disabled = blocked && !S.id;
    if (S.customer) $('productQ').disabled = blocked && !S.id;
    if (!credit) return;
    const limit = Number(credit.creditLimit);
    $('crOutstanding').textContent = money(credit.outstanding);
    $('crLimit').textContent = limit > 0 ? money(limit) : 'Không cho nợ';
    $('crAvailable').textContent = money(credit.available);
    $('crAvailable').classList.toggle('neg', Number(credit.available) < 0);
    const after = credit.remainingAfterOrder;
    $('crAfter').textContent = after == null ? '—' : money(after);
    $('crAfter').classList.toggle('neg', after != null && Number(after) < 0);
    $('crBlocked').hidden = !blocked;
    $('crBlocked').textContent = blocked
      ? credit.blockReason + (S.id ? '. Có thể lưu nháp này nhưng chưa gửi được.' : '.')
      : '';
  }

  async function loadCredit(){
    const seq = ++creditSeq;
    S.credit = null;
    renderCredit();
    if (!S.customer) return;
    try {
      const credit = await api('GET', '/customers/' + S.customer.id + '/credit');
      if (seq !== creditSeq) return;
      S.credit = credit;
      renderCredit();
    } catch (error) {
      if (seq !== creditSeq || handleAuth(error)) return;
      toast('Không tải được công nợ của đại lý: ' + error.message, 'error');
    }
  }


  function renderCustomer(){

    const customer =
      S.customer;


    $('customerChosen').hidden =
      !customer;

    $('customerSearch').hidden =
      !!customer;


    $('customerLabel')
      .setAttribute(
        'for',
        customer
          ? 'btnChangeCustomer'
          : 'customerQ'
      );


    if(customer){

      $('chosenName').textContent =
        customer.fullName;

      $('chosenPhone').textContent =
        customer.phone || '';
    }


    /* S3-07: đại lý bị khoá giao dịch -> cảnh báo rõ trên form. */
    const warning =
      $('lockWarning');

    const locked =
      !!customer?.tradingLocked;

    warning.hidden = !locked;

    warning.textContent =
      !locked
        ? ''
        : 'Đại lý đang bị khoá giao dịch' +
          (customer.lockReason ? ': ' + customer.lockReason : '') +
          '. ' +
          (S.id
            ? 'Đơn nháp này vẫn được xử lý tiếp, vui lòng kiểm tra kỹ trước khi gửi.'
            : 'Không thể tạo đơn mới cho đại lý này.');


    const productInput =
      $('productQ');


    productInput.disabled =
      !customer;


    productInput.placeholder =
      customer
        ? 'Gõ mã hoặc tên sản phẩm'
        : 'Chọn đại lý trước';


    if(!customer){

      hideResults(
        'productResults'
      );
    }

    renderCredit();
  }


  function chooseCustomer(
    customer
  ){

    S.customer = {

      id:customer.id,

      fullName:
        customer.fullName,

      phone:
        customer.phone || '',

      tradingLocked:
        !!customer.tradingLocked,

      lockReason:
        customer.lockReason || ''

    };


    $('customerQ').value = '';

    hideResults(
      'customerResults'
    );


    renderCustomer();

    S.dirty = true;


    S.lines.forEach(
      line => {

        line.calc = null;

        renderLineCalc(line);

      }
    );


    loadCredit();

    scheduleQuote(0);

    loadPoints(
      null,
      false
    );


    $('point').focus();
  }


  /* ========================================================
     DELIVERY POINTS
     ======================================================== */

  function renderPoints(
    selectedId = null,
    gone = false,
    preferDefault = false
  ){

    const select =
      $('point');

    const hint =
      $('pointHint');


    select.replaceChildren();

    hint.hidden = true;


    if(!S.customer){

      select.append(
        el(
          'option',
          {
            value:'',
            text:'Chọn đại lý trước'
          }
        )
      );

      select.disabled = true;

      return;
    }


    if(!S.points.length){

      select.append(
        el(
          'option',
          {
            value:'',
            text:
              'Đại lý chưa có điểm giao hàng'
          }
        )
      );

      select.disabled = true;


      hint.textContent =
        'Thêm điểm giao cho đại lý này ở mục Điểm giao hàng trong menu, rồi mở lại đơn.';

      hint.hidden = false;

      return;
    }


    select.disabled = false;


    select.append(
      el(
        'option',
        {
          value:'',
          text:'Chọn điểm giao hàng'
        }
      )
    );


    S.points.forEach(
      point => {

        select.append(
          el(
            'option',
            {
              value:String(point.id),

              text:
                point.receiverName +
                ' — ' +
                point.address +
                (
                  point.isDefault
                    ? ' (mặc định)'
                    : ''
                )
            }
          )
        );

      }
    );


    let selected = null;


    if(selectedId != null){

      selected =
        S.points.find(
          point =>
            point.id === selectedId
        );
    }


    if(
      !selected &&
      preferDefault
    ){

      selected =
        S.points.find(
          point =>
            point.isDefault
        );
    }


    if(selected){

      select.value =
        String(selected.id);
    }


    if(gone){

      hint.textContent =
        'Điểm giao đã chọn trước đó không còn dùng. Hãy chọn lại.';

      hint.hidden = false;
    }
  }


  async function loadPoints(
    savedPoint,
    reopen
  ){

    const seq =
      ++pointsSeq;


    S.points = [];

    renderPoints();


    if(!S.customer){
      return;
    }


    const select =
      $('point');


    select.replaceChildren(
      el(
        'option',
        {
          value:'',
          text:'Đang tải điểm giao hàng…'
        }
      )
    );


    select.disabled = true;


    try{

      const rows =
        await api(
          'GET',
          '?customerId=' +
          S.customer.id,
          null,
          POINTS_API
        );


      if(seq !== pointsSeq){
        return;
      }


      S.points =
        rows;


      const gone =
        savedPoint != null &&
        !rows.some(
          point =>
            point.id === savedPoint
        );


      renderPoints(
        gone
          ? null
          : savedPoint,

        gone,

        !reopen
      );

    }catch(error){

      if(seq !== pointsSeq){
        return;
      }


      if(handleAuth(error)){
        return;
      }


      $('pointHint').textContent =
        'Không tải được điểm giao hàng: ' +
        error.message;

      $('pointHint').hidden =
        false;
    }
  }

  function validQty(value){

    const number =
      Number(value);


    return (
      String(value).trim() !== '' &&
      Number.isFinite(number) &&
      number > 0
    );
  }


  function renderLineCalc(
    line
  ){

    const calc =
      line.calc;

    const elements =
      line.els;


    if(!elements){
      return;
    }


    elements.price.disabled = !S.customer;
    elements.reset.hidden = line.manualPrice == null;
    elements.price.classList.toggle('overridden', line.manualPrice != null);

    if(!calc){

      elements.meta.textContent =
        S.customer

          ? (
              validQty(line.quantity)
                ? 'Đang tính giá…'
                : 'Nhập số lượng lớn hơn 0'
            )

          : 'Chọn đại lý để tính giá';

      elements.floor.hidden = true;

      elements.stock.hidden = true;


      elements.sub.textContent =
        '—';

      elements.disc.textContent =
        '—';

      elements.pay.textContent =
        '—';

      elements.disc.className =
        'off';

      return;
    }


    const unit =
      line.units.find(
        item =>
          item.id === line.unitId
      );


    const unitName =
      unit
        ? unit.name
        : calc.unitName;

    if (document.activeElement !== elements.price) {
      elements.price.value = String(Number(calc.unitPrice));
    }

    elements.unitLabel.textContent =
      'Đơn giá / ' + unitName;

    elements.meta.textContent =
      'Giá bảng giá ' + money(calc.listPrice) +
      ' · Giá sàn ' + money(calc.floorPrice) +
      (calc.available != null
        ? ' · Tồn khả dụng ' + nf.format(Number(calc.available)) + ' ' + unitName
        : '');

    elements.stock.hidden = !calc.stockShort;
    elements.stock.replaceChildren();
    if (calc.stockShort) {
      const max = Number(calc.maxQuantity) || 0;
      elements.stock.append(
        el('span', {
          text: max > 0
            ? 'Vượt tồn khả dụng. Chỉ đặt được tối đa ' + nf.format(max) + ' ' + unitName + '.'
            : 'Đã hết hàng khả dụng cho dòng này.'
        }),
        max > 0
          ? el('button', {
              type:'button',
              class:'linkbtn',
              text:'Đặt ' + nf.format(max) + ' ' + unitName,
              onclick:() => elements.setQty(max)
            })
          : el('button', {
              type:'button',
              class:'linkbtn',
              text:'Xoá dòng',
              onclick:() => removeLine(line)
            })
      );
    }

    elements.reset.hidden = !calc.priceOverridden && line.manualPrice == null;
    elements.price.classList.toggle('overridden', !!calc.priceOverridden);

    elements.floor.hidden = !calc.belowFloor;
    elements.floor.textContent = calc.belowFloor
      ? 'Giá đang thấp hơn giá sàn ' + money(calc.floorPrice) + ' / ' + unitName +
        '. Đơn sẽ cần quản lý kinh doanh duyệt trước khi giữ hàng.'
      : '';


    elements.sub.textContent =
      money(calc.subtotal);


    const discount =
      Number(calc.discount);


    elements.disc.textContent =
      discount > 0
        ? '−' + money(discount)
        : 'Không có';


    elements.disc.className =
      discount > 0
        ? 'cut'
        : 'off';


    elements.pay.textContent =
      money(calc.payable);
  }


  function buildLine(
    line
  ){

    const quantity =
      el(
        'input',
        {
          type:'number',
          inputmode:'numeric',
          min:'1',
          step:'1',
          value:String(line.quantity),
          'aria-label':
            'Số lượng ' +
            line.name
        }
      );


    const unitSelect =
      el(
        'select',
        {
          'aria-label':
            'Đơn vị tính ' +
            line.name
        },

        line.units.map(
          unit =>
            el(
              'option',
              {
                value:String(unit.id),

                selected:
                  unit.id === line.unitId,

                text:
                  Number(unit.factor) === 1
                    ? unit.name
                    : unit.name +
                      ' (×' +
                      nf.format(
                        Number(
                          unit.factor
                        )
                      ) +
                      ')'
              }
            )
        )
      );


    const sub =
      el(
        'dd',
        {
          class:'off',
          text:'—'
        }
      );


    const disc =
      el(
        'dd',
        {
          class:'off',
          text:'—'
        }
      );


    const pay =
      el(
        'dd',
        {
          text:'—'
        }
      );


    /* S4-01: đơn giá sửa được; để trống hoặc bấm "Về giá bảng giá" để dùng giá bảng giá. */
    const price =
      el(
        'input',
        {
          type:'number',
          inputmode:'decimal',
          min:'0',
          step:'any',
          value:line.manualPrice ?? '',
          'aria-describedby':'priceMeta' + line.key
        }
      );

    const unitLabel =
      el('span', { text:'Đơn giá' });

    const meta =
      el('span', { class:'price-meta', id:'priceMeta' + line.key });

    const reset =
      el(
        'button',
        {
          type:'button',
          class:'linkbtn price-reset',
          text:'Về giá bảng giá',
          hidden:true,
          onclick:() => {
            line.manualPrice = null;
            price.value = '';
            line.calc = null;
            renderLineCalc(line);
            S.dirty = true;
            scheduleQuote(0);
            price.focus();
          }
        }
      );

    const floor =
      el('p', { class:'floor-warn', role:'status', hidden:true });

    const stockWarn =
      el('div', { class:'stock-warn', role:'alert', hidden:true });

    const unitprice =
      el(
        'div',
        {
          class:'unitprice'
        },
        el('label', { class:'price-field' }, unitLabel, price),
        meta,
        reset
      );


    line.els = {
      qty:quantity,
      select:unitSelect,
      sub,
      disc,
      pay,
      unitprice,
      price,
      unitLabel,
      meta,
      reset,
      floor,
      stock:stockWarn,
      setQty:value => setQty(value)
    };


    price.addEventListener(
      'input',
      () => {
        const value = price.value.trim();
        line.manualPrice = value === '' ? null : value;
        line.calc = null;
        renderLineCalc(line);
        S.dirty = true;
        scheduleQuote(500);
      }
    );

    price.addEventListener(
      'blur',
      () => {
        if (line.calc) renderLineCalc(line);
      }
    );


    function setQty(
      value
    ){

      quantity.value =
        String(value);

      line.quantity =
        quantity.value;

      line.calc = null;

      renderLineCalc(line);

      S.dirty = true;

      scheduleQuote(300);
    }


    quantity.addEventListener(
      'input',
      () => {

        line.quantity =
          quantity.value;

        line.calc = null;

        renderLineCalc(line);

        S.dirty = true;

        scheduleQuote(400);
      }
    );


    unitSelect.addEventListener(
      'change',
      () => {

        line.unitId =
          Number(
            unitSelect.value
          );

        /* Đơn giá sửa tay tính theo đơn vị cũ → bỏ, dùng lại giá bảng giá. */
        line.manualPrice = null;
        price.value = '';

        line.calc = null;

        renderLineCalc(line);

        S.dirty = true;

        scheduleQuote(0);
      }
    );


    const node =
      el(
        'article',
        {
          class:'line'
        },

        el(
          'div',
          {
            class:'line-head'
          },

          el(
            'div',
            {
              class:'nm'
            },

            el(
              'strong',
              {
                text:line.name
              }
            ),

            el(
              'small',
              {
                text:line.sku
              }
            )
          ),

          el(
            'button',
            {
              type:'button',
              class:'rm',
              text:'×',
              'aria-label':
                'Xóa dòng ' +
                line.name,

              onclick:
                () =>
                  removeLine(line)
            }
          )
        ),

        el(
          'div',
          {
            class:'line-ctl'
          },

          unitSelect,

          el(
            'div',
            {
              class:'stepper'
            },

            el(
              'button',
              {
                type:'button',
                text:'−',
                'aria-label':
                  'Giảm số lượng',

                onclick:
                  () =>
                    setQty(
                      Math.max(
                        1,
                        (
                          Number(
                            quantity.value
                          ) || 1
                        ) - 1
                      )
                    )
              }
            ),

            quantity,

            el(
              'button',
              {
                type:'button',
                text:'+',
                'aria-label':
                  'Tăng số lượng',

                onclick:
                  () =>
                    setQty(
                      (
                        Number(
                          quantity.value
                        ) || 0
                      ) + 1
                    )
              }
            )
          )
        ),

        unitprice,

        floor,

        stockWarn,

        el(
          'dl',
          {
            class:'calc'
          },

          el(
            'div',
            {},

            el(
              'dt',
              {
                text:'Thành tiền'
              }
            ),

            sub
          ),

          el(
            'div',
            {},

            el(
              'dt',
              {
                text:'Chiết khấu'
              }
            ),

            disc
          ),

          el(
            'div',
            {},

            el(
              'dt',
              {
                text:'Phải thu'
              }
            ),

            pay
          )
        )
      );


    line.node =
      node;


    renderLineCalc(line);

    return node;
  }


  function syncLineChrome(){

    $('empty').hidden =
      S.lines.length > 0;


    $('lineCount').textContent =
      S.lines.length
        ? '(' +
          S.lines.length +
          ')'
        : '';
  }


  function renderAllLines(){

    $('lines').replaceChildren(
      ...S.lines.map(
        buildLine
      )
    );

    syncLineChrome();
  }


  function removeLine(
    line
  ){

    S.lines =
      S.lines.filter(
        item =>
          item !== line
      );


    if(line.node){
      line.node.remove();
    }


    syncLineChrome();

    S.dirty = true;

    scheduleQuote(0);
  }


  function addProduct(
    product
  ){

    const unit =
      product.units?.[0];


    if(!unit){

      toast(
        'Sản phẩm này chưa có đơn vị tính',
        'error'
      );

      return;
    }


    const existing =
      S.lines.find(
        line =>
          line.productId === product.id &&
          line.unitId === unit.id
      );


    if(existing){

      existing.quantity =
        String(
          (
            Number(
              existing.quantity
            ) || 0
          ) + 1
        );


      existing.els.qty.value =
        existing.quantity;

      existing.calc = null;

      renderLineCalc(
        existing
      );


      existing.node.scrollIntoView({
        block:'center',
        behavior:'smooth'
      });

    }else{

      const line = {

        key:
          ++S.keySeq,

        productId:
          product.id,

        sku:
          product.sku,

        name:
          product.name,

        unitId:
          unit.id,

        units:
          product.units,

        quantity:
          '1',

        manualPrice:
          null,

        calc:
          null

      };


      S.lines.push(
        line
      );


      $('lines').append(
        buildLine(line)
      );


      syncLineChrome();


      line.node.scrollIntoView({
        block:'center',
        behavior:'smooth'
      });
    }


    toast(
      'Đã thêm ' +
      product.name
    );


    S.dirty = true;

    scheduleQuote(0);
  }


  /* ========================================================
     QUOTE
     ======================================================== */

  function scheduleQuote(
    delay
  ){

    clearTimeout(
      quoteTimer
    );

    quoteTimer =
      setTimeout(
        runQuote,
        delay
      );
  }


  async function runQuote(){

    const seq =
      ++S.quoteSeq;


    if(!S.customer){

      S.totals = null;
      S.quoting = false;
      S.flags = [];
      renderApproval();
      S.stock = null;
      renderStock();

      renderTotals();


      S.lines.forEach(
        line => {

          line.calc = null;

          renderLineCalc(line);

        }
      );


      return;
    }


    if(!S.lines.length){

      S.totals = {
        subtotal:0,
        discount:0,
        payable:0
      };

      S.flags = [];

      renderApproval();

      S.stock = null;

      renderStock();


      S.quoting = false;

      showQuoteError('');

      renderTotals();

      return;
    }


    if(
      S.lines.some(
        line =>
          !validQty(
            line.quantity
          )
      )
    ){

      S.quoting = false;

      showQuoteError(
        'Số lượng ở mỗi dòng phải lớn hơn 0.'
      );

      renderTotals();

      return;
    }


    S.quoting = true;

    renderTotals();


    try{

      const result =
        await api(
          'POST',
          '/quote',
          {
            customerId:
              S.customer.id,

            lines:
              S.lines.map(
                line => ({
                  productId:
                    line.productId,

                  unitId:
                    line.unitId,

                  quantity:
                    Number(
                      line.quantity
                    ),

                  unitPrice:
                    line.manualPrice == null
                      ? undefined
                      : Number(line.manualPrice)
                })
              )
          }
        );


      if(seq !== S.quoteSeq){
        return;
      }


      result.lines.forEach(
        (calc,index) => {

          if(S.lines[index]){

            S.lines[index].calc =
              calc;

            renderLineCalc(
              S.lines[index]
            );
          }

        }
      );


      S.totals = {

        subtotal:
          result.subtotal,

        discount:
          result.discount,

        payable:
          result.payable

      };

      S.flags = result.flags || [];

      renderApproval();

      S.stock = result.stock || null;

      renderStock();

      /* Báo giá mang công nợ mới nhất kèm số còn lại sau đơn này. */
      if (result.credit) {
        ++creditSeq;
        S.credit = result.credit;
        renderCredit();
      }


      showQuoteError('');

    }catch(error){

      if(seq !== S.quoteSeq){
        return;
      }


      if(
        !handleAuth(error)
      ){

        showQuoteError(
          error.message
        );
      }

    }finally{

      if(seq === S.quoteSeq && isActive(renderRevision)){

        S.quoting = false;

        renderTotals();
      }
    }
  }

  async function save(){

    if(S.saving){
      return;
    }


    if(!S.customer){

      toast(
        'Chọn đại lý trước khi lưu nháp',
        'error'
      );

      $('customerQ').focus();

      return;
    }


    if(
      S.lines.some(
        line =>
          !validQty(
            line.quantity
          )
      )
    ){

      toast(
        'Số lượng ở mỗi dòng phải lớn hơn 0',
        'error'
      );

      return;
    }


    const date =
      $('date').value;


    const today =
      new Date(
        Date.now() -
        new Date()
          .getTimezoneOffset() *
          60000
      )
      .toISOString()
      .slice(0,10);


    if(
      date &&
      date < today
    ){

      toast(
        'Ngày giao mong muốn không được ở quá khứ',
        'error'
      );

      $('date').focus();

      return;
    }


    setSaving(true);


    const revision = renderRevision;
    const button =
      $('btnSave');


    button.disabled = true;

    button.textContent =
      'Đang lưu…';


    try{

      const result =
        await api(

          S.id
            ? 'PUT'
            : 'POST',

          S.id
            ? '/' + S.id
            : '/',

          formBody()
        );


      S.id =
        result.id;

      S.code =
        result.code;

      S.dirty =
        false;


      updateOrderUrl(S.id);


      toast(
        'Đã lưu nháp ' +
        result.code
      );


      scheduleQuote(0);

      refreshDraftCount();

    }catch(error){

      if(
        !handleAuth(error)
      ){

        toast(
          error.message,
          'error'
        );
      }

    }finally{

      if (isActive(revision)) setSaving(false);

      button.disabled =
        false;

      button.textContent =
        'Lưu nháp';
    }
  }


  async function completeOrder(){

    if(S.saving){
      return;
    }

    if(!S.id){

      toast(
        'Hãy lưu nháp trước khi gửi đơn',
        'error'
      );

      return;
    }

    if(!S.customer){

      toast(
        'Chọn đại lý trước khi gửi đơn',
        'error'
      );

      return;
    }

    if(!S.lines.length){

      toast(
        'Đơn hàng phải có ít nhất một sản phẩm',
        'error'
      );

      return;
    }

    if(
      S.lines.some(
        line =>
          !validQty(line.quantity)
      )
    ){

      toast(
        'Số lượng ở mỗi dòng phải lớn hơn 0',
        'error'
      );

      return;
    }

    if (!$('point').value || !$('date').value) {
      toast('Vui lòng chọn điểm giao hàng và ngày giao mong muốn', 'error');
      return;
    }

    if(!confirm('Gửi đơn ' + (S.code || '') + '? Sau khi gửi, đơn không sửa được nữa.' + (S.flags?.length ? '\n\nĐơn sẽ chờ quản lý kinh doanh duyệt vì:\n• ' + S.flags.map(flag => flag.message).join('\n• ') : ''))){
      return;
    }

    setSaving(true);
    const revision = renderRevision;
    const button =
      $('btnComplete');

    button.disabled = true;

    button.textContent =
      'Đang gửi…';

    try{

      const result =
        await api(
          'PUT',
          '/' + S.id + '/complete',
          formBody()
        );

      S.dirty = false;

      toast(
        'Đã gửi đơn ' +
        (result.code || S.code || '') +
        ' · ' +
        (result.statusLabel || 'Chờ duyệt')
      );

      refreshDraftCount();

      setSaving(false);
      newOrder();

    }catch(error){

      if(
        !handleAuth(error)
      ){

        toast(
          error.message,
          'error'
        );
      }

    }finally{

      button.disabled = false;

      if (isActive(revision)) {
        setSaving(false);
      }
      button.textContent =
        'Gửi đơn';
    }
  }


  function confirmLeave(){

    return (
      !S.dirty ||
      confirm(
        'Đơn hiện tại có thay đổi chưa lưu. Bỏ các thay đổi này?'
      )
    );
  }


  function resetForm(){

    S.id = null;
    S.code = null;

    S.customer = null;

    S.points = [];
    S.lines = [];

    S.totals = {
      subtotal:0,
      discount:0,
      payable:0
    };

    S.flags = [];

    S.credit = null;

    ++creditSeq;

    S.stock = null;

    S.dirty = false;

    ++S.quoteSeq;
    ++pointsSeq;

    clearTimeout(
      quoteTimer
    );

    S.quoting = false;


    $('date').value = '';

    $('note').value = '';

    $('customerQ').value = '';

    $('productQ').value = '';


    showQuoteError('');

    renderApproval();

    renderStock();

    renderReturnNote(null);

    renderCustomer();

    renderPoints();

    renderAllLines();

    renderTotals();
  }


  function newOrder(){

    if(!confirmLeave()){
      return;
    }


    resetForm();


    updateOrderUrl(null);


    $('customerQ').focus();
  }


  /* ========================================================
     OPEN DRAFT
     ======================================================== */

  async function openDraft(
    id
  ){

    try{

      const order =
        await api(
          'GET',
          '/' + id
        );


      resetForm();


      S.id =
        order.id;

      S.code =
        order.code;


      S.customer = {

        id:
          order.customerId,

        fullName:
          order.customerName ||
          'Đại lý',

        phone:
          order.customerPhone ||
          '',

        tradingLocked:
          !!order.tradingLocked,

        lockReason:
          order.lockReason || ''

      };


      $('date').value =
        order.desiredDate
          ? String(
              order.desiredDate
            ).slice(0,10)
          : '';


      $('note').value =
        order.note || '';


      S.lines =
        (order.lines || [])
          .map(
            line => ({

              key:
                ++S.keySeq,

              productId:
                line.productId,

              sku:
                line.sku,

              name:
                line.name,

              unitId:
                line.unitId,

              units:
                line.units || [],

              quantity:
                String(
                  line.quantity
                ),

              manualPrice:
                line.unitPrice == null
                  ? null
                  : String(Number(line.unitPrice)),

              calc:null

            })
          );


      S.totals = {

        subtotal:
          order.subtotal,

        discount:
          order.discount,

        payable:
          order.payable

      };


      renderCustomer();

      renderAllLines();

      renderTotals();

      renderReturnNote(order.lastReturn);


      updateOrderUrl(S.id);


      loadCredit();

      scheduleQuote(0);


      await loadPoints(
        order.deliveryPointId,
        true
      );


      return true;

    }catch(error){

      if(
        !handleAuth(error)
      ){

        toast(
          error.message,
          'error'
        );
      }

      return false;
    }
  }


  /* ========================================================
     DRAFT LIST
     ======================================================== */

  async function refreshDraftCount(){

    try{

      const rows =
        await api(
          'GET',
          '/'
        );


      $('draftCount').textContent =
        rows.length
          ? '(' +
            rows.length +
            ')'
          : '';


      return rows;

    }catch(error){

      handleAuth(error);

      return null;
    }
  }


  function fmtTime(
    value
  ){

    const date =
      new Date(
        String(value)
          .replace(
            ' ',
            'T'
          )
      );


    if(
      Number.isNaN(
        date.getTime()
      )
    ){
      return '';
    }


    return date.toLocaleString(
      'vi-VN',
      {
        day:'2-digit',
        month:'2-digit',
        hour:'2-digit',
        minute:'2-digit'
      }
    );
  }


  async function openSheet(){

    $('sheetBody').replaceChildren(
      el(
        'p',
        {
          class:'hint',
          text:'Đang tải…'
        }
      )
    );


    $('sheet').hidden =
      false;


    const rows =
      await refreshDraftCount();


    if(rows === null){

      $('sheetBody').replaceChildren(
        el(
          'p',
          {
            class:'msg',
            text:
              'Không tải được danh sách đơn nháp.'
          }
        )
      );

      return;
    }


    $('sheetBody').replaceChildren(

      ...(rows.length

        ? rows.map(
            row =>
              el(
                'button',
                {
                  type:'button',
                  class:'draft',

                  onclick:
                    async () => {

                      if(
                        row.id !== S.id &&
                        !confirmLeave()
                      ){
                        return;
                      }


                      if(
                        await openDraft(
                          row.id
                        )
                      ){

                        closeSheet();
                      }
                    }
                },

                el(
                  'div',
                  {
                    class:'r1'
                  },

                  el(
                    'span',
                    {
                      text:
                        row.code
                    }
                  ),

                  el(
                    'span',
                    {
                      text:
                        money(
                          row.payable
                        )
                    }
                  )
                ),

                el(
                  'div',
                  {
                    class:'r2',

                    text:
                      (
                        row.customerName ||
                        'Chưa chọn đại lý'
                      ) +
                      ' — ' +
                      row.lineCount +
                      ' dòng, sửa lúc ' +
                      fmtTime(
                        row.updatedAt
                      )
                  }
                )
              )
          )

        : [

            el(
              'p',
              {
                class:'hint',

                text:
                  'Chưa có đơn nháp nào. Bấm Lưu nháp để giữ lại đơn đang gõ.'
              }
            )

          ])
    );
  }


  function closeSheet(){

    $('sheet').hidden =
      true;
  }


  /* ========================================================
     CĂN THANH TỔNG TIỀN THEO MÉP TRÁI/PHẢI CỦA FORM
     (thanh là position:fixed nên phải gán left + width
      bằng đúng vị trí của .order-content)
     ======================================================== */

  let barObserver = null;
  let barListening = false;

  function syncOrderBottomBar(){

    const content =
      document.querySelector('.order-content');

    const wrap =
      document.querySelector('.order-bottom-wrap');

    if(!content || !wrap){
      return;
    }

    const rect =
      content.getBoundingClientRect();

    /* form chưa hiển thị (width = 0) thì bỏ qua */
    if(rect.width <= 0){
      return;
    }

    wrap.style.left =
      rect.left + 'px';

    wrap.style.width =
      rect.width + 'px';
  }


  function watchOrderBottomBar(){

    /* đăng ký resize đúng 1 lần */
    if(!barListening){

      window.addEventListener(
        'resize',
        syncOrderBottomBar
      );

      barListening = true;
    }

    /* theo dõi khi form đổi kích thước/vị trí
       (thu gọn sidebar, hiện thanh cuộn, ...) */
    if(barObserver){
      barObserver.disconnect();
      barObserver = null;
    }

    const content =
      document.querySelector('.order-content');

    if(content && 'ResizeObserver' in window){

      barObserver =
        new ResizeObserver(
          syncOrderBottomBar
        );

      barObserver.observe(content);

      if(content.parentElement){
        barObserver.observe(
          content.parentElement
        );
      }

      barObserver.observe(
        document.documentElement
      );
    }

    syncOrderBottomBar();

    /* chạy lại sau khi layout ổn định */
    requestAnimationFrame(
      syncOrderBottomBar
    );

    setTimeout(
      syncOrderBottomBar,
      150
    );
  }


  /* ========================================================
     BIND
     ======================================================== */

  let globalEventsBound = false;
  function bind(){

    $('btnSave')
      .addEventListener(
        'click',
        save
      );


    $('btnComplete')
      .addEventListener(
        'click',
        completeOrder
      );


    $('btnNew')
      .addEventListener(
        'click',
        newOrder
      );


    $('btnDrafts')
      .addEventListener(
        'click',
        openSheet
      );


    $('btnCloseSheet')
      .addEventListener(
        'click',
        closeSheet
      );


    $('sheet')
      .addEventListener(
        'click',
        event => {

          if(
            event.target ===
            $('sheet')
          ){

            closeSheet();
          }
        }
      );


    $('btnChangeCustomer')
      .addEventListener(
        'click',
        () => {

          S.customer = null;

          S.points = [];

          S.totals = null;

          S.credit = null;

          ++creditSeq;

          ++pointsSeq;

          renderPoints();

          renderCustomer();

          renderTotals();

          S.dirty = true;

          $('customerQ').focus();

          searchCustomers();
        }
      );


    $('customerQ')
      .addEventListener(
        'input',
        searchCustomers
      );


    $('customerQ')
      .addEventListener(
        'focus',
        searchCustomers
      );


    $('productQ')
      .addEventListener(
        'input',
        searchProducts
      );


    $('productQ')
      .addEventListener(
        'focus',
        searchProducts
      );


    ['point','date','note']
      .forEach(
        id => {

          $(id)
            .addEventListener(
              'input',
              () => {
                S.dirty = true;
              }
            );


          $(id)
            .addEventListener(
              'change',
              () => {
                S.dirty = true;
              }
            );
        }
      );


    if (!globalEventsBound) {
      globalEventsBound = true;
    document.addEventListener(
      'click',
      event => {
        if (!isActive(renderRevision)) return;

        if(
          !event.target.closest(
            '#customerSearch'
          )
        ){

          hideResults(
            'customerResults'
          );
        }


        if(
          !event.target.closest(
            '#productQ, #productResults'
          )
        ){

          hideResults(
            'productResults'
          );
        }
      }
    );


    document.addEventListener(
      'keydown',
      event => {
        if (!isActive(renderRevision)) return;

        if(
          event.key !== 'Escape'
        ){
          return;
        }


        if(
          $('sheet') &&
          !$('sheet').hidden
        ){

          closeSheet();
        }


        hideResults(
          'customerResults'
        );

        hideResults(
          'productResults'
        );
      }
    );


    window.addEventListener(
      'beforeunload',
      event => {
        if (!isActive(renderRevision)) return;

        if(S.dirty){

          event.preventDefault();

          event.returnValue = '';
        }
      }
    );
    }
  }


  /* ========================================================
     BOOT
     ======================================================== */

  async function boot(){

    let rows;


    try{

      rows =
        await api(
          'GET',
          '/'
        );

    }catch(error){

      if(
        !handleAuth(error)
      ){

        gate(
          'Không tải được trang',
          error.message
        );
      }

      return;
    }


    $('draftCount').textContent =
      rows.length
        ? '(' +
          rows.length +
          ')'
        : '';


    $('app').hidden =
      false;


    resetForm();


    /* #app vừa hiện -> căn lại thanh tổng tiền */
    syncOrderBottomBar();


    const id =
      new URLSearchParams(
        location.search
      ).get('id');


    if(
      id &&
      /^\d+$/.test(id)
    ){

      await openDraft(
        Number(id)
      );
    }
  }


  /* ========================================================
     RENDER / MOUNT
     ======================================================== */

  let mounted = false;
  let bound = false;

  async function mount(revision){

    const container =
      document.getElementById('moduleContent');

    if(!container){
      console.error(
        'Không tìm thấy #moduleContent'
      );
      return false;
    }

    /*
     * Xóa module cũ trước khi mount.
     * Tránh Điểm giao hàng còn nằm lại khi
     * chuyển sang Tạo đơn hàng.
     */
    container.replaceChildren();

    container.classList.remove('is-hidden');

    try{

      const response =
        await fetch(
          'don-hang/tao-don.html?v=module-1',
          {
            cache:'no-store'
          }
        );

      if(!response.ok){
        throw new Error(
          `HTTP ${response.status}`
        );
      }

      const html =
        await response.text();
      if (revision !== viewRevision) return false;

      const doc =
        new DOMParser()
          .parseFromString(
            html,
            'text/html'
          );

      const sourceRoot =
        doc.getElementById(
          'salesOrderFeatureRoot'
        );

      if(!sourceRoot){
        console.error(
          'File tao-don.html không có #salesOrderFeatureRoot'
        );
        return false;
      }

      /*
       * Chỉ lấy HTML của module.
       * Script/style đã được feature-loader tải.
       */
      container.innerHTML =
        sourceRoot.outerHTML;

      const root =
        document.getElementById(
          'salesOrderFeatureRoot'
        );

      if(!root){
        console.error(
          'Không thể mount #salesOrderFeatureRoot'
        );
        return false;
      }

      mounted = true;

      return true;

    }catch(error){

      console.error(
        'Không thể tải giao diện tạo đơn hàng:',
        error
      );

      return false;
    }
  }
  async function render(){
    const revision = viewRevision;
    renderRevision = revision;
    clearTimeout(quoteTimer);
    ++S.quoteSeq;
    ++pointsSeq;
    S.saving = false;

    const container =
      document.getElementById('moduleContent');

    if(!container){
      console.error(
        'Không tìm thấy #moduleContent'
      );
      return;
    }
    /*
     * Module khác có thể vừa được hiển thị.
     * Tạo đơn hàng phải mount lại HTML của chính nó.
     */
    mounted = false;
    bound = false;

    if(!await mount(revision) || revision !== viewRevision){
      return;
    }
    /*
     * Bind event cho DOM vừa mount.
     */
    if(!bound){

      bind();

      bound = true;
    }

    /*
     * Căn thanh tổng tiền theo form
     * và tự căn lại khi layout đổi.
     */
    watchOrderBottomBar();

    try {
      await boot();
    } catch (error) {
      if (!handleAuth(error)) gate('Không tải được trang', error.message);
    } finally {
      if (isActive(revision)) syncOrderBottomBar();
    }
  }


  return {
    render
  };

})();
</script>
