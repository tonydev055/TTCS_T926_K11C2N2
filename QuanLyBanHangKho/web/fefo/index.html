<script>
window.sprint5Features['Gợi ý lô FEFO']={path:'fefo',permission:'inventory.write',render:()=>warehouseUi.screen('Gợi ý lô FEFO','Ưu tiên hạn dùng gần nhất trong vị trí đã soạn. Số lượng lô theo đơn vị cơ sở; xác nhận sẽ xuất kho.',()=>apiRequest('shipments'),(host,d,rev)=>{
 const ui=warehouseUi,e=ui.esc;host.innerHTML='<label>Đơn đã soạn<select id="fefoOrder"><option value="">Chọn đơn</option>'+d.pending.map(o=>'<option value="'+o.id+'">'+e(o.orderCode)+' — '+e(o.customer)+'</option>').join('')+'</select></label><div id="fefoLines" aria-live="polite"></div>';let seq=0;host.querySelector('#fefoOrder').onchange=async function(){const n=++seq,order=this.value;const target=host.querySelector('#fefoLines');if(!order){target.innerHTML='';return;}target.textContent='Đang tải…';try{const plan=await apiRequest('fefo/'+order);if(n!==seq||rev!==viewRevision)return;target.innerHTML='<form id="fefoForm">'+plan.lines.map(l=>'<h3>'+e(l.sku)+' — '+e(l.name)+' (đặt '+e(Number(l.quantity)*Number(l.conversion_factor))+')</h3>'+ui.table(['Vị trí','Lô','Hạn dùng','Tồn','Xuất'],l.bins.map(b=>'<tr><td>'+e(b.location_name)+'</td><td>'+e(b.lot_number)+'</td><td>'+e(b.expiry_date||'Không hạn')+'</td><td>'+e(b.available)+'</td><td><input aria-label="Xuất lô '+e(b.lot_number)+'" type="number" min="0" max="'+b.available+'" step="1" required data-line="'+l.id+'" data-bin="'+b.id+'" value="'+b.suggested+'"></td></tr>'))).join('')+'<label>Lý do xác nhận / đổi lô<textarea name="allocationReason" required maxlength="1000"></textarea></label><label>Lý do giao thiếu (nếu xuất thiếu)<textarea name="reason" maxlength="1000"></textarea></label><p id="s2FormError" role="alert"></p><button type="submit" class="orange-button">Xác nhận xuất các lô đã chọn</button></form>';const form=target.querySelector('form');form.onsubmit=ev=>{ev.preventDefault();const f=new FormData(form),lines=plan.lines.map(l=>{const allocations=[...form.querySelectorAll('[data-line="'+l.id+'"]')].filter(i=>Number(i.value)>0).map(i=>({binId:Number(i.dataset.bin),quantity:Number(i.value)}));return {lineId:l.id,actualQuantity:allocations.reduce((s,a)=>s+a.quantity,0)/Number(l.conversion_factor),allocations};});ui.submit(form,'shipments/'+order,'POST',{lines,allocationReason:f.get('allocationReason'),reason:f.get('reason')},()=>{},()=>sprint5Features['Gợi ý lô FEFO'].render());};}catch(err){if(n===seq&&rev===viewRevision)target.innerHTML='<p role="alert" class="wh-error">'+e(err.message)+'</p>';}};
})};
</script>
