<!-- Loaded by the application shell: ../index.html -->
<style>
  .s2-profile {
    max-width: 850px;
  }
  .s2-profile .form-fields {
    padding-left: 0;
    padding-right: 0;
  }
  .s2-profile-head {
    display: flex;
    gap: 22px;
    align-items: center;
  }
  .s2-avatar-container {
    position: relative;
    width: 96px;
    height: 96px;
    flex-shrink: 0;
  }
  .s2-avatar-wrapper {
    position: relative;
    width: 96px;
    height: 96px;
    border-radius: 24px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    display: block;
    user-select: none;
  }
  .s2-avatar,
  .s2-avatar-placeholder {
    width: 100%;
    height: 100%;
    border-radius: 24px;
    object-fit: cover;
    display: block;
  }
  .s2-avatar-placeholder {
    display: grid;
    place-items: center;
    background: var(--orange-soft);
    color: var(--orange);
    font-size: 38px;
    font-weight: 600;
  }
  .s2-avatar-overlay {
    position: absolute;
    inset: 0;
    border-radius: 24px;
    background: rgba(15, 23, 42, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s ease;
    color: #ffffff;
  }
  .s2-avatar-wrapper:hover .s2-avatar-overlay {
    opacity: 1;
  }
  .s2-avatar-camera-btn {
    position: absolute;
    right: -4px;
    bottom: -4px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #ffffff;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.16);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #475569;
    cursor: pointer;
    transition: all 0.2s ease;
    z-index: 3;
    padding: 0;
  }
  .s2-avatar-camera-btn:hover,
  .s2-avatar-wrapper:hover + .s2-avatar-camera-btn {
    background: var(--orange, #ea580c);
    color: #ffffff;
    transform: scale(1.08);
  }
  .s2-avatar-camera-btn svg {
    width: 17px;
    height: 17px;
  }
  .s2-profile hr {
    margin: 28px 0;
    border: 0;
    border-top: 1px solid var(--line);
  }
</style>
<script>
  async function renderProfile() {
    const revision = viewRevision;
    moduleContent.innerHTML = '<p class="s2-empty">Đang tải hồ sơ...</p>';
    try {
      const user = await apiRequest('profile/');
      if (revision !== viewRevision) return;

      const avatarContent = user.has_avatar
        ? `<img src="api/profile/avatar?t=${Date.now()}" class="s2-avatar" alt="Ảnh đại diện" id="s2CurrentAvatarImg">`
        : `<div class="s2-avatar-placeholder" id="s2CurrentAvatarPlaceholder">${escapeHtml(user.full_name.slice(0, 1))}</div>`;
      const roleNames = user.roles.map(role => roleConfigs[role]?.label || role).join(', ');
      const workArea = user.warehouses.join(', ') || user.territory || 'Chưa gán';
      const profileFields = [
        renderInputField('full_name', 'Họ và tên', user.full_name),
        renderInputField('phone', 'Số điện thoại', user.phone, 'tel'),
        renderInputField('username', 'Tài khoản', user.username, 'text', false, null, true),
        renderInputField('scope', 'Kho / địa bàn', workArea, 'text', false, null, true)
      ].join('');

      moduleContent.innerHTML = `
        <section class="module-head">
          <div>
            <h2>Hồ sơ cá nhân</h2>
            <p>Cập nhật thông tin liên lạc và ảnh đại diện của bạn.</p>
          </div>
        </section>
        <section class="inventory-panel s2-profile">
          <div class="s2-profile-head">
            <div class="s2-avatar-container">
              <div class="s2-avatar-wrapper" onclick="triggerAvatarSelect()" role="button" tabindex="0" title="Nhấp để đổi ảnh đại diện">
                ${avatarContent}
                <div class="s2-avatar-overlay" aria-hidden="true">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                  </svg>
                </div>
              </div>
              <button type="button" class="s2-avatar-camera-btn" onclick="triggerAvatarSelect()" title="Đổi ảnh đại diện" aria-label="Đổi ảnh đại diện">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                  <circle cx="12" cy="13" r="4"></circle>
                </svg>
              </button>
              <input type="file" id="s2AvatarHiddenInput" accept="image/png,image/jpeg" style="display: none;">
            </div>
            <div>
              <h3>${escapeHtml(user.full_name)}</h3>
              <p>${escapeHtml(user.email)}</p>
              <p>${escapeHtml(roleNames)}</p>
            </div>
          </div>
          <form id="s2ProfileForm">
            <div class="form-fields">${profileFields}</div>
            <p class="s2-form-error" id="s2ProfileError" role="alert"></p>
            <button class="orange-button" type="submit">Lưu hồ sơ</button>
          </form>
        </section>
      `;
      document.getElementById('s2ProfileForm').onsubmit = saveProfile;
    } catch (e) {
      if (revision === viewRevision)
        moduleContent.innerHTML = `<p class="s2-empty">${escapeHtml(e.message)}</p>`;
    }
  }

  function triggerAvatarSelect() {
    const input = document.getElementById('s2AvatarHiddenInput');
    if (input) {
      input.value = '';
      input.click();
    }
  }

  async function saveProfile(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const button = form.querySelector('button');
    const errorMessage = document.getElementById('s2ProfileError');
    const formData = new FormData(form);
    const profile = {
      full_name: formData.get('full_name'),
      phone: formData.get('phone')
    };

    button.disabled = true;
    errorMessage.textContent = '';
    try {
      await apiRequest('profile/', jsonRequestOptions('PUT', profile));
      currentUser.fullName = profile.full_name;
      document.querySelector('.user-chip strong').textContent = currentUser.fullName;
      showToast('Đã cập nhật hồ sơ');
      if (form.isConnected) renderProfile();
    } catch (error) {
      errorMessage.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  }
</script>
