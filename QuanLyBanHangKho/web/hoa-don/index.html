<style>
.invoice-page{display:flex;flex-direction:column;gap:22px;color:#172033}
.invoice-hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px 26px;background:#fff;border:1px solid #e3e8ef;border-radius:16px;box-shadow:0 12px 30px rgba(22,34,51,.045)}
.invoice-kicker{display:block;margin-bottom:7px;color:#e85f08;font-size:11px;font-weight:700;letter-spacing:.12em}.invoice-hero h2{margin:0 0 7px;font-size:24px;line-height:1.25;color:#14213d}.invoice-hero p{max-width:720px;margin:0;color:#66758a;font-size:14px;line-height:1.65}
.invoice-primary{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 20px;border:0;border-radius:10px;background:#f97316;color:#fff;font:600 14px "Be Vietnam Pro",sans-serif;box-shadow:0 9px 20px rgba(249,115,22,.2);cursor:pointer;white-space:nowrap}.invoice-primary span{font-size:20px;font-weight:400}.invoice-primary:hover{background:#e86109;transform:translateY(-1px)}.invoice-primary:focus-visible,.invoice-action:focus-visible{outline:3px solid rgba(249,115,22,.25);outline-offset:2px}.invoice-primary:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.invoice-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.invoice-stat{display:flex;align-items:center;gap:13px;min-width:0;padding:17px 18px;background:#fff;border:1px solid #e3e8ef;border-radius:14px}.invoice-stat-icon{display:grid;place-items:center;width:42px;height:42px;flex:0 0 42px;border-radius:11px;background:#fff1e7;color:#e85f08;font-size:18px}.invoice-stat:nth-child(2) .invoice-stat-icon{background:#eaf2ff;color:#2563eb}.invoice-stat:nth-child(3) .invoice-stat-icon{background:#ebfaf2;color:#16804a}.invoice-stat:nth-child(4) .invoice-stat-icon{background:#f2edff;color:#7048c7}.invoice-stat span{display:block;overflow:hidden;color:#718096;font-size:11px;white-space:nowrap;text-overflow:ellipsis}.invoice-stat strong{display:block;margin-top:3px;overflow:hidden;color:#172033;font-size:19px;white-space:nowrap;text-overflow:ellipsis}
.invoice-rule{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid #cfe0f7;border-radius:12px;background:#f3f8ff;color:#294d7a;font-size:13px;line-height:1.6}.invoice-rule-icon{display:grid;place-items:center;width:25px;height:25px;flex:0 0 25px;border-radius:50%;background:#dcecff;color:#2563eb;font-weight:700}.invoice-rule strong{color:#173a67}
.invoice-card{overflow:hidden;background:#fff;border:1px solid #e3e8ef;border-radius:16px;box-shadow:0 10px 28px rgba(22,34,51,.035)}.invoice-card-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:19px 20px;border-bottom:1px solid #e7ebf0}.invoice-card-head h3{margin:0 0 4px;color:#172033;font-size:17px}.invoice-card-head p{margin:0;color:#7a8798;font-size:12px}.invoice-count{padding:6px 10px;border-radius:999px;background:#f4f6f8;color:#596779;font-size:12px;font-weight:600;white-space:nowrap}
.invoice-table-wrap{overflow-x:auto}.invoice-table{width:100%;min-width:850px;border-collapse:collapse}.invoice-table th,.invoice-table td{padding:13px 15px;text-align:left;border-bottom:1px solid #edf0f4;vertical-align:middle}.invoice-table th{background:#f7f9fb;color:#64748b;font-size:11px;font-weight:700;letter-spacing:.025em}.invoice-table tbody tr:hover{background:#fffaf6}.invoice-table tbody tr:last-child td{border-bottom:0}.invoice-table td{color:#445164;font-size:13px}.invoice-table td strong{color:#172033}.invoice-number{display:flex;flex-direction:column;gap:4px}.invoice-number small,.invoice-table small{color:#8793a3}.invoice-status{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:#eaf8f0;color:#167545;font-size:11px;font-weight:600}.invoice-status:before{content:'';width:6px;height:6px;border-radius:50%;background:#21a366}.invoice-action{min-height:34px;padding:6px 11px;border:1px solid #dce3eb;border-radius:8px;background:#fff;color:#34445b;font:500 12px "Be Vietnam Pro",sans-serif;cursor:pointer}.invoice-action:hover{border-color:#f97316;color:#e85f08;background:#fff8f3}
.invoice-empty{display:flex;flex-direction:column;align-items:center;padding:48px 24px;text-align:center;color:#718096}.invoice-empty-icon{display:grid;place-items:center;width:54px;height:54px;margin-bottom:14px;border-radius:16px;background:#fff1e7;color:#e85f08;font-size:23px}.invoice-empty h4{margin:0 0 7px;color:#27364a;font-size:15px}.invoice-empty p{max-width:440px;margin:0 0 18px;font-size:13px;line-height:1.6}
.invoice-pick-list{display:flex;flex-direction:column;gap:9px;max-height:310px;overflow:auto;padding:3px}.invoice-pick{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:13px 14px;border:1px solid #dfe5ec;border-radius:11px;background:#fff;cursor:pointer;transition:border-color .15s,background .15s}.invoice-pick:hover{border-color:#f9b985}.invoice-pick:has(input:checked){border-color:#f97316;background:#fff8f2;box-shadow:0 0 0 2px rgba(249,115,22,.08)}.invoice-pick input{width:17px;height:17px;accent-color:#f97316}.invoice-pick small{display:block;margin-top:3px;color:#748196}.invoice-pick>strong{color:#172033}.invoice-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:6px 0}.invoice-summary div{padding:13px 14px;border:1px solid #e6eaf0;border-radius:10px;background:#f8fafc}.invoice-summary span{display:block;color:#7a8798;font-size:11px}.invoice-summary strong{display:block;margin-top:5px;color:#172033;font-size:15px}
#s2Dialog:has(.invoice-pick-list) .form-dialog{width:min(860px,calc(100vw - 28px))}.invoice-document{color:#0f172a;font-family:Arial,sans-serif}.invoice-document-head{display:flex;justify-content:space-between;gap:20px;padding-bottom:14px;border-bottom:2px solid #0f172a}.invoice-document h2{margin:0 0 8px}.invoice-document-meta{margin:14px 0;line-height:1.65}.invoice-document-total{display:grid;grid-template-columns:1fr auto;gap:8px;width:min(360px,100%);margin-left:auto;padding-top:14px}.invoice-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.invoice-adjustments{margin-top:18px;padding-top:14px;border-top:1px solid #e2e8f0}.invoice-lock{margin-top:14px;padding:10px 12px;border-radius:10px;background:#f0fdf4;color:#166534}
#s2Dialog:has(.invoice-document) .form-dialog{width:min(1080px,calc(100vw - 32px));border-radius:16px}#s2Dialog:has(.invoice-document) .form-fields{display:block;padding:26px 30px}#s2Dialog:has(.invoice-document) header p{display:none}#s2Dialog:has(.invoice-document) .invoice-actions{margin-top:20px;padding-top:18px;border-top:1px solid #e7ebf0}.invoice-actions .invoice-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:1px solid #f97316;border-radius:13px;background:#f97316;color:#fff;font:600 14px "Be Vietnam Pro",sans-serif;cursor:pointer;box-shadow:0 7px 16px rgba(249,115,22,.18);transition:background .15s,border-color .15s,transform .15s}.invoice-actions .invoice-btn:hover{border-color:#e86109;background:#e86109;transform:translateY(-1px)}.invoice-actions .invoice-btn:focus-visible{outline:3px solid rgba(249,115,22,.2);outline-offset:2px}
.invoice-document{grid-column:1/-1;font-family:"Be Vietnam Pro",Inter,Arial,sans-serif}.invoice-doc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding-bottom:22px;border-bottom:1px solid #dfe5ec}.invoice-doc-brand{display:flex;align-items:center;gap:13px}.invoice-doc-mark{display:grid;place-items:center;width:48px;height:48px;border-radius:13px;background:#f97316;color:#fff;font-size:15px;font-weight:700;box-shadow:0 8px 18px rgba(249,115,22,.2)}.invoice-doc-brand strong{display:block;color:#14213d;font-size:21px}.invoice-doc-brand small{display:block;margin-top:3px;color:#7a8798;font-size:12px}.invoice-doc-identity{text-align:right}.invoice-doc-identity span{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eaf8f0;color:#167545;font-size:10px;font-weight:700;letter-spacing:.04em}.invoice-doc-identity strong{display:block;margin-top:9px;color:#14213d;font-size:20px}.invoice-doc-identity small{display:block;margin-top:4px;color:#7a8798;font-size:11px}
.invoice-doc-title{margin:22px 0 15px}.invoice-doc-title span{display:block;color:#e85f08;font-size:10px;font-weight:700;letter-spacing:.13em}.invoice-doc-title h3{margin:4px 0 0;color:#172033;font-size:18px}.invoice-doc-info{display:grid;grid-template-columns:2fr 1fr 1fr;gap:1px;overflow:hidden;margin-bottom:14px;border:1px solid #e1e6ec;border-radius:12px;background:#e1e6ec}.invoice-doc-info>div{min-width:0;padding:14px 15px;background:#f8fafc}.invoice-doc-info span,.invoice-doc-note span{display:block;margin-bottom:5px;color:#7b8797;font-size:9px;font-weight:700;letter-spacing:.07em}.invoice-doc-info strong{display:block;overflow:hidden;color:#24334a;font-size:12px;text-overflow:ellipsis}.invoice-doc-info small{display:block;margin-top:4px;color:#69778a;font-size:10px}.invoice-doc-deliveries{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px;color:#6d7a8c;font-size:11px}.invoice-doc-chip{display:inline-flex;padding:5px 8px;border:1px solid #dfe5ec;border-radius:7px;background:#fff;color:#34445b;font-weight:600}
.invoice-doc-lines{overflow-x:auto;border:1px solid #e1e6ec;border-radius:12px}.invoice-doc-lines table{width:100%;min-width:720px;border-collapse:collapse}.invoice-doc-lines th{padding:10px 12px;background:#f4f7fa;color:#677588;font-size:9px;font-weight:700;text-align:left;letter-spacing:.025em}.invoice-doc-lines td{padding:12px;border-top:1px solid #edf0f4;color:#445164;font-size:11px;vertical-align:middle}.invoice-doc-lines td strong{display:block;color:#172033;font-size:11px}.invoice-doc-lines td small{display:block;margin-top:3px;color:#8692a1;font-size:9px}.invoice-doc-lines .num{text-align:right;white-space:nowrap}
.invoice-doc-bottom{display:grid;grid-template-columns:1fr minmax(300px,360px);gap:28px;align-items:start;margin-top:18px}.invoice-doc-note{padding:14px;border:1px dashed #dce3eb;border-radius:10px;color:#64748b;font-size:11px;line-height:1.55}.invoice-document-total{width:100%;margin:0;padding:15px 16px;border-radius:11px;background:#f8fafc}.invoice-document-total span,.invoice-document-total strong{padding:2px 0;font-size:11px}.invoice-document-total strong{text-align:right;color:#24334a}.invoice-document-total .invoice-grand-label,.invoice-document-total .invoice-grand-value{margin-top:5px;padding-top:10px;border-top:1px solid #dbe2e9;color:#e85f08;font-size:14px;font-weight:700}.invoice-lock{display:flex;align-items:flex-start;gap:9px;margin-top:18px;padding:12px 14px;border:1px solid #cdebd9;background:#f1fbf5;color:#236842;font-size:11px;line-height:1.5}.invoice-lock b{font-size:14px}.invoice-adjustments h3{font-family:"Be Vietnam Pro",sans-serif;font-size:14px}
@media(max-width:980px){.invoice-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.invoice-hero{align-items:stretch;flex-direction:column;padding:20px}.invoice-primary{width:100%}.invoice-stats{grid-template-columns:1fr}.invoice-summary{grid-template-columns:1fr}.invoice-document-head,.invoice-doc-top{display:block}.invoice-doc-identity{margin-top:16px;text-align:left}.invoice-doc-info{grid-template-columns:1fr}.invoice-doc-bottom{grid-template-columns:1fr}#s2Dialog:has(.invoice-document) .form-fields{padding:20px}.invoice-card-head{align-items:flex-start;flex-direction:column}}@media(prefers-reduced-motion:reduce){.invoice-primary,.invoice-pick{transition:none}.invoice-primary:hover{transform:none}}
@media print{body>*{display:none!important}body>.invoice-print{display:block!important;padding:20px}.invoice-print .invoice-actions,.invoice-print .invoice-lock{display:none!important}.invoice-print .invoice-table{min-width:0}.invoice-print .invoice-table th,.invoice-print .invoice-table td{border:1px solid #94a3b8}}
</style>
<script>
window.sprint5Features=window.sprint5Features||{};
window.sprint5Features['Hóa đơn bán hàng']={path:'hoa-don',permission:'invoices.write',render:async()=>{
 const rev=viewRevision,host=moduleContent,e=escapeHtml,m=formatMoney;
 const dt=value=>{if(!value)return '—';const parsed=new Date(String(value).replace(' ','T'));return Number.isNaN(parsed.getTime())?String(value):new Intl.DateTimeFormat('vi-VN',{dateStyle:'short',timeStyle:'short'}).format(parsed);};
 host.innerHTML='<section class="invoice-page"><div class="invoice-hero"><div><span class="invoice-kicker">KẾ TOÁN CÔNG NỢ</span><h2>Phát hành hóa đơn bán hàng</h2><p>Lập hóa đơn từ các phiếu đã giao, kiểm soát số tiền thực giao và quản lý chứng từ điều chỉnh tại một nơi.</p></div><button class="invoice-primary" id="invoiceIssue"><span aria-hidden="true">＋</span> Phát hành hóa đơn</button></div><div class="invoice-stats"><div class="invoice-stat"><div class="invoice-stat-icon">⇥</div><div><span>Phiếu chờ phát hành</span><strong id="invoiceWaiting">—</strong></div></div><div class="invoice-stat"><div class="invoice-stat-icon">▤</div><div><span>Hóa đơn đã phát hành</span><strong id="invoiceIssued">—</strong></div></div><div class="invoice-stat"><div class="invoice-stat-icon">₫</div><div><span>Tổng giá trị hóa đơn</span><strong id="invoiceValue">—</strong></div></div><div class="invoice-stat"><div class="invoice-stat-icon">±</div><div><span>Chứng từ điều chỉnh</span><strong id="invoiceAdjusted">—</strong></div></div></div><div class="invoice-rule"><div class="invoice-rule-icon">i</div><div><strong>Quy tắc phát hành:</strong> chỉ tính số lượng thực giao; có thể gộp nhiều phiếu của cùng đại lý trong kỳ. Hóa đơn sau phát hành chỉ đọc, sai sót xử lý bằng chứng từ điều chỉnh.</div></div><div id="invoiceBody" class="invoice-card"><div class="invoice-empty"><div class="invoice-empty-icon">…</div><h4>Đang tải dữ liệu</h4></div></div></section>';
 try{const data=await apiRequest('invoices');if(rev!==viewRevision)return;renderList(data);}catch(err){if(rev===viewRevision)host.querySelector('#invoiceBody').innerHTML='<div class="invoice-empty" role="alert">'+e(err.message)+'</div>';}
 function table(headers,rows){return '<div class="invoice-table-wrap"><table class="invoice-table"><thead><tr>'+headers.map(x=>'<th>'+e(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';}
 function renderList(data){
  host.querySelector('#invoiceIssue').disabled=!data.candidates.length;
  host.querySelector('#invoiceIssue').title=data.candidates.length?'':'Chưa có phiếu giao đủ điều kiện';
  host.querySelector('#invoiceIssue').onclick=()=>issue(data.candidates);
  host.querySelector('#invoiceWaiting').textContent=data.candidates.length;
  host.querySelector('#invoiceIssued').textContent=data.invoices.length;
  host.querySelector('#invoiceValue').textContent=m(data.invoices.reduce((sum,x)=>sum+Number(x.total_amount||0),0));
  host.querySelector('#invoiceAdjusted').textContent=data.invoices.reduce((sum,x)=>sum+Number(x.adjustment_count||0),0);
  const head='<div class="invoice-card-head"><div><h3>Hóa đơn đã phát hành</h3><p>Danh sách chứng từ được khóa sau khi phát hành</p></div><span class="invoice-count">'+data.invoices.length+' hóa đơn</span></div>';
  const empty='<div class="invoice-empty"><div class="invoice-empty-icon">▤</div><h4>Chưa có hóa đơn đã phát hành</h4><p>Có '+data.candidates.length+' phiếu giao đang chờ. Hãy phát hành hóa đơn đầu tiên để bắt đầu theo dõi công nợ.</p>'+(data.candidates.length?'<button class="invoice-primary" id="invoiceEmptyIssue"><span aria-hidden="true">＋</span> Phát hành hóa đơn</button>':'')+'</div>';
  host.querySelector('#invoiceBody').innerHTML=head+(data.invoices.length?table(['Số hóa đơn','Đại lý','Kỳ hóa đơn','Phiếu giao','Giá trị','Trạng thái','Thao tác'],data.invoices.map(x=>'<tr><td><div class="invoice-number"><strong>'+e(x.invoice_number)+'</strong><small>'+e(dt(x.issued_at))+'</small></div></td><td><strong>'+e(x.customer_name)+'</strong><br><small>'+e(x.customer_code)+'</small></td><td>'+e(x.period_from)+' → '+e(x.period_to)+'</td><td>'+e(x.delivery_count)+' phiếu</td><td><strong>'+m(x.total_amount)+'</strong>'+(Number(x.adjustment_count)?'<br><small>'+e(x.adjustment_count)+' điều chỉnh · '+m(x.adjustment_total)+'</small>':'')+'</td><td><span class="invoice-status">Đã phát hành</span></td><td><button class="invoice-action" data-detail="'+x.id+'">Xem chi tiết</button></td></tr>')):empty);
  host.querySelector('#invoiceEmptyIssue')?.addEventListener('click',()=>issue(data.candidates));
  host.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));
 }
 function issue(candidates){
  const customers=[...new Map(candidates.map(x=>[String(x.customer_id),x])).values()];
  const today=new Date(),from=new Date(today.getFullYear(),today.getMonth(),1).toLocaleDateString('en-CA'),to=today.toLocaleDateString('en-CA');
  const customerOptions=customers.map(x=>'<option value="'+x.customer_id+'">'+e(x.customer_code+' · '+x.customer_name)+'</option>').join('');
  const {form,close}=openFormDialog('Phát hành hóa đơn bán hàng','<div class="form-group full"><label>Đại lý *<select name="customerId" required><option value="">Chọn đại lý</option>'+customerOptions+'</select></label></div><div class="form-group"><label>Từ ngày *<input name="periodFrom" type="date" value="'+from+'" required></label></div><div class="form-group"><label>Đến ngày *<input name="periodTo" type="date" value="'+to+'" required></label></div><div class="form-group full"><label>Phiếu giao trong kỳ *</label><div id="invoicePicks" class="invoice-pick-list"><span>Chọn đại lý để xem phiếu giao.</span></div></div><div class="form-group full"><label>Ghi chú<textarea name="note" maxlength="1000"></textarea></label></div><div id="invoiceEstimate" class="form-group full"></div>','Phát hành và khóa hóa đơn');
  const picks=form.querySelector('#invoicePicks'),estimate=form.querySelector('#invoiceEstimate');
  function refresh(){const cid=form.customerId.value,start=form.periodFrom.value,end=form.periodTo.value;const rows=candidates.filter(x=>String(x.customer_id)===cid&&x.delivered_at.slice(0,10)>=start&&x.delivered_at.slice(0,10)<=end);picks.innerHTML=rows.length?rows.map(x=>'<label class="invoice-pick"><input type="checkbox" name="orderId" value="'+x.order_id+'"><span><strong>'+e(x.order_code)+'</strong><small>Giao '+e(x.delivered_at)+' · '+e(x.delivered_line_count)+' dòng thực giao</small></span><strong>'+m(x.delivered_total)+'</strong></label>').join(''):'<span>Không có phiếu giao chưa xuất hóa đơn trong kỳ này.</span>';picks.querySelectorAll('input').forEach(x=>x.onchange=calc);calc();}
  function calc(){const ids=[...picks.querySelectorAll('input:checked')].map(x=>x.value);const total=candidates.filter(x=>ids.includes(String(x.order_id))).reduce((s,x)=>s+Number(x.delivered_total),0);estimate.innerHTML=ids.length?'<div class="invoice-summary"><div><span>Phiếu giao đã chọn</span><strong>'+ids.length+'</strong></div><div><span>Tạm tính theo thực giao</span><strong>'+m(total)+'</strong></div><div><span>Trạng thái sau phát hành</span><strong>Chỉ đọc</strong></div></div>':'';}
  form.customerId.onchange=refresh;form.periodFrom.onchange=refresh;form.periodTo.onchange=refresh;form.customerId.value=customers[0]?.customer_id||'';refresh();
  form.onsubmit=async ev=>{ev.preventDefault();const ids=[...picks.querySelectorAll('input:checked')].map(x=>Number(x.value));if(!ids.length){form.querySelector('#s2FormError').textContent='Vui lòng chọn ít nhất một phiếu giao.';return;}const button=form.querySelector('[type=submit]');button.disabled=true;try{const invoice=await apiRequest('invoices',jsonRequestOptions('POST',{periodFrom:form.periodFrom.value,periodTo:form.periodTo.value,note:form.note.value,orderIds:ids}));close();showToast('Đã phát hành '+invoice.invoice_number,'success');sprint5Features['Hóa đơn bán hàng'].render();}catch(err){form.querySelector('#s2FormError').textContent=err.message;button.disabled=false;}};
 }
 async function detail(id){try{const x=await apiRequest('invoices/'+id);if(rev!==viewRevision)return;const html=documentHtml(x);const {form}=openFormDialog('Chi tiết hóa đơn',html+'<div class="invoice-actions"><button type="button" class="invoice-btn" id="invoicePrint">In / Lưu PDF</button><button type="button" class="invoice-btn" id="invoiceAdjust">Lập chứng từ điều chỉnh</button></div>',null);form.querySelector('#invoicePrint').onclick=()=>printInvoice(html);form.querySelector('#invoiceAdjust').onclick=()=>adjust(x);}catch(err){showToast(err.message,'error');}}
 function documentHtml(x){const adjustmentTotal=(x.adjustments||[]).reduce((s,a)=>s+Number(a.amount),0),deliveryChips=x.deliveries.map(d=>'<span class="invoice-doc-chip">'+e(d.order_code)+'</span>').join(''),rows=x.lines.map(l=>'<tr><td><strong>'+e(l.sku+' · '+l.name)+'</strong><small>Đơn '+e(l.order_code)+'</small></td><td class="num"><strong>'+e(l.delivered_quantity)+'</strong></td><td>'+e(l.unit_name)+'</td><td class="num">'+m(l.unit_price)+'</td><td class="num">'+m(l.discount_amount)+'</td><td class="num"><strong>'+m(l.line_total)+'</strong></td></tr>').join('');return '<article class="invoice-document"><div class="invoice-doc-top"><div class="invoice-doc-brand"><span class="invoice-doc-mark">KF</span><div><strong>KhoFlow</strong><small>Hệ thống bán hàng & kho</small></div></div><div class="invoice-doc-identity"><span>ĐÃ PHÁT HÀNH</span><strong>'+e(x.invoice_number)+'</strong><small>'+e(dt(x.issued_at))+'</small></div></div><div class="invoice-doc-title"><span>CHỨNG TỪ BÁN HÀNG</span><h3>Hóa đơn bán hàng</h3></div><div class="invoice-doc-info"><div><span>ĐẠI LÝ</span><strong>'+e(x.customer_code+' · '+x.customer_name)+'</strong><small>MST: '+e(x.tax_code||'—')+' · '+e(x.region||'—')+' · '+e(x.phone||'—')+'</small></div><div><span>KỲ HÓA ĐƠN</span><strong>'+e(x.period_from)+' → '+e(x.period_to)+'</strong><small>'+x.deliveries.length+' phiếu giao</small></div><div><span>NGƯỜI LẬP</span><strong>'+e(x.issued_by_name)+'</strong><small>Kế toán công nợ</small></div></div><div class="invoice-doc-deliveries"><span>Phiếu giao:</span>'+deliveryChips+'</div><div class="invoice-doc-lines"><table><thead><tr><th>SẢN PHẨM</th><th class="num">SL THỰC GIAO</th><th>ĐƠN VỊ</th><th class="num">ĐƠN GIÁ</th><th class="num">CHIẾT KHẤU</th><th class="num">THÀNH TIỀN</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="invoice-doc-bottom"><div class="invoice-doc-note"><span>GHI CHÚ</span>'+e(x.note||'Không có ghi chú')+'</div><div class="invoice-document-total"><span>Tạm tính</span><strong>'+m(x.subtotal)+'</strong><span>Chiết khấu</span><strong>- '+m(x.discount_total)+'</strong><span class="invoice-grand-label">TỔNG HÓA ĐƠN</span><strong class="invoice-grand-value">'+m(x.total_amount)+'</strong>'+(x.adjustments.length?'<span>Tổng điều chỉnh</span><strong>'+m(adjustmentTotal)+'</strong><span>Sau điều chỉnh</span><strong>'+m(Number(x.total_amount)+adjustmentTotal)+'</strong>':'')+'</div></div><div class="invoice-lock"><b>✓</b><span>Hóa đơn đã phát hành và được khóa dữ liệu. Nếu có sai sót, hãy lập chứng từ điều chỉnh thay vì sửa hoặc xóa hóa đơn.</span></div>'+(x.adjustments.length?'<div class="invoice-adjustments"><h3>Chứng từ điều chỉnh</h3>'+table(['Số chứng từ','Thời gian','Số tiền','Lý do','Người lập'],x.adjustments.map(a=>'<tr><td>'+e(a.adjustment_number)+(a.return_code?'<br><small>Phiếu trả '+e(a.return_code)+'</small>':'')+'</td><td>'+e(dt(a.created_at))+'</td><td>'+m(a.amount)+'</td><td>'+e(a.reason)+'</td><td>'+e(a.created_by_name)+'</td></tr>'))+'</div>':'')+'</article>';}
 function printInvoice(html){const print=document.createElement('section');print.className='invoice-print';print.innerHTML=html;document.body.appendChild(print);try{window.print();}finally{print.remove();}}
 function adjust(x){document.getElementById('s2Dialog')?.remove();const {form,close}=openFormDialog('Điều chỉnh '+x.invoice_number,'<div class="form-group"><label>Số tiền điều chỉnh *<input name="amount" type="number" step="0.01" required><small>Nhập số âm để giảm, số dương để tăng công nợ.</small></label></div><div class="form-group full"><label>Lý do điều chỉnh *<textarea name="reason" maxlength="1000" required></textarea></label></div>','Lập chứng từ điều chỉnh');form.onsubmit=async ev=>{ev.preventDefault();const button=form.querySelector('[type=submit]');button.disabled=true;try{await apiRequest('invoices/'+x.id+'/adjustments',jsonRequestOptions('POST',{amount:form.amount.value,reason:form.reason.value}));close();showToast('Đã lập chứng từ điều chỉnh','success');sprint5Features['Hóa đơn bán hàng'].render();}catch(err){form.querySelector('#s2FormError').textContent=err.message;button.disabled=false;}};}
}};
</script>
