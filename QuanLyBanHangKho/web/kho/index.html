<style>
.warehouse-feature{display:flex;flex-direction:column;gap:20px}.warehouse-feature .wh-card{padding:20px;background:white;border:1px solid #e4e9ef;border-radius:14px}.warehouse-feature .wh-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.warehouse-feature h2,.warehouse-feature h3{color:#172033;margin:0 0 10px}.warehouse-feature .wh-error{color:#b42318}.warehouse-feature .wh-muted{color:#64748b}.warehouse-feature .wh-low{background:#fff4e5}.warehouse-feature .wh-actions{display:flex;gap:8px;flex-wrap:wrap}.warehouse-feature .table-scroll{overflow-x:auto}.warehouse-feature label{display:flex;flex-direction:column;gap:6px}.warehouse-feature input,.warehouse-feature select{min-height:40px;max-width:100%;border:1px solid #dce3ea;border-radius:8px;padding:8px}.wh-lines{display:flex;flex-direction:column;gap:12px}.wh-line{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border:1px solid #e4e9ef;border-radius:10px}.wh-line label{flex:1 1 120px;min-width:0}.wh-line label:first-child{flex-basis:220px}.wh-line input,.wh-line select{width:100%;min-width:0}@media(max-width:720px){.warehouse-feature .wh-card{padding:14px}.wh-line label{flex-basis:100%}}
.warehouse-feature button,#s2Dialog:has(.wh-lines) button,#s2Dialog:has(.warehouse-table) button{min-height:38px;padding:8px 14px;border:1px solid #dce3ea;border-radius:8px;background:#fff;color:#172033;font:inherit;cursor:pointer;margin:2px}.warehouse-feature button:hover,#s2Dialog:has(.wh-lines) button:hover,#s2Dialog:has(.warehouse-table) button:hover{background:#f8fafc;border-color:var(--orange)}.warehouse-feature button.orange-button,#s2Dialog button.orange-button{background:var(--orange);border-color:var(--orange);color:#fff}.warehouse-feature button:disabled,#s2Dialog button:disabled{opacity:.55;cursor:not-allowed}.warehouse-feature td:last-child{white-space:nowrap}.wh-danger{color:#b42318!important;border-color:#f0b4ae!important}
</style>
<script>
window.sprint5Features=window.sprint5Features||{};
window.warehouseUi={
 esc:v=>escapeHtml(v==null?'':String(v)),
 opts:(rows,label='name')=>rows.map(r=>[r.id,r[label]]),
 field:(...args)=>renderInputField(...args),
 table(headers,rows){return `<div class="table-scroll warehouse-table"><table class="feature-table"><thead><tr>${headers.map(h=>`<th>${this.esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}">Chưa có dữ liệu.</td></tr>`}</tbody></table></div>`;},
 async submit(form,url,method,body,close,reload){const b=form.querySelector('button[type=submit]');if(b.disabled)return;b.disabled=true;try{await apiRequest(url,jsonRequestOptions(method,body));close();showToast('Đã lưu thành công');await reload();}catch(e){form.querySelector('#s2FormError').textContent=e.message;}finally{if(b.isConnected)b.disabled=false;}},
 async screen(title,subtitle,load,draw){const rev=viewRevision;moduleContent.innerHTML=`<section class="warehouse-feature"><h2>${this.esc(title)}</h2><p class="wh-muted">${this.esc(subtitle)}</p><div id="whContent" class="wh-card" aria-live="polite">Đang tải…</div></section>`;try{const data=await load();if(rev!==viewRevision)return;const host=document.getElementById('whContent');draw(host,data,rev);}catch(e){if(rev===viewRevision)document.getElementById('whContent').innerHTML=`<p class="wh-error" role="alert">${this.esc(e.message)}</p>`;}},
};
window.sprint5Features['Kho & vị trí']={path:'kho',permission:'warehouses.manage',render:()=>warehouseUi.screen('Kho & vị trí','Khai báo kho, người phụ trách và kệ/khu lưu hàng. Kho phục vụ đại lý được chọn trong hồ sơ đại lý.',()=>apiRequest('warehouses/config'),(host,data)=>{
 const ui=warehouseUi,esc=ui.esc;
 host.innerHTML=`<div class="wh-toolbar"><button class="orange-button" id="whNew">Thêm kho</button></div>${ui.table(['Mã kho','Tên kho','Địa chỉ','Người phụ trách','Trạng thái','Thao tác'],data.warehouses.map(w=>`<tr><td>${esc(w.code)}</td><td>${esc(w.name)}</td><td>${esc(w.address)}</td><td>${esc(w.manager_name)}</td><td>${w.active?'Đang hoạt động':'Ngừng hoạt động'}</td><td><button data-edit="${w.id}">Sửa</button> <button data-location="${w.id}">Thêm vị trí</button></td></tr>`))}<h3 style="margin-top:20px">Vị trí lưu hàng</h3>${ui.table(['Kho','Mã vị trí','Tên vị trí','Trạng thái','Thao tác'],data.locations.map(l=>`<tr><td>${esc(data.warehouses.find(w=>w.id===l.warehouse_id)?.name)}</td><td>${esc(l.code)}</td><td>${esc(l.name)}</td><td>${l.active?'Đang dùng':'Ngừng dùng'}</td><td><button data-loc-edit="${l.id}">Sửa</button></td></tr>`))}`;
 const reload=()=>sprint5Features['Kho & vị trí'].render();
 function warehouse(w={}){const {form,close}=openFormDialog(w.id?'Sửa kho':'Thêm kho',ui.field('code','Mã kho',w.code)+ui.field('name','Tên kho',w.name)+ui.field('address','Địa chỉ',w.address)+ui.field('managerId','Người phụ trách',w.manager_id,'text',true,ui.opts(data.managers,'full_name'))+ui.field('active','Trạng thái',w.active===false?'false':'true','text',true,[['true','Đang hoạt động'],['false','Ngừng hoạt động']]));form.onsubmit=e=>{e.preventDefault();const f=new FormData(form);ui.submit(form,'warehouses'+(w.id?'/'+w.id:''),w.id?'PUT':'POST',{code:f.get('code'),name:f.get('name'),address:f.get('address'),managerId:Number(f.get('managerId')),active:f.get('active')==='true'},close,reload);};}
 function location(warehouseId,l={}){const {form,close}=openFormDialog(l.id?'Sửa vị trí':'Thêm vị trí',ui.field('code','Mã vị trí',l.code)+ui.field('name','Tên kệ/khu',l.name)+ui.field('active','Trạng thái',l.active===false?'false':'true','text',true,[['true','Đang dùng'],['false','Ngừng dùng']]));form.onsubmit=e=>{e.preventDefault();const f=new FormData(form);ui.submit(form,'warehouses/'+warehouseId+'/locations'+(l.id?'/'+l.id:''),l.id?'PUT':'POST',{code:f.get('code'),name:f.get('name'),active:f.get('active')==='true'},close,reload);};}
 host.querySelector('#whNew').onclick=()=>warehouse();host.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>warehouse(data.warehouses.find(w=>w.id===Number(b.dataset.edit))));host.querySelectorAll('[data-location]').forEach(b=>b.onclick=()=>location(Number(b.dataset.location)));host.querySelectorAll('[data-loc-edit]').forEach(b=>b.onclick=()=>{const l=data.locations.find(x=>x.id===Number(b.dataset.locEdit));location(l.warehouse_id,l);});
})};
</script>
