<script>
window.sprint5Features=window.sprint5Features||{};
window.sprint5Features['Kiểm kê kho']={path:'kiem-ke',permission:'inventory.write',render:()=>warehouseUi.screen('Kiểm kê kho','Tồn sổ được chốt khi tạo phiếu. Nếu hàng tiếp tục biến động, tạo phiếu mới trước khi chốt để không ghi đè.',async()=>({rows:await apiRequest('stock-counts'),masters:await apiRequest('inventory/masters')}),(host,{rows,masters})=>{
 const ui=warehouseUi,e=ui.esc,reload=()=>sprint5Features['Kiểm kê kho'].render();
 host.innerHTML='<button class="orange-button" id="kkNew">Tạo phiếu kiểm kê</button>'+ui.table(['Mã phiếu','Kho','Trạng thái','Thao tác'],rows.map(r=>'<tr><td>'+e(r.code)+'</td><td>'+e(r.warehouse_name)+'</td><td>'+(r.status==='DRAFT'?'Đang đếm':r.status==='CANCELLED'?'Đã hủy':'Đã chốt')+'</td><td><button data-open="'+r.id+'">Số đếm & chênh lệch</button></td></tr>'));
 host.querySelector('#kkNew').onclick=()=>{const {form,close}=openFormDialog('Tạo phiếu kiểm kê',ui.field('warehouseId','Kho','','text',true,ui.opts(masters.warehouses.filter(w=>w.active)))+ui.field('categoryId','Nhóm hàng (để trống: toàn kho)','','text',false,ui.opts(masters.categories)));form.onsubmit=event=>{event.preventDefault();const f=new FormData(form);ui.submit(form,'stock-counts','POST',{warehouseId:Number(f.get('warehouseId')),categoryId:f.get('categoryId')?Number(f.get('categoryId')):null},close,reload);};};
 async function detail(id){
  const r=await apiRequest('stock-counts/'+id),draft=r.status==='DRAFT';
  const {form,close}=openFormDialog('Kiểm kê '+r.code,ui.table(['SKU','Vị trí','Lô','Đơn vị cơ sở','Tồn sổ tại lúc tạo','Thực đếm','Chênh lệch'],r.lines.map(l=>'<tr><td>'+e(l.sku+' · '+l.name)+'</td><td>'+e(l.location_name)+'</td><td>'+e(l.lot_number)+'</td><td>'+e(l.base_unit)+'</td><td>'+l.snapshot_quantity+'</td><td>'+(draft?'<input type="number" name="qty'+l.id+'" min="0" step="1" required value="'+e(l.actual_quantity??'')+'">':l.actual_quantity)+'</td><td data-diff="'+l.id+'">'+e(l.difference??'Chưa đếm')+'</td></tr>'))+(draft?ui.field('reason','Lý do khi chốt','','textarea',false):'<p>Lý do: '+e(r.reason)+'</p>')+(draft&&r.canConfirm?'<label class="form-group full"><span><input type="checkbox" name="releaseReservations"> Nếu thực đếm thấp hơn giữ chỗ, trả các đơn Đã duyệt liên quan về Chờ duyệt và nhả toàn bộ giữ chỗ của chúng. Đơn đang soạn phải xử lý trước; thao tác sẽ lưu cùng chốt kiểm kê.</span></label>':'')+(draft&&r.canConfirm?'<button type="button" class="orange-button" id="kkConfirm">Chốt kiểm kê và điều chỉnh tồn</button>':''),draft?'Lưu số đếm':null);
  if(draft){const cancel=document.createElement('button');cancel.type='button';cancel.className='wh-danger';cancel.textContent='Hủy phiếu nháp';form.append(cancel);cancel.onclick=()=>{close();const d=openFormDialog('Hủy kiểm kê '+r.code,ui.field('reason','Lý do hủy','','textarea',true),'Hủy phiếu nháp');d.form.onsubmit=event=>{event.preventDefault();ui.submit(d.form,'stock-counts/'+id+'/cancel','POST',{reason:new FormData(d.form).get('reason')},d.close,reload);};};}
  const payload=()=>({lines:r.lines.map(l=>({lineId:l.id,actualQuantity:form.querySelector('[name=qty'+l.id+']').value}))});
  r.lines.forEach(l=>{const input=form.querySelector('[name=qty'+l.id+']');if(input)input.oninput=()=>form.querySelector('[data-diff="'+l.id+'"]').textContent=input.value===''?'Chưa đếm':Number(input.value)-Number(l.snapshot_quantity);});
  form.onsubmit=event=>{event.preventDefault();ui.submit(form,'stock-counts/'+id,'PUT',payload(),close,reload);};
  form.querySelector('#kkConfirm')?.addEventListener('click',async()=>{
   if(!form.reportValidity())return;const reason=form.querySelector('[name=reason]').value.trim();if(!reason){form.querySelector('#s2FormError').textContent='Bắt buộc nhập lý do khi chốt kiểm kê.';return;}
   const buttons=form.querySelectorAll('button');if(form.dataset.busy)return;form.dataset.busy='1';buttons.forEach(b=>b.disabled=true);
   try{await apiRequest('stock-counts/'+id,jsonRequestOptions('PUT',payload()));await apiRequest('stock-counts/'+id+'/confirm',jsonRequestOptions('POST',{reason,releaseReservations:form.querySelector('[name=releaseReservations]')?.checked===true}));close();showToast('Đã chốt kiểm kê');reload();}catch(err){if(form.isConnected)form.querySelector('#s2FormError').textContent=err.message;}finally{delete form.dataset.busy;buttons.forEach(b=>{if(b.isConnected)b.disabled=false;});}
  });
 }
 host.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>detail(b.dataset.open).catch(err=>showToast(err.message,'error')));
})};
</script>
