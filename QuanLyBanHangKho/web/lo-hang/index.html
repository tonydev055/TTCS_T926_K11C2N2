<script>
window.sprint5Features['Lô & hạn dùng']={path:'lo-hang',permission:'inventory.read',render:()=>{
 const ui=warehouseUi,e=ui.esc,revision=viewRevision;let warehouse='',state='',empty=false;
 function load(){if(revision!==viewRevision)return;return ui.screen('Lô & hạn dùng','Theo dõi ngày sản xuất, hạn dùng và số lượng thực tế theo từng vị trí.',()=>apiRequest('lots?warehouseId='+encodeURIComponent(warehouse)+'&state='+state+'&includeEmpty='+empty),(host,d)=>{
 host.innerHTML='<div class="wh-toolbar"><label>Kho<select id="lotWh"><option value="">Tất cả kho được phân công</option>'+d.warehouses.map(w=>'<option value="'+w.id+'">'+e(w.name)+'</option>').join('')+'</select></label><label>Hạn dùng<select id="lotState"><option value="">Tất cả</option><option value="EXPIRED">Đã hết hạn</option><option value="SOON">Sắp hết hạn</option><option value="VALID">Còn hạn</option></select></label>'+'<label><input type="checkbox" id="lotEmpty"> Hiện cả lô đã hết</label>'+(d.canManage?'<button id="lotSettings">Cấu hình sản phẩm</button>':'')+'</div>'+ui.table(['Sản phẩm','Kho / vị trí','Lô','Ngày sản xuất','Hạn dùng','Tồn','Trạng thái','Thao tác'],d.items.map(b=>'<tr><td>'+e(b.sku)+' — '+e(b.name)+'</td><td>'+e(b.warehouse_name)+' / '+e(b.location_name)+'</td><td>'+e(b.lot_number)+'</td><td>'+e(b.manufactured_date||'Chưa ghi nhận')+'</td><td>'+e(b.expiry_date||'Không áp dụng')+'</td><td>'+e(b.on_hand)+'</td><td>'+({EXPIRED:'Đã hết hạn',SOON:'Sắp hết hạn',VALID:'Còn hạn'})[b.expiry_state]+'</td><td><button data-lot="'+b.id+'">Ngày sản xuất</button></td></tr>'));
 const wh=host.querySelector('#lotWh'),st=host.querySelector('#lotState');wh.value=warehouse;st.value=state;wh.onchange=()=>{warehouse=wh.value;load();};st.onchange=()=>{state=st.value;load();};const em=host.querySelector('#lotEmpty');em.checked=empty;em.onchange=()=>{empty=em.checked;load();};
 host.querySelectorAll('[data-lot]').forEach(b=>b.onclick=()=>{const row=d.items.find(x=>x.id===Number(b.dataset.lot));const {form,close}=openFormDialog('Ghi ngày sản xuất',ui.field('manufacturedDate','Ngày sản xuất',row.manufactured_date,'date'));form.onsubmit=ev=>{ev.preventDefault();ui.submit(form,'lots/'+row.id,'PUT',{manufacturedDate:new FormData(form).get('manufacturedDate')},close,load);};});
 if(d.canManage)host.querySelector('#lotSettings').onclick=()=>{const {form,close}=openFormDialog('Quản lý lô theo sản phẩm',ui.field('product','Sản phẩm','','text',true,d.products.map(p=>[p.id,p.sku+' — '+p.name]))+ui.field('managed','Quản lý theo lô','true','text',true,[['true','Bật'],['false','Tắt']])+ui.field('days','Cảnh báo trước (ngày)',30,'number'));const sel=form.querySelector('[name=product]');function fill(){const p=d.products.find(x=>x.id===Number(sel.value));if(p){form.elements.managed.value=String(p.lot_managed);form.elements.days.value=p.expiry_alert_days;}}sel.onchange=fill;fill();form.onsubmit=ev=>{ev.preventDefault();const f=new FormData(form);ui.submit(form,'lots/products/'+f.get('product'),'PUT',{lotManaged:f.get('managed')==='true',alertDays:Number(f.get('days'))},close,load);};};
 });}return load();
}};
</script>
