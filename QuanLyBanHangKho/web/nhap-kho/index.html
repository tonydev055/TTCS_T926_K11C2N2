<script>
window.sprint5Features=window.sprint5Features||{};
window.receiptUi={
 lines(host,masters,warehouse,getInitial=[]){
  const esc=warehouseUi.esc;host.innerHTML='<div class="wh-lines"></div><button type="button" class="outline-button" data-add>Thêm dòng hàng</button>';
  const list=host.querySelector('.wh-lines');
  function add(initial={}){
   const row=document.createElement('div');row.className='wh-line';
   row.innerHTML='<label>Sản phẩm *<select data-product required><option value="">Chọn sản phẩm</option>'+masters.products.map(p=>'<option value="'+p.id+'">'+esc(p.sku+' · '+p.name)+(p.lot_managed?' · Theo lô':'')+'</option>').join('')+'</select></label><label>Đơn vị *<select data-unit required></select></label><label>Số lượng *<input data-quantity type="number" min="0.000001" step="0.000001" required></label><label>Vị trí *<select data-location required></select></label><label>Số lô<input data-lot maxlength="80"></label><label>Ngày sản xuất<input data-made type="date"></label><label>Hạn sử dụng<input data-expiry type="date"></label><button type="button" data-remove>Xóa dòng</button>';
   list.append(row);row.querySelector('[data-product]').value=initial.product_id||'';
   const units=()=>{const p=masters.products.find(p=>String(p.id)===row.querySelector('[data-product]').value);row.querySelector('[data-unit]').innerHTML=(p?.units||[]).map(u=>'<option value="'+u.id+'">'+esc(u.name)+' ('+u.factor+' '+esc(p.base_unit)+')</option>').join('');row.querySelector('[data-lot]').required=!!p?.lot_managed;row.querySelector('[data-expiry]').required=!!p?.lot_managed;};
   row.querySelector('[data-product]').onchange=units;units();if(initial.unit_id)row.querySelector('[data-unit]').value=initial.unit_id;
   row.querySelector('[data-location]').innerHTML='<option value="">Chọn vị trí</option>'+masters.locations.filter(l=>l.active&&String(l.warehouse_id)===String(warehouse())).map(l=>'<option value="'+l.id+'">'+esc(l.code+' · '+l.name)+'</option>').join('');
   row.querySelector('[data-location]').value=initial.location_id||'';row.querySelector('[data-quantity]').value=initial.quantity||1;row.querySelector('[data-lot]').value=initial.lot_number||'';row.querySelector('[data-expiry]').value=initial.expiry_date||'';row.querySelector('[data-made]').value=initial.manufactured_date||'';row.querySelector('[data-remove]').onclick=()=>row.remove();
  }
  host.querySelector('[data-add]').onclick=()=>add();getInitial.length?getInitial.forEach(add):add();
  return {read:()=>Array.from(list.children).map(r=>({productId:Number(r.querySelector('[data-product]').value),unitId:Number(r.querySelector('[data-unit]').value),quantity:r.querySelector('[data-quantity]').value,locationId:Number(r.querySelector('[data-location]').value),lotNumber:r.querySelector('[data-lot]').value,expiryDate:r.querySelector('[data-expiry]').value,manufacturedDate:r.querySelector('[data-made]').value})),changeWarehouse:()=>list.querySelectorAll('[data-location]').forEach(select=>{select.innerHTML='<option value="">Chọn vị trí</option>'+masters.locations.filter(l=>l.active&&String(l.warehouse_id)===String(warehouse())).map(l=>'<option value="'+l.id+'">'+esc(l.code+' · '+l.name)+'</option>').join('');})};
 }
};
window.sprint5Features['Nhập kho']={path:'nhap-kho',permission:'inventory.write',render:()=>warehouseUi.screen('Phiếu nhập kho','Lưu nháp trước; chỉ xác nhận mới cộng tồn. Phiếu đã xác nhận chỉ được điều chỉnh bằng phiếu mới.',async()=>({rows:await apiRequest('stock-receipts'),masters:await apiRequest('stock-receipts/masters')}),(host,{rows,masters})=>{
 const ui=warehouseUi,esc=ui.esc,reload=()=>sprint5Features['Nhập kho'].render();
 host.innerHTML='<div class="wh-toolbar"><button class="orange-button" id="pnNew">Lập phiếu nhập</button>'+(masters.canManage?'<button class="outline-button" id="pnLot">Cấu hình sản phẩm theo lô</button>':'')+'</div>'+ui.table(['Mã phiếu','Số chứng từ','Nhà cung cấp','Kho','Ngày nhập','Trạng thái','Thao tác'],rows.map(r=>'<tr><td>'+esc(r.code)+(r.direction<0?' · Điều chỉnh giảm':'')+'</td><td>'+esc(r.document_number)+'</td><td>'+esc(r.supplier_name)+'</td><td>'+esc(r.warehouse_name)+'</td><td>'+esc(r.receipt_date)+'</td><td>'+(r.status==='DRAFT'?'Nháp':'Đã xác nhận')+'</td><td><button data-open="'+r.id+'">Chi tiết</button> '+(r.status==='DRAFT'?'<button data-edit="'+r.id+'">Sửa nháp</button>':'<button data-adjust="'+r.id+'">Điều chỉnh</button>')+'</td></tr>'));
 async function edit(id,adjust=false){
  let r=id?await apiRequest('stock-receipts/'+id):{};const fields=ui.field('warehouseId','Kho nhập',r.warehouse_id,'text',true,ui.opts(masters.warehouses.filter(w=>w.active)))+ui.field('supplierId','Nhà cung cấp',r.supplier_id,'text',true,ui.opts(masters.suppliers))+ui.field('documentNumber','Số chứng từ',adjust?'':r.document_number)+ui.field('date','Ngày nhập',new Date().toLocaleDateString('en-CA'),'date')+(adjust?ui.field('direction','Điều chỉnh','','text',true,[['ADD','Tăng tồn'],['REMOVE','Giảm tồn']]):'')+ui.field('note',adjust?'Lý do điều chỉnh':'Ghi chú',adjust?'':r.note,'textarea',adjust)+'<div class="form-group full" id="pnLines"></div>';
  const {form,close}=openFormDialog(adjust?'Lập phiếu điều chỉnh':id?'Sửa phiếu nháp':'Lập phiếu nhập',fields,'Lưu nháp');
  const lines=receiptUi.lines(form.querySelector('#pnLines'),masters,()=>form.querySelector('[name=warehouseId]').value,adjust?[]:r.lines||[]);
  form.querySelector('[name=warehouseId]').onchange=lines.changeWarehouse;
  form.onsubmit=e=>{e.preventDefault();const f=new FormData(form);ui.submit(form,'stock-receipts'+(adjust?'/'+id+'/adjustments':id?'/'+id:''),id&&!adjust?'PUT':'POST',{warehouseId:Number(f.get('warehouseId')),supplierId:Number(f.get('supplierId')),documentNumber:f.get('documentNumber'),date:f.get('date'),note:f.get('note'),direction:f.get('direction'),lines:lines.read()},close,reload);};
 }
 async function detail(id){
  const r=await apiRequest('stock-receipts/'+id),{form,close}=openFormDialog('Phiếu '+r.code,ui.table(['SKU','Sản phẩm','Đơn vị','Số lượng','Quy đổi','Số lô','Ngày SX','Hạn dùng'],r.lines.map(l=>'<tr><td>'+esc(l.sku)+'</td><td>'+esc(l.name)+'</td><td>'+esc(l.unit_name)+'</td><td>'+l.quantity+'</td><td>'+l.base_quantity+'</td><td>'+esc(l.lot_number)+'</td><td>'+esc(l.manufactured_date||'')+'</td><td>'+esc(l.expiry_date)+'</td></tr>')),r.status==='DRAFT'?'Xác nhận nhập kho':null);
  form.onsubmit=e=>{e.preventDefault();if(confirm('Xác nhận phiếu và cập nhật tồn? Phiếu sẽ không sửa trực tiếp được.'))ui.submit(form,'stock-receipts/'+id+'/confirm','POST',{},close,reload);};
 }
 host.querySelector('#pnNew').onclick=()=>edit();host.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>detail(b.dataset.open).catch(e=>showToast(e.message,'error')));host.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit).catch(e=>showToast(e.message,'error')));host.querySelectorAll('[data-adjust]').forEach(b=>b.onclick=()=>edit(b.dataset.adjust,true).catch(e=>showToast(e.message,'error')));
 host.querySelector('#pnLot')?.addEventListener('click',()=>{
  const {form,close}=openFormDialog('Quản lý lô sản phẩm',ui.field('productId','Sản phẩm','','text',true,ui.opts(masters.products))+ui.field('managed','Quản lý theo lô','true','text',true,[['true','Có số lô và hạn sử dụng'],['false','Không quản lý lô']]));
  form.onsubmit=e=>{e.preventDefault();const f=new FormData(form);ui.submit(form,'stock-receipts/products/'+f.get('productId')+'/lot-mode','PUT',{lotManaged:f.get('managed')==='true'},close,reload);};
 });
})};
</script>
