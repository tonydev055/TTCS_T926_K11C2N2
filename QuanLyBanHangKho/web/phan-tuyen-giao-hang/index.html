<style>.trip-print{padding:20px}.trip-order-list{display:flex;flex-direction:column;gap:10px}.trip-order-list label{display:flex;flex-direction:row;align-items:center;gap:10px}@media print{body>*{display:none!important}body>.trip-print{display:block!important}.trip-print table{width:100%;border-collapse:collapse}.trip-print td,.trip-print th{border:1px solid #888;padding:8px}}</style>
<script>
window.sprint5Features['Phân tuyến giao hàng']={path:'phan-tuyen-giao-hang',permission:'inventory.write',render:()=>warehouseUi.screen('Phân tuyến giao hàng','Gộp đơn đã xuất cùng kho và khu vực; thứ tự chọn là thứ tự điểm giao.',()=>apiRequest('delivery-trips'),(host,d,rev)=>{
 const ui=warehouseUi,e=ui.esc,reload=()=>sprint5Features['Phân tuyến giao hàng'].render();host.innerHTML='<div class="wh-toolbar"><button id="tripNew" class="orange-button">Lập chuyến giao</button>'+(d.canManage?'<button id="tripDriver">Thêm tài xế</button><button id="tripVehicle">Thêm xe</button>':'')+'</div>'+ui.table(['Mã chuyến','Kho','Khu vực','Tài xế','Xe','Dự kiến','Trạng thái','Thao tác'],d.items.map(t=>'<tr><td>'+e(t.code)+'</td><td>'+e(t.warehouse)+'</td><td>'+e(t.region)+'</td><td>'+e(t.driver)+'</td><td>'+e(t.vehicle)+'</td><td>'+e(t.expected_at)+'</td><td>'+e(({DRAFT:'Nháp',IN_TRANSIT:'Đang giao',COMPLETED:'Hoàn tất'})[t.status])+'</td><td><button data-trip="'+t.id+'">Điểm giao / In</button>'+(t.status==='DRAFT'?' <button data-start="'+t.id+'">Khởi hành</button>':'')+'</td></tr>'));
 if(d.canManage){host.querySelector('#tripDriver').onclick=()=>resource('driver');host.querySelector('#tripVehicle').onclick=()=>resource('vehicle');}
 function resource(type){const {form,close}=openFormDialog(type==='driver'?'Thêm tài xế':'Thêm xe',type==='driver'?ui.field('name','Họ tên')+ui.field('phone','Số điện thoại'):ui.field('plate','Biển số'));form.onsubmit=ev=>{ev.preventDefault();ui.submit(form,'delivery-trips/resources','POST',{type,...Object.fromEntries(new FormData(form))},close,reload);};}
 host.querySelector('#tripNew').onclick=async()=>{try{const orders=await apiRequest('delivery-trips/orders');if(rev!==viewRevision)return;const selected=[];const {form,close}=openFormDialog('Lập chuyến giao',ui.field('driverId','Tài xế','','text',true,ui.opts(d.drivers))+ui.field('vehicleId','Xe','','text',true,ui.opts(d.vehicles,'plate'))+ui.field('expectedAt','Dự kiến kết thúc','','datetime-local')+'<div class="trip-order-list warehouse-table">'+(orders.length?orders.map(o=>'<label><input type="checkbox" data-order="'+o.id+'">'+e(o.code)+' — '+e(o.region)+' — '+e(o.delivery_address)+'</label>').join(''):'Chưa có đơn đủ điều kiện phân chuyến.')+'</div><p id="tripSequence" class="warehouse-table">Chưa chọn điểm giao.</p>');form.querySelectorAll('[data-order]').forEach(b=>b.onchange=()=>{const id=Number(b.dataset.order);if(b.checked)selected.push(id);else selected.splice(selected.indexOf(id),1);form.querySelector('#tripSequence').textContent='Thứ tự: '+selected.map(id=>orders.find(o=>o.id===id).code).join(' → ');});form.onsubmit=ev=>{ev.preventDefault();const f=new FormData(form);ui.submit(form,'delivery-trips','POST',{driverId:Number(f.get('driverId')),vehicleId:Number(f.get('vehicleId')),expectedAt:f.get('expectedAt'),orderIds:selected},close,reload);};}catch(err){showToast(err.message,'error');}};
 host.querySelectorAll('[data-start]').forEach(b=>b.onclick=async()=>{if(b.disabled)return;b.disabled=true;try{await apiRequest('delivery-trips/'+b.dataset.start+'/start',jsonRequestOptions('POST',{}));if(rev===viewRevision)reload();}catch(err){showToast(err.message,'error');}finally{b.disabled=false;}});
 host.querySelectorAll('[data-trip]').forEach(b=>b.onclick=async()=>{try{const t=await apiRequest('delivery-trips/'+b.dataset.trip);if(rev!==viewRevision)return;const html='<h3>'+e(t.code)+' — '+e(t.driver)+' — '+e(t.vehicle)+'</h3>'+ui.table(['Thứ tự','Đơn','Địa chỉ','Người nhận','Điện thoại'],t.stops.map(s=>'<tr><td>'+s.sequence+'</td><td>'+e(s.order_code)+'</td><td>'+e(s.address)+'</td><td>'+e(s.recipient_name)+'</td><td>'+e(s.phone)+'</td></tr>'));const {form}=openFormDialog('Danh sách điểm giao',html+'<button type="button" id="tripPrint">In danh sách</button>',null);form.querySelector('#tripPrint').onclick=()=>{const print=document.createElement('section');print.className='trip-print';print.innerHTML=html;document.body.appendChild(print);try{window.print();}finally{print.remove();}};}catch(err){showToast(err.message,'error');}});
})};
</script>
