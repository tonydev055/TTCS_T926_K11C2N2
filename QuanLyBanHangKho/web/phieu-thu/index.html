
<style>

.pt-page .pt-field textarea,
.pt-page .pt-toolbar input {

    min-height: 85px;

.pt-page .pt-field select:focus,

    display: inline-flex;

    display: inline-flex;

    justify-content: center;

<script>
window.sprint5Features = window.sprint5Features || {};

window.sprint5Features['Phiếu thu'] = {
    path: 'phieu-thu',
    permission: 'payments.write',

    render: () => warehouseUi.screen(
        'Phiếu thu',
        'Lập phiếu thu và in/lưu PDF từ khoản thu đã ghi nhận.',
        async () => {
            const normalize = x =>
                Array.isArray(x) ? x :
                Array.isArray(x?.items) ? x.items :
                Array.isArray(x?.data) ? x.data :
                Array.isArray(x?.customers) ? x.customers : [];

            const [receiptsResult, customersResult] = await Promise.all([
                apiRequest('cash-receipts'),
                apiRequest('customers?size=100').catch(() => [])
            ]);

            return {
                receipts: normalize(receiptsResult),
                customers: normalize(customersResult)
            };
        },

        (host, data) => {
            const ui = warehouseUi;
            const esc = ui.esc;

            const money = n => new Intl.NumberFormat('vi-VN', {
                style: 'currency',
                currency: 'VND',
                maximumFractionDigits: 2
            }).format(Number(n) || 0);

            const dateText = v => {
                if (!v) return '—';
                const d = new Date(v);
                return Number.isNaN(d.getTime())
                    ? String(v)
                    : d.toLocaleString('vi-VN');
            };

            const code = r =>
                r.receipt_code ||
                ('PT-' + String(r.id || '').padStart(8, '0'));

            const methodLabel = m => ({
                CASH: 'Tiền mặt',
                BANK_TRANSFER: 'Chuyển khoản',
                OTHER: 'Khác'
            }[m] || m || '—');

            const customerOptions = data.customers.map(c => [
                c.id,
                `${c.code ? c.code + ' — ' : ''}${c.name || c.customer_name || ('Khách hàng #' + c.id)}`
            ]);

            host.innerHTML = `
                <div class="pt-page">
                    <section class="pt-hero">
                        <div class="pt-hero-main">
                            <div class="pt-hero-icon">₫</div>
                            <div>
                                <h2>Quản lý phiếu thu</h2>
                                <p>Ghi nhận khoản tiền thực nhận, tra cứu và in chứng từ.</p>
                            </div>
                        </div>
                        <span class="pt-badge">● Sổ thu tiền</span>
                    </section>

                    <section class="pt-stats">
                        <div class="pt-stat">
                            <div class="pt-stat-top">
                                <span>Tổng số phiếu thu</span>
                                <span class="pt-stat-icon">▤</span>
                            </div>
                            <strong class="pt-stat-value" id="ptTotalCount">0</strong>
                            <div class="pt-stat-foot">Số phiếu đã ghi nhận</div>
                        </div>
                        <div class="pt-stat">
                            <div class="pt-stat-top">
                                <span>Tổng tiền đã thu</span>
                                <span class="pt-stat-icon orange">₫</span>
                            </div>
                            <strong class="pt-stat-value" id="ptTotalAmount">0 ₫</strong>
                            <div class="pt-stat-foot">Tổng giá trị các phiếu đã lưu</div>
                        </div>
                        <div class="pt-stat">
                            <div class="pt-stat-top">
                                <span>Khách hàng</span>
                                <span class="pt-stat-icon">♙</span>
                            </div>
                            <strong class="pt-stat-value">${data.customers.length}</strong>
                            <div class="pt-stat-foot">Khách hàng tải được từ hệ thống</div>
                        </div>
                    </section>

                    ${data.customers.length === 0 ? `
                        <div class="pt-warning" style="margin-bottom:20px">
                            <span>⚠</span>
                            <div>
                                <strong>Chưa tải được danh sách khách hàng</strong>
                                Không thể lập phiếu thu khi chưa chọn được khách hàng.
                                Hãy kiểm tra API khách hàng và quyền truy cập.
                            </div>
                        </div>
                    ` : ''}

                    <section class="pt-card">
                        <div class="pt-card-head">
                            <div>
                                <h3 class="pt-card-title">＋ Lập phiếu thu mới</h3>
                                <p class="pt-card-subtitle">Các trường có dấu * là bắt buộc.</p>
                            </div>
                        </div>

                        <div class="pt-card-body">
                            <form id="ptForm" class="pt-form">
                                <div class="pt-field">
                                    <label>Khách hàng <span class="pt-required">*</span></label>
                                    <select name="customer_id" required
                                        ${data.customers.length === 0 ? 'disabled' : ''}>
                                        <option value="">— Chọn khách hàng —</option>
                                        ${customerOptions.map(([id, label]) =>
                                            `<option value="${esc(id)}">${esc(label)}</option>`
                                        ).join('')}
                                    </select>
                                    <span class="pt-hint">Chọn khách hàng nộp tiền.</span>
                                </div>

                                <div class="pt-field">
                                    <label>Đơn hàng liên quan</label>
                                    <input name="order_id" type="number" min="1"
                                        step="1" placeholder="Nhập ID đơn hàng nếu có">
                                    <span class="pt-hint">Có thể để trống nếu không gắn với đơn hàng.</span>
                                </div>

                                <div class="pt-field">
                                    <label>Số tiền thực thu (VND) <span class="pt-required">*</span></label>
                                    <input name="amount" type="number" min="0.01"
                                        step="0.01" required placeholder="Ví dụ: 1500000">
                                    <span class="pt-hint">Nhập số tiền thực tế đã nhận.</span>
                                </div>

                                <div class="pt-field">
                                    <label>Hình thức thu <span class="pt-required">*</span></label>
                                    <select name="payment_method" required>
                                        <option value="CASH">Tiền mặt</option>
                                        <option value="BANK_TRANSFER">Chuyển khoản</option>
                                        <option value="OTHER">Khác</option>
                                    </select>
                                </div>

                                <div class="pt-field">
                                    <label>Mã tham chiếu</label>
                                    <input name="reference_code" maxlength="120"
                                        placeholder="Mã giao dịch ngân hàng (nếu có)">
                                </div>

                                <div class="pt-field">
                                    <label>Người thu và thời gian</label>
                                    <div style="padding:12px;border:1px solid #e5e7eb;border-radius:9px;background:#f8fafc;font-size:12px;color:#64748b;line-height:1.6">
                                        Hệ thống tự ghi nhận người thu và thời điểm lưu phiếu.
                                    </div>
                                </div>

                                <div class="pt-field wide">
                                    <label>Ghi chú</label>
                                    <textarea name="note" maxlength="2000"
                                        placeholder="Nội dung thu tiền, lý do thu hoặc thông tin bổ sung..."></textarea>
                                </div>

                                <div class="pt-field wide">
                                    <div class="pt-form-footer">
                                        <span class="pt-hint">Vui lòng kiểm tra thông tin trước khi lưu.</span>
                                        <div class="pt-actions">
                                            <button id="ptReset" class="pt-btn pt-btn-secondary" type="reset">
                                                Làm mới biểu mẫu
                                            </button>
                                            <button id="ptSave" class="pt-btn pt-btn-primary"
                                                type="submit" ${data.customers.length === 0 ? 'disabled' : ''}>
                                                <span>＋</span> Lưu phiếu thu
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </section>

                    <section class="pt-card">
                        <div class="pt-card-head">
                            <div>
                                <h3 class="pt-card-title">Danh sách phiếu thu</h3>
                                <p class="pt-card-subtitle">Tra cứu các khoản thu đã ghi nhận trong hệ thống.</p>
                            </div>
                            <span class="pt-count" id="ptListCount">0 phiếu</span>
                        </div>

                        <div class="pt-toolbar">
                            <div>
                                <strong style="font-size:13px">Lịch sử thu tiền</strong>
                                <div class="pt-card-subtitle">Tìm theo mã phiếu hoặc khách hàng.</div>
                            </div>
                            <div class="pt-search">
                                <span class="pt-search-icon">⌕</span>
                                <input id="ptSearch" type="search"
                                    placeholder="Tìm mã phiếu, khách hàng..."
                                    aria-label="Tìm phiếu thu">
                            </div>
                        </div>

                        <div id="ptTable" class="pt-table-wrap"></div>
                    </section>
                </div>
            `;

            const renderStats = () => {
                const total = data.receipts.reduce(
                    (sum, r) => sum + (Number(r.amount) || 0), 0
                );
                host.querySelector('#ptTotalCount').textContent =
                    data.receipts.length.toLocaleString('vi-VN');
                host.querySelector('#ptTotalAmount').textContent = money(total);
            };

            const renderRows = () => {
                const q = host.querySelector('#ptSearch').value
                    .trim().toLocaleLowerCase('vi');

                const rows = [...data.receipts].filter(r =>
                    (code(r) + ' ' + (r.customer_name || '') + ' ' +
                     (r.customer_code || '')).toLocaleLowerCase('vi').includes(q)
                );

                host.querySelector('#ptListCount').textContent =
                    `${rows.length} phiếu`;

                host.querySelector('#ptTable').innerHTML = rows.length
                    ? `<table class="pt-table">
                        <thead>
                            <tr>
                                <th>Mã phiếu</th>
                                <th>Khách hàng</th>
                                <th>Đơn hàng</th>
                                <th style="text-align:right">Số tiền</th>
                                <th>Hình thức</th>
                                <th>Ngày thu</th>
                                <th>Người thu</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows.map(r => `
                                <tr>
                                    <td><span class="pt-receipt-code">${esc(code(r))}</span></td>
                                    <td>
                                        <div class="pt-customer-name">${esc(r.customer_name || '—')}</div>
                                        ${r.customer_code ? `<span class="pt-secondary-text">${esc(r.customer_code)}</span>` : ''}
                                    </td>
                                    <td>${esc(r.order_code || '—')}</td>
                                    <td class="pt-amount">${esc(money(r.amount))}</td>
                                    <td><span class="pt-method">${esc(methodLabel(r.payment_method))}</span></td>
                                    <td>${esc(dateText(r.created_at))}</td>
                                    <td>${esc(r.collector_name || '—')}</td>
                                    <td>
                                        <button type="button" class="pt-print-btn"
                                            data-print="${esc(r.id)}">▣ In / PDF</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>`
                    : `<div class="pt-empty">
                        <div class="pt-empty-icon">▤</div>
                        <strong>${q ? 'Không tìm thấy phiếu thu' : 'Chưa có phiếu thu nào'}</strong>
                        <p>${q
                            ? 'Thử tìm kiếm bằng mã phiếu hoặc tên khách hàng khác.'
                            : 'Các phiếu thu đã lưu sẽ xuất hiện tại đây. Sau khi ghi nhận khoản thu, m có thể in hoặc lưu thành PDF.'}
                        </p>
                    </div>`;

                host.querySelectorAll('[data-print]').forEach(btn => {
                    btn.onclick = () => {
                        const r = data.receipts.find(
                            x => String(x.id) === btn.dataset.print
                        );
                        if (r) printReceipt(r);
                    };
                });
            };

            function printReceipt(r) {
                const w = window.open('', '_blank', 'width=900,height=700');

                if (!w) {
                    showToast(
                        'Trình duyệt đã chặn cửa sổ in. Hãy cho phép cửa sổ bật lên rồi thử lại.',
                        'error'
                    );
                    return;
                }

                const safe = s => String(s ?? '—').replace(/[&<>"']/g, ch => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;',
                    '"': '&quot;', "'": '&#39;'
                }[ch]));

                const fields = [
                    ['Khách hàng', (r.customer_code ? r.customer_code + ' — ' : '') + (r.customer_name || '—')],
                    ['Đơn hàng liên quan', r.order_code || 'Không gắn đơn hàng'],
                    ['Hình thức thu', methodLabel(r.payment_method)],
                    ['Người thu', r.collector_name || '—'],
                    ['Ngày ghi nhận', dateText(r.created_at)],
                    ['Mã tham chiếu', r.reference_code || '—']
                ].map(([k, v]) =>
                    `<div class="field"><label>${safe(k)}</label><strong>${safe(v)}</strong></div>`
                ).join('');

                w.document.write(`<!doctype html>
                    <html lang="vi">
                    <head>
                        <meta charset="utf-8">
                        <title>Phiếu thu ${safe(code(r))}</title>
                        <style>
                            body{font:15px Arial,sans-serif;color:#111;margin:0;padding:36px}
                            .receipt{max-width:760px;margin:auto;border:1px solid #bbb;padding:34px}
                            .top{text-align:center}
                            .top h1{font-size:26px;margin:0 0 8px}
                            .amount{font-size:24px;font-weight:bold;text-align:center;margin:28px 0;padding:16px;border:1px dashed #888}
                            .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px;margin-top:24px}
                            .field label{display:block;font-size:12px;color:#666;margin-bottom:5px}
                            .note{margin-top:24px;white-space:pre-wrap}
                            .sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;text-align:center;margin-top:55px}
                            .sign div{min-height:85px}
                            .muted{font-size:12px;color:#666;margin-top:8px}
                            @media print{body{padding:0}.receipt{border:0;padding:20px;max-width:none}.no-print{display:none}}
                        </style>
                    </head>
                    <body>
                        <main class="receipt">
                            <header class="top">
                                <h1>PHIẾU THU</h1>
                                <p>Ngày ghi nhận: ${safe(dateText(r.created_at))}</p>
                                <p>Mã phiếu: <strong>${safe(code(r))}</strong></p>
                            </header>
                            <div class="amount">${safe(money(r.amount))}</div>
                            <section class="grid">${fields}</section>
                            <div class="note"><strong>Ghi chú</strong><p>${safe(r.note || 'Không có')}</p></div>
                            <section class="sign">
                                <div><strong>Người nộp tiền</strong><p class="muted">(Ký, ghi rõ họ tên)</p></div>
                                <div><strong>Người thu tiền</strong><p class="muted">(Ký, ghi rõ họ tên)</p></div>
                            </section>
                            <p class="muted">Phiếu được in từ dữ liệu đã lưu trong hệ thống KhoFlow.</p>
                            <button class="no-print" onclick="window.print()">In / Lưu PDF</button>
                        </main>
                        <script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script>
                    </body>
                    </html>`);

                w.document.close();
            }

            host.querySelector('#ptSearch').addEventListener('input', renderRows);
            renderStats();
            renderRows();

            host.querySelector('#ptForm').addEventListener('submit', async event => {
                event.preventDefault();

                const form = event.currentTarget;
                const button = host.querySelector('#ptSave');

                if (!form.reportValidity()) return;

                const fd = new FormData(form);
                const payload = {
                    customer_id: fd.get('customer_id'),
                    order_id: fd.get('order_id') || null,
                    amount: fd.get('amount'),
                    payment_method: fd.get('payment_method'),
                    reference_code: fd.get('reference_code'),
                    note: fd.get('note')
                };

                button.disabled = true;
                button.textContent = 'Đang lưu…';

                try {
                    const saved = await apiRequest(
                        'cash-receipts',
                        jsonRequestOptions('POST', payload)
                    );

                    showToast(
                        'Đã lưu phiếu thu ' + (saved.receipt_code || ''),
                        'success'
                    );

                    sprint5Features['Phiếu thu'].render();
                } catch (error) {
                    showRequestError(error);
                } finally {
                    if (button.isConnected) {
                        button.disabled = false;
                        button.innerHTML = '<span>＋</span> Lưu phiếu thu';
                    }
                }
            });
        }
    )
};
</script>
