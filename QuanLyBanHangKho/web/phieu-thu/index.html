<script>
window.sprint5Features=window.sprint5Features||{};
window.sprint5Features['Phiếu thu']={path:'phieu-thu',permission:'payments.write',render(){
 const ui=financeUi,e=ui.e,m=ui.m;
 ui.screen('Phiếu thu','In hoặc lưu PDF từ khoản thu đã ghi nhận và đối trừ. Phiếu hoàn tác vẫn được giữ để đối soát.','cash-receipts',(data,body,revision)=>{
  body.innerHTML='<div class="finance-toolbar"><input id="receiptSearch" aria-label="Tìm phiếu thu" placeholder="Tìm mã phiếu, đại lý"><button id="receiptNew" class="primary">Ghi nhận khoản thu</button></div><div id="receiptRows"></div>';
  function rows(){const q=body.querySelector('#receiptSearch').value.toLowerCase();body.querySelector('#receiptRows').innerHTML=ui.table(['Mã phiếu','Đại lý','Ngày thu','Số tiền','Người thu','Trạng thái','Thao tác'],data.filter(p=>(p.receipt_code+' '+p.customer_code+' '+p.customer_name).toLowerCase().includes(q)).map(p=>[e(p.receipt_code),e(p.customer_name),e(p.received_date),m(p.amount),e(p.collector_name),p.reversed?'Đã hoàn tác':'Đã thu','<button data-print="'+p.id+'">Xem / In / Lưu PDF</button>']));}rows();body.querySelector('#receiptSearch').oninput=rows;body.querySelector('#receiptNew').onclick=()=>openView('Thanh toán và đối trừ');
  body.onclick=async event=>{const button=event.target.closest('[data-print]');if(!button)return;button.disabled=true;try{const p=await apiRequest('cash-receipts/'+button.dataset.print);if(revision!==viewRevision)return;const html='<p><strong>Mã phiếu: '+e(p.receipt_code)+'</strong></p>'+(p.reversed?'<p><strong>ĐÃ HOÀN TÁC — KHÔNG CÒN GIÁ TRỊ THU TIỀN</strong></p><p>Lý do: '+e(p.reversal_reason)+'</p>':'')+'<p>Ngày thu: '+e(p.received_date)+'</p><p>Đại lý: '+e(p.customer_code+' · '+p.customer_name)+'</p><p>Khu vực: '+e(p.region)+' · Điện thoại: '+e(p.phone)+'</p><p>Số tiền: <strong>'+m(p.amount)+'</strong></p><p>Hình thức: '+e(({CASH:'Tiền mặt',BANK_TRANSFER:'Chuyển khoản',OTHER:'Khác'})[p.payment_method])+'</p><p>Người thu: '+e(p.collector_name)+'</p><p>Ghi chú: '+e(p.note)+'</p>'+ui.table(['Hóa đơn đối trừ','Số tiền'],p.allocations.map(a=>[e(a.invoice_number),m(a.amount)]))+'<p>Người nộp tiền ____________________ Người thu ____________________</p>';const dialog=ui.dialog('Phiếu thu '+p.receipt_code,html+'<button type="button" id="receiptPrint">In / Lưu PDF</button>',null);dialog.form.querySelector('#receiptPrint').onclick=()=>ui.print('PHIẾU THU',html);}catch(error){showRequestError(error);}finally{button.disabled=false;}};
 });
}};
</script>
