<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCRUM-51 - Quan ly Bang gia</title>
  <meta name="description" content="Khai bao bang gia theo nhom khach hang va thoi gian hieu luc - SCRUM-51" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #f5f2ed;
      --bg-card: #ffffff;
      --bg-surface: #f8fafc;
      --bg-hover: #f1f5f9;
      --border: #e2e8f0;
      --border-focus: #f26522;
      --accent: #f26522;
      --accent-glow: rgba(242, 101, 34, 0.25);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.2);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.15);
      --warn: #f59e0b;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --shadow-card: 0 10px 30px -5px rgba(0,0,0,.08), 0 4px 12px -2px rgba(0,0,0,.04);
      --shadow-btn: 0 4px 16px rgba(242, 101, 34, 0.35);
      --transition: .22s cubic-bezier(.4, 0, .2, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
    body {
      font-family: 'Be Vietnam Pro', Arial, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 24px;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(242,101,34,.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 90% 80%, rgba(242,101,34,.05) 0%, transparent 60%);
    }
    .page-wrap { width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 24px; padding-bottom: 60px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); overflow: hidden; }
    .card-header {
      padding: 28px 32px 20px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(242,101,34,.05) 0%, transparent 60%);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .ticket-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(242,101,34,.1); border: 1px solid rgba(242,101,34,.25);
      color: var(--accent); font-size: 11px; font-weight: 600; letter-spacing: .08em;
      text-transform: uppercase; padding: 4px 10px; border-radius: var(--radius-full); margin-bottom: 12px;
    }
    .ticket-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .card-header h1 { font-size: 22px; font-weight: 700; line-height: 1.3 }
    .card-header p  { margin-top: 4px; font-size: 13px; color: var(--text-secondary) }
    .card-body { padding: 28px 32px; display: flex; flex-direction: column; gap: 24px }
    .section-label {
      font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
      color: var(--text-muted); margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border) }
    .form-row { display: flex; gap: 14px; flex-wrap: wrap }
    .form-group { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 6px }
    label { font-size: 13px; font-weight: 500; color: var(--text-primary) }
    .req { color: var(--danger) }
    .form-control {
      padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 14px; font-family: inherit; color: var(--text-primary);
      background: var(--bg-surface); transition: all var(--transition); outline: none;
    }
    .form-control:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--accent-glow); background: #fff }
    .form-control:disabled { opacity: .55; cursor: not-allowed; background: var(--bg-hover) }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 10px 20px; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 600; font-family: inherit;
      cursor: pointer; border: none; transition: all var(--transition); white-space: nowrap;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed }
    .btn svg { width: 15px; height: 15px; flex-shrink: 0 }
    .btn-primary { background: linear-gradient(135deg, var(--accent) 0%, #e05310 100%); color: #fff; box-shadow: var(--shadow-btn); }
    .btn-primary:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 6px 22px var(--accent-glow) }
    .btn-primary:not(:disabled):active { transform: translateY(0) }
    .btn-secondary { background: var(--bg-surface); color: var(--text-secondary); border: 1px solid var(--border); }
    .btn-secondary:not(:disabled):hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-focus) }
    .btn-sm { padding: 7px 14px; font-size: 12px }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap }
    .pl-grid { display: grid; grid-template-columns: 280px 1fr; gap: 24px; align-items: start }
    @media(max-width: 720px) { .pl-grid { grid-template-columns: 1fr } }
    .pl-sidebar { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden }
    .pl-sidebar-hdr {
      padding: 12px 16px; background: var(--bg-surface); border-bottom: 1px solid var(--border);
      font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center;
    }
    .pl-item {
      padding: 13px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
      transition: background var(--transition); display: flex; flex-direction: column; gap: 4px;
    }
    .pl-item:last-child { border-bottom: none }
    .pl-item:hover { background: var(--bg-hover) }
    .pl-item.active { background: rgba(242,101,34,.06); border-left: 3px solid var(--accent) }
    .pl-item-name { font-size: 13.5px; font-weight: 600 }
    .pl-item-meta { font-size: 11.5px; color: var(--text-secondary) }
    .status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: var(--radius-full); font-size: 11px; font-weight: 600;
    }
    .status-badge::before { content: ''; width: 5px; height: 5px; border-radius: 50% }
    .status-badge.active  { background: rgba(16,185,129,.1); color: #059669; border: 1px solid rgba(16,185,129,.25) }
    .status-badge.active::before  { background: var(--success); box-shadow: 0 0 5px var(--success) }
    .status-badge.locked  { background: rgba(100,116,139,.1); color: var(--text-secondary); border: 1px solid rgba(100,116,139,.2) }
    .status-badge.locked::before  { background: var(--text-secondary) }
    .status-badge.draft   { background: rgba(245,158,11,.1); color: #d97706; border: 1px solid rgba(245,158,11,.25) }
    .status-badge.draft::before   { background: var(--warn); box-shadow: 0 0 5px var(--warn) }
    .pl-detail { display: flex; flex-direction: column; gap: 18px }
    .detail-banner {
      padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px;
      display: flex; align-items: center; gap: 10px;
    }
    .detail-banner.locked { background: rgba(100,116,139,.07); border: 1px solid rgba(100,116,139,.2); color: var(--text-secondary) }
    .detail-banner.active { background: rgba(16,185,129,.07); border: 1px solid rgba(16,185,129,.2); color: #059669 }
    .detail-banner.draft  { background: rgba(245,158,11,.07); border: 1px solid rgba(245,158,11,.2); color: #d97706 }
    .detail-banner svg { width: 16px; height: 16px; flex-shrink: 0 }
    .pt-wrap { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden }
    table.ptable { width: 100%; border-collapse: collapse; font-size: 13px }
    table.ptable th {
      padding: 11px 14px; text-align: left;
      background: var(--bg-surface); font-weight: 600; color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
    }
    table.ptable td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle }
    table.ptable tr:last-child td { border-bottom: none }
    table.ptable tr:hover td { background: var(--bg-hover) }
    .price-inp {
      width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 13px; font-family: inherit; background: var(--bg-surface); color: var(--text-primary);
      transition: all var(--transition); outline: none;
    }
    .price-inp:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--accent-glow); background: #fff }
    .price-inp:disabled { opacity: .55; cursor: not-allowed; background: var(--bg-hover) }
    .price-inp.below { border-color: var(--danger); background: rgba(239,68,68,.04); box-shadow: 0 0 0 3px var(--danger-glow) }
    .flag-below {
      display: inline-flex; align-items: center; gap: 4px; margin-top: 4px;
      background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25);
      color: var(--danger); font-size: 10.5px; font-weight: 600;
      padding: 2px 7px; border-radius: var(--radius-full);
    }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,.45); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; z-index: 900; padding: 24px;
      opacity: 0; pointer-events: none; transition: opacity .25s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto }
    .modal {
      background: var(--bg-card); border-radius: var(--radius-lg);
      box-shadow: 0 24px 64px rgba(0,0,0,.18);
      width: 100%; max-width: 520px;
      transform: translateY(20px) scale(.97);
      transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .25s ease;
      opacity: 0;
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); opacity: 1 }
    .modal-hdr {
      padding: 22px 26px 16px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    }
    .modal-hdr h2 { font-size: 17px; font-weight: 700 }
    .modal-hdr p  { margin-top: 3px; font-size: 12.5px; color: var(--text-secondary) }
    .modal-close { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; border-radius: 4px; display: flex }
    .modal-close:hover { color: var(--text-primary); background: var(--bg-hover) }
    .modal-body { padding: 22px 26px; display: flex; flex-direction: column; gap: 14px }
    .modal-foot { padding: 16px 26px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px }
    .toast {
      position: fixed; bottom: 28px; right: 28px;
      background: var(--bg-card); border: 1px solid rgba(16,185,129,.4);
      border-radius: var(--radius-md); padding: 14px 18px;
      display: flex; align-items: center; gap: 10px; font-size: 13px;
      box-shadow: 0 10px 25px rgba(0,0,0,.12);
      transform: translateY(80px); opacity: 0;
      pointer-events: none; transition: all .35s cubic-bezier(.34,1.56,.64,1); z-index: 999;
    }
    .toast.show { transform: translateY(0); opacity: 1; pointer-events: auto }
    .toast-icon { color: var(--success); display: flex }
    .toast-icon svg { width: 18px; height: 18px }
    .toast strong { color: var(--success) }
    .toast.warn { border-color: rgba(245,158,11,.4) }
    .toast.warn .toast-icon { color: var(--warn) }
    .toast.warn strong { color: #d97706 }
    .version-list { display: flex; flex-direction: column; gap: 8px }
    .version-item {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg-surface); font-size: 13px;
    }
    .ver-left { display: flex; align-items: center; gap: 10px }
    .ver-num { font-weight: 700; color: var(--accent) }
    .empty-state {
      padding: 48px 24px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .empty-ico {
      width: 56px; height: 56px; border-radius: var(--radius-md);
      background: rgba(242,101,34,.08); border: 1px solid rgba(242,101,34,.2);
      display: flex; align-items: center; justify-content: center; color: var(--accent);
    }
    .empty-ico svg { width: 26px; height: 26px }
    .empty-state h3 { font-size: 15px; font-weight: 600 }
    .empty-state p  { font-size: 13px; color: var(--text-secondary); max-width: 280px }
    @media(max-width:520px) {
      .card-header,.card-body { padding: 20px 18px }
      .modal-hdr,.modal-body,.modal-foot { padding-left: 18px; padding-right: 18px }
    }
  </style>
</head>
<body>
<div class="page-wrap">

  <div class="card">
    <div class="card-header">
      <div>
        <div class="ticket-badge">SCRUM-51</div>
        <h1>Quan ly Bang gia</h1>
        <p>Khai bao bang gia theo nhom khach hang va thoi gian hieu luc. Tu dong ap dung dung gia theo cap dai ly.</p>
      </div>
      <button class="btn btn-primary" id="btnCreate">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
        Tao bang gia moi
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="pl-grid">
        <div>
          <div class="section-label">Danh sach bang gia</div>
          <div class="pl-sidebar" id="plSidebar"></div>
        </div>
        <div id="plDetail"></div>
      </div>
    </div>
  </div>

  <div class="card" id="versionCard" style="display:none">
    <div class="card-body">
      <div class="section-label">Lich su phien ban</div>
      <div class="version-list" id="versionList"></div>
    </div>
  </div>

</div>

<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-hdr">
      <div>
        <h2 id="modalTitle">Tao bang gia moi</h2>
        <p id="modalSub">Dien day du thong tin.</p>
      </div>
      <button class="modal-close" id="modalClose" aria-label="Dong">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Ten bang gia <span class="req">*</span></label>
        <input class="form-control" id="mName" type="text" placeholder="VD: Bang gia Dai ly cap 1 - Q4/2026" />
      </div>
      <div class="form-group">
        <label>Nhom khach hang <span class="req">*</span></label>
        <select class="form-control" id="mGroup">
          <option value="">-- Chon nhom --</option>
          <option value="Dai ly cap 1">Dai ly cap 1</option>
          <option value="Dai ly cap 2">Dai ly cap 2</option>
          <option value="Khach le">Khach le</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Ngay bat dau <span class="req">*</span></label>
          <input class="form-control" id="mFrom" type="date" />
        </div>
        <div class="form-group">
          <label>Ngay ket thuc <span class="req">*</span></label>
          <input class="form-control" id="mTo" type="date" />
        </div>
      </div>
      <div class="form-group">
        <label>Ghi chu</label>
        <input class="form-control" id="mNote" type="text" placeholder="Ghi chu noi bo (tuy chon)" />
      </div>
      <div id="mErr" style="display:none;color:var(--danger);font-size:13px;padding:8px 12px;background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);border-radius:var(--radius-sm)"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" id="modalCancel">Huy</button>
      <button class="btn btn-primary" id="modalSubmit">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
        Luu bang gia
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <div class="toast-icon">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
  </div>
  <div><strong id="toastTitle">Thanh cong!</strong><br/><span id="toastMsg"></span></div>
</div>

<script>
const PRODUCTS = [
  { id:'P001', name:'Nuoc tang luc Redbull 250ml', sku:'RB-250' },
  { id:'P002', name:'Nuoc ngot Coca-Cola 330ml',   sku:'CC-330' },
  { id:'P003', name:'Bia Tiger Can 330ml',          sku:'TG-330' },
  { id:'P004', name:'Nuoc suoi Lavie 1.5L',         sku:'LV-1500' },
  { id:'P005', name:'Nuoc ep Tropicana 1L',         sku:'TP-1000' },
];

let priceLists = [
  {
    id:'PL-001', version:1, name:'Bang gia Dai ly cap 1 - Q3/2026',
    group:'Dai ly cap 1', dateFrom:'2026-07-01', dateTo:'2026-09-30',
    status:'locked', note:'Da co don hang phat sinh', parentId:null,
    rows:[
      {pid:'P001',price:12000,floor:10000},{pid:'P002',price:11000,floor:9500},
      {pid:'P003',price:14000,floor:12000},{pid:'P004',price:8500,floor:7000},
      {pid:'P005',price:22000,floor:19000}
    ]
  },
  {
    id:'PL-002', version:1, name:'Bang gia Dai ly cap 2 - Q3/2026',
    group:'Dai ly cap 2', dateFrom:'2026-07-01', dateTo:'2026-09-30',
    status:'active', note:'', parentId:null,
    rows:[
      {pid:'P001',price:13000,floor:10000},{pid:'P002',price:12000,floor:9500},
      {pid:'P003',price:15500,floor:12000},{pid:'P004',price:9500,floor:7000},
      {pid:'P005',price:24000,floor:19000}
    ]
  },
  {
    id:'PL-003', version:1, name:'Bang gia Khach le - Q3/2026',
    group:'Khach le', dateFrom:'2026-07-01', dateTo:'2026-09-30',
    status:'draft', note:'Dang cho duyet', parentId:null,
    rows:[
      {pid:'P001',price:15000,floor:10000},{pid:'P002',price:14000,floor:9500},
      {pid:'P003',price:18000,floor:12000},{pid:'P004',price:11000,floor:7000},
      {pid:'P005',price:27000,floor:19000}
    ]
  }
];

let selectedId = 'PL-001';
let modalMode = 'create';
let cloneSourceId = null;
let toastTimer = null;

function fmt(n) { return Number(n).toLocaleString('vi-VN') + 'd' }
function uid() { return 'PL-' + Date.now().toString(36).toUpperCase() }
function getList(id) { return priceLists.find(l => l.id === id) }
function getProd(id) { return PRODUCTS.find(p => p.id === id) }
function fmtDate(d) { if(!d) return '-'; const [y,m,day]=d.split('-'); return day+'/'+m+'/'+y }
function statusLabel(s) { return {active:'Dang hieu luc',locked:'Da khoa',draft:'Ban nhap'}[s]||s }

function showToast(title, msg, warn=false) {
  const t=document.getElementById('toast');
  document.getElementById('toastTitle').textContent=title;
  document.getElementById('toastMsg').textContent=msg;
  t.classList.toggle('warn',warn);
  t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),4200);
}

function getRootId(pl) {
  if(!pl.parentId) return pl.id;
  const p=getList(pl.parentId);
  return p?getRootId(p):pl.id;
}

function renderSidebar() {
  const el=document.getElementById('plSidebar');
  if(!priceLists.length) {
    el.innerHTML='<div class="empty-state"><div class="empty-ico"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 14.25l6-6m4.5-3.493V21.75l-3.75-1.5-3.75 1.5-3.75-1.5-3.75 1.5V4.757c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0c1.1.128 1.907 1.077 1.907 2.185z"/></svg></div><h3>Chua co bang gia</h3><p>Nhan "Tao bang gia moi" de bat dau.</p></div>';
    return;
  }
  el.innerHTML=priceLists.map(pl=>`
    <div class="pl-item${pl.id===selectedId?' active':''}" data-id="${pl.id}" role="button" tabindex="0">
      <div class="pl-item-name">${pl.name}</div>
      <div class="pl-item-meta" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        ${pl.group} &middot; v${pl.version}
        <span class="status-badge ${pl.status}">${statusLabel(pl.status)}</span>
      </div>
      <div class="pl-item-meta">${fmtDate(pl.dateFrom)} - ${fmtDate(pl.dateTo)}</div>
    </div>
  `).join('');
  el.querySelectorAll('.pl-item').forEach(i=>{
    i.addEventListener('click',()=>{ selectedId=i.dataset.id; render() });
    i.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ selectedId=i.dataset.id; render() } });
  });
}

function renderDetail() {
  const panel=document.getElementById('plDetail');
  if(!selectedId) {
    panel.innerHTML='<div class="empty-state" style="padding:60px 24px"><div class="empty-ico"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.042 21.672L13.684 16.6m0 0l-2.51 2.225.569-9.47 5.227 7.917-3.286-.672zm-7.518-.267A8.25 8.25 0 1120.25 10.5M8.288 14.212A5.25 5.25 0 1117.25 10.5"/></svg></div><h3>Chon bang gia</h3><p>Chon mot bang gia o cot trai de xem chi tiet.</p></div>';
    return;
  }
  const pl=getList(selectedId);
  if(!pl) return;
  const locked=pl.status==='locked';
  const lockMsg=locked?'Bang gia nay da phat sinh don hang va bi khoa. Khong the chinh sua truc tiep. Hay tao phien ban moi.'
    :(pl.status==='active'?'Bang gia dang hieu luc. Ban co the chinh sua gia ban va gia san.'
    :'Ban nhap - chua co don hang phat sinh. Co the chinh sua tu do.');

  const lockIconPath=locked
    ?'<path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>'
    :'<path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"/>';

  const rows=pl.rows.map(r=>{
    const prod=getProd(r.pid);
    const below=r.price<r.floor;
    return `<tr>
      <td><div style="font-weight:500">${prod?prod.name:r.pid}</div><div style="font-size:11px;color:var(--text-muted)">${prod?prod.sku:''}</div></td>
      <td>
        <input class="price-inp${below?' below':''}" type="number" min="0"
          data-plid="${pl.id}" data-pid="${r.pid}" data-field="price"
          value="${r.price}" ${locked?'disabled':''} />
        ${below?'<div class="flag-below">Duoi gia san</div>':''}
      </td>
      <td>
        <input class="price-inp" type="number" min="0"
          data-plid="${pl.id}" data-pid="${r.pid}" data-field="floor"
          value="${r.floor}" ${locked?'disabled':''} />
      </td>
      <td style="font-size:12px;color:var(--text-muted)">${fmt(r.floor)}</td>
    </tr>`;
  }).join('');

  const cloneBtn=locked?`<button class="btn btn-primary btn-sm" id="btnClone">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75"/></svg>
    Tao phien ban moi
  </button>`
  :`<button class="btn btn-primary btn-sm" id="btnSave">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
    Luu thay doi
  </button>`;

  panel.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <div>
        <div style="font-size:17px;font-weight:700;margin-bottom:6px">${pl.name}</div>
        <div style="font-size:13px;color:var(--text-secondary);display:flex;gap:12px;flex-wrap:wrap;align-items:center">
          <span>Nhom: <strong>${pl.group}</strong></span>
          <span>Hieu luc: <strong>${fmtDate(pl.dateFrom)} - ${fmtDate(pl.dateTo)}</strong></span>
          <span>v${pl.version}</span>
          <span class="status-badge ${pl.status}">${statusLabel(pl.status)}</span>
        </div>
        ${pl.note?`<div style="margin-top:5px;font-size:12px;color:var(--text-muted)">${pl.note}</div>`:''}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${cloneBtn}</div>
    </div>

    <div class="detail-banner ${pl.status}">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">${lockIconPath}</svg>
      <span>${lockMsg}</span>
    </div>

    <div class="section-label">Danh sach gia san pham</div>
    <div class="pt-wrap">
      <table class="ptable">
        <thead><tr>
          <th style="width:36%">San pham</th>
          <th>Gia ban (d)</th>
          <th>Gia san (d)</th>
          <th>Gia san hien thi</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;

  if(locked) {
    document.getElementById('btnClone')?.addEventListener('click',openCloneModal);
  } else {
    document.querySelectorAll('.price-inp').forEach(i=>i.addEventListener('input',onPriceInput));
    document.getElementById('btnSave')?.addEventListener('click',saveRows);
  }
}

function renderVersionCard() {
  const vc=document.getElementById('versionCard');
  if(!selectedId){vc.style.display='none';return}
  const pl=getList(selectedId);
  if(!pl){vc.style.display='none';return}
  const rootId=getRootId(pl);
  const family=priceLists.filter(l=>getRootId(l)===rootId).sort((a,b)=>a.version-b.version);
  if(family.length<=1&&pl.version===1){vc.style.display='none';return}
  vc.style.display='block';
  document.getElementById('versionList').innerHTML=family.map(l=>`
    <div class="version-item">
      <div class="ver-left">
        <span class="ver-num">v${l.version}</span>
        <span>${l.name}</span>
        <span class="status-badge ${l.status}">${statusLabel(l.status)}</span>
      </div>
      <span style="font-size:12px;color:var(--text-muted)">${fmtDate(l.dateFrom)} - ${fmtDate(l.dateTo)}</span>
    </div>
  `).join('');
}

function onPriceInput(e) {
  const inp=e.target;
  const plId=inp.dataset.plid, pid=inp.dataset.pid, field=inp.dataset.field;
  const val=parseFloat(inp.value)||0;
  const pl=getList(plId); if(!pl) return;
  const row=pl.rows.find(r=>r.pid===pid); if(!row) return;
  row[field]=val;
  const priceInp=document.querySelector(`.price-inp[data-plid="${plId}"][data-pid="${pid}"][data-field="price"]`);
  if(!priceInp) return;
  const below=row.price<row.floor;
  priceInp.classList.toggle('below',below);
  const td=priceInp.closest('td');
  let flag=td.querySelector('.flag-below');
  if(below&&!flag){
    flag=document.createElement('div');
    flag.className='flag-below';
    flag.textContent='Duoi gia san';
    td.appendChild(flag);
  } else if(!below&&flag) flag.remove();
  const floorInp=document.querySelector(`.price-inp[data-plid="${plId}"][data-pid="${pid}"][data-field="floor"]`);
  if(floorInp){
    const dispTd=floorInp.closest('tr').querySelector('td:last-child');
    if(dispTd) dispTd.textContent=fmt(row.floor);
  }
}

function saveRows() {
  const pl=getList(selectedId); if(!pl) return;
  const hasBelowFloor=pl.rows.some(r=>r.price<r.floor);
  if(hasBelowFloor) {
    showToast('Canh bao gia san','Mot hoac nhieu san pham co gia ban thap hon gia san. Da gan co can duyet.',true);
  } else {
    showToast('Luu thanh cong!',`Bang gia "${pl.name}" da duoc cap nhat.`);
  }
}

function openCreateModal() {
  modalMode='create'; cloneSourceId=null;
  document.getElementById('modalTitle').textContent='Tao bang gia moi';
  document.getElementById('modalSub').textContent='Dien day du thong tin de tao bang gia moi.';
  ['mName','mNote'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('mGroup').value='';
  document.getElementById('mFrom').value='';
  document.getElementById('mTo').value='';
  document.getElementById('mErr').style.display='none';
  openModal();
}

function openCloneModal() {
  const src=getList(selectedId); if(!src) return;
  modalMode='clone'; cloneSourceId=src.id;
  document.getElementById('modalTitle').textContent='Tao phien ban moi';
  document.getElementById('modalSub').textContent=`Phien ban moi se duoc sao chep tu "${src.name}".`;
  document.getElementById('mName').value=src.name.replace(/v\d+$/,'').trim()+' v'+(src.version+1);
  document.getElementById('mGroup').value=src.group;
  document.getElementById('mFrom').value=src.dateFrom;
  document.getElementById('mTo').value=src.dateTo;
  document.getElementById('mNote').value='';
  document.getElementById('mErr').style.display='none';
  openModal();
}

function openModal() { document.getElementById('modalOverlay').classList.add('open') }
function closeModal() { document.getElementById('modalOverlay').classList.remove('open') }

function submitModal() {
  const name=document.getElementById('mName').value.trim();
  const group=document.getElementById('mGroup').value;
  const from=document.getElementById('mFrom').value;
  const to=document.getElementById('mTo').value;
  const note=document.getElementById('mNote').value.trim();
  const errEl=document.getElementById('mErr');
  if(!name||!group||!from||!to){errEl.textContent='Vui long dien day du thong tin bat buoc.';errEl.style.display='block';return}
  if(from>to){errEl.textContent='Ngay ket thuc phai sau ngay bat dau.';errEl.style.display='block';return}
  errEl.style.display='none';

  if(modalMode==='create'){
    const nl={id:uid(),version:1,name,group,dateFrom:from,dateTo:to,status:'draft',note,parentId:null,rows:PRODUCTS.map(p=>({pid:p.id,price:0,floor:0}))};
    priceLists.unshift(nl);
    selectedId=nl.id;
    showToast('Tao thanh cong!',`Bang gia "${name}" da duoc tao dang ban nhap.`);
  } else {
    const src=getList(cloneSourceId);
    const nl={id:uid(),version:src.version+1,name,group,dateFrom:from,dateTo:to,status:'draft',note,parentId:src.id,rows:src.rows.map(r=>({...r}))};
    priceLists.push(nl);
    selectedId=nl.id;
    showToast('Phien ban moi da tao!',`"${name}" (v${nl.version}) duoc sao chep va san sang chinh sua.`);
  }
  closeModal(); render();
}

function render() { renderSidebar(); renderDetail(); renderVersionCard() }

document.getElementById('btnCreate').addEventListener('click',openCreateModal);
document.getElementById('modalClose').addEventListener('click',closeModal);
document.getElementById('modalCancel').addEventListener('click',closeModal);
document.getElementById('modalSubmit').addEventListener('click',submitModal);
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('modalOverlay'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

render();
</script>
</body>
</html>
