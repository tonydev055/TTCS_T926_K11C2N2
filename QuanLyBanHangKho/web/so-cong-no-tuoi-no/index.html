<div id="arFeature"></div>

<script>
'use strict';
/* S7-03: So cong no theo dai ly – phan tich tuoi no | permission: receivables.read */
window.sprint5Features = window.sprint5Features || {};

window.sprint5Features['So cong no'] = {
  path: 'so-cong-no-tuoi-no',
  permission: 'receivables.read',
  render: () => window.arFeature.render()
};

/* ── Helpers ── */
const _arH = {
  money: v => (Number(v)||0).toLocaleString('vi-VN') + ' d',
  esc:   s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
};

/* ── Mock data ── */
function arMockData() {
  return {
    summary: {
      totalAr: 2845200000,
      totalCollected: 1520000000,
      totalOutstanding: 1325200000,
      totalOverdue: 845700000,
      dealerCount: 12
    },
    dealers: [
      { id:1,  code:'DL-001', name:'Dai ly An Binh',       region:'TP.HCM',      ar:420000000, collected:250000000, outstanding:170000000, aging:{d0:80000000,  d31:50000000, d61:25000000, d91:15000000} },
      { id:2,  code:'DL-002', name:'Dai ly Minh Phat',     region:'Ha Noi',       ar:380000000, collected:200000000, outstanding:180000000, aging:{d0:40000000,  d31:60000000, d61:50000000, d91:30000000} },
      { id:3,  code:'DL-003', name:'Dai ly Thien Long',    region:'Da Nang',      ar:290000000, collected:190000000, outstanding:100000000, aging:{d0:100000000, d31:0,        d61:0,        d91:0}        },
      { id:4,  code:'DL-004', name:'Dai ly Kim Thanh',     region:'Can Tho',      ar:315000000, collected:150000000, outstanding:165000000, aging:{d0:65000000,  d31:70000000, d61:30000000, d91:0}        },
      { id:5,  code:'DL-005', name:'Dai ly Phu Hung',      region:'Binh Duong',   ar:250000000, collected:220000000, outstanding:30000000,  aging:{d0:30000000,  d31:0,        d61:0,        d91:0}        },
      { id:6,  code:'DL-006', name:'Dai ly Dong Bac',      region:'Bac Ninh',     ar:200000000, collected:80000000,  outstanding:120000000, aging:{d0:10000000,  d31:20000000, d61:30000000, d91:60000000} },
      { id:7,  code:'DL-007', name:'Dai ly An Khang',      region:'TP.HCM',       ar:480000000, collected:320000000, outstanding:160000000, aging:{d0:110000000, d31:30000000, d61:15000000, d91:5000000}  },
      { id:8,  code:'DL-008', name:'Dai ly Tay Nam',       region:'Vinh Long',    ar:170000000, collected:80000000,  outstanding:90000000,  aging:{d0:20000000,  d31:30000000, d61:20000000, d91:20000000} },
      { id:9,  code:'DL-009', name:'Dai ly Hung Vuong',    region:'Phu Tho',      ar:145000000, collected:145000000, outstanding:0,          aging:{d0:0,         d31:0,        d61:0,        d91:0}        },
      { id:10, code:'DL-010', name:'Dai ly Mekong',        region:'Tien Giang',   ar:95000000,  collected:55000000,  outstanding:40000000,  aging:{d0:40000000,  d31:0,        d61:0,        d91:0}        },
      { id:11, code:'DL-011', name:'Dai ly Truong Phat',   region:'Long An',      ar:60000000,  collected:20000000,  outstanding:40000000,  aging:{d0:0,         d31:5000000,  d61:15000000, d91:20000000} },
      { id:12, code:'DL-012', name:'Dai ly Phuoc Loc',     region:'Ba Ria-VT',    ar:40000000,  collected:10000000,  outstanding:30000000,  aging:{d0:10000000,  d31:10000000, d61:10000000, d91:0}        }
    ]
  };
}

window.arFeature = (() => {
  let _data = null;
  let _filtered = [];
  let _fs = { keyword:'', ageGroup:'', region:'' };
  const ROOT = 'arFeature';

  async function loadData() {
    try {
      if (typeof window.apiRequest === 'function') {
        const res = await window.apiRequest('receivables/aging');
        if (res && res.dealers) { _data = res; return; }
      }
    } catch(e) { console.warn('S7-03: API fallback to mock.', e); }
    _data = arMockData();
  }

  function agingStatusClass(d) {
    if (!d || d.outstanding <= 0) return 'clear';
    if ((d.aging.d91||0) > 0) return 'overdue91';
    if ((d.aging.d61||0) > 0) return 'overdue61';
    if ((d.aging.d31||0) > 0) return 'overdue31';
    return 'current';
  }

  function agingStatusLabel(cls) {
    return {overdue91:'Qua han >90 ngay',overdue61:'Qua han 61-90 ngay',overdue31:'Qua han 31-60 ngay',current:'Trong han',clear:'Khong con no'}[cls]||'';
  }

  function agingCell(val, cls) {
    if (!val || val <= 0) return '<span class="aging-val zero">-</span>';
    return '<div class="aging-bar"><span class="aging-dot '+cls+'"></span><span class="aging-val '+cls+'">' + _arH.money(val) + '</span></div>';
  }

  function renderKpi() {
    const s = _data?.summary;
    const host = document.getElementById('arKpiSection');
    if (!host || !s) return;
    const pct = s.totalAr > 0 ? (s.totalCollected/s.totalAr*100).toFixed(1) : 0;
    host.innerHTML = '<div class="ar-kpi-grid">'
      + '<div class="ar-kpi-card kpi-ar"><div class="ar-kpi-head"><span class="ar-kpi-label">Tong phai thu</span><span class="ar-kpi-icon">📋</span></div><div class="ar-kpi-val">' + _arH.money(s.totalAr) + '</div><div class="ar-kpi-sub">' + s.dealerCount + ' dai ly co giao dich</div></div>'
      + '<div class="ar-kpi-card kpi-collected"><div class="ar-kpi-head"><span class="ar-kpi-label">Da thu duoc</span><span class="ar-kpi-icon">✓</span></div><div class="ar-kpi-val">' + _arH.money(s.totalCollected) + '</div><div class="ar-kpi-sub">Ti le thu hoi: ' + pct + '%<div class="ar-collect-bar"><div class="ar-collect-fill" style="width:' + pct + '%"></div></div></div></div>'
      + '<div class="ar-kpi-card kpi-outstanding"><div class="ar-kpi-head"><span class="ar-kpi-label">Tong con no</span><span class="ar-kpi-icon">₫</span></div><div class="ar-kpi-val">' + _arH.money(s.totalOutstanding) + '</div><div class="ar-kpi-sub">' + (s.totalOutstanding/s.totalAr*100).toFixed(1) + '% chua thu hoi</div></div>'
      + '<div class="ar-kpi-card kpi-overdue"><div class="ar-kpi-head"><span class="ar-kpi-label">No qua han</span><span class="ar-kpi-icon">⚠</span></div><div class="ar-kpi-val">' + _arH.money(s.totalOverdue) + '</div><div class="ar-kpi-sub" style="color:#b42318;font-weight:600">Uu tien don doc thu hoi</div></div>'
      + '<div class="ar-kpi-card kpi-dealers"><div class="ar-kpi-head"><span class="ar-kpi-label">Dai ly con no</span><span class="ar-kpi-icon">👥</span></div><div class="ar-kpi-val">' + _data.dealers.filter(d=>d.outstanding>0).length + '</div><div class="ar-kpi-sub">/' + s.dealerCount + ' dai ly tong cong</div></div>'
      + '</div>';
  }

  function populateRegions() {
    const sel = document.getElementById('arRegionFilter');
    if (!sel || !_data) return;
    const regions = [...new Set(_data.dealers.map(d=>d.region))].sort();
    regions.forEach(r => { const o = document.createElement('option'); o.value = r; o.textContent = r; sel.appendChild(o); });
  }

  function applyFilterAndRender() {
    if (!_data) return;
    const kw = (_fs.keyword||'').trim().toLowerCase();
    const age = _fs.ageGroup;
    const region = _fs.region;
    _filtered = _data.dealers.filter(d => {
      if (kw && !`${d.name} ${d.code} ${d.region}`.toLowerCase().includes(kw)) return false;
      if (region && d.region !== region) return false;
      if (age==='31' && !(d.aging.d31>0)) return false;
      if (age==='61' && !(d.aging.d61>0)) return false;
      if (age==='91' && !(d.aging.d91>0)) return false;
      if (age==='any' && !((d.aging.d31||0)+(d.aging.d61||0)+(d.aging.d91||0)>0)) return false;
      if (age==='clear' && d.outstanding>0) return false;
      return true;
    });
    const sumEl = document.getElementById('arFilterSummary');
    if (sumEl) sumEl.textContent = 'Hien thi ' + _filtered.length + '/' + _data.dealers.length + ' dai ly';
    renderTable(_filtered);
  }

  function renderTable(list) {
    const wrap = document.getElementById('arTableWrap');
    if (!wrap) return;
    if (!list.length) {
      wrap.innerHTML = '<div class="ar-empty"><strong>Khong tim thay dai ly nao</strong>Thu dieu chinh bo loc hoac tu khoa tim kiem.</div>';
      return;
    }
    const tot = list.reduce((a,d) => ({ ar:a.ar+(d.ar||0), collected:a.collected+(d.collected||0), outstanding:a.outstanding+(d.outstanding||0), d0:a.d0+(d.aging.d0||0), d31:a.d31+(d.aging.d31||0), d61:a.d61+(d.aging.d61||0), d91:a.d91+(d.aging.d91||0) }), {ar:0,collected:0,outstanding:0,d0:0,d31:0,d61:0,d91:0});
    const rows = list.map(d => {
      const sc = agingStatusClass(d);
      return '<tr><td><span class="ar-dealer-name">' + _arH.esc(d.name) + '</span><span class="ar-dealer-code">' + _arH.esc(d.code) + ' · ' + _arH.esc(d.region) + '</span></td>'
        + '<td class="num-col">' + _arH.money(d.ar) + '</td>'
        + '<td class="num-col" style="color:#027a48">' + _arH.money(d.collected) + '</td>'
        + '<td class="num-col" style="color:' + (d.outstanding>0?'#b42318':'#64748b') + '">' + _arH.money(d.outstanding) + '</td>'
        + '<td class="aging-col">' + agingCell(d.aging.d0,'a0') + '</td>'
        + '<td class="aging-col">' + agingCell(d.aging.d31,'a31') + '</td>'
        + '<td class="aging-col">' + agingCell(d.aging.d61,'a61') + '</td>'
        + '<td class="aging-col">' + agingCell(d.aging.d91,'a91') + '</td>'
        + '<td><span class="ar-status-badge ' + sc + '">' + agingStatusLabel(sc) + '</span></td></tr>';
    }).join('');
    wrap.innerHTML = '<table class="ar-table"><thead><tr>'
      + '<th>Dai ly</th><th class="num-col">Phai thu</th><th class="num-col">Da thu</th><th class="num-col">Con no</th>'
      + '<th class="aging-col" style="border-left:2px solid #e2e8f0">0-30 ngay</th>'
      + '<th class="aging-col">31-60 ngay</th><th class="aging-col">61-90 ngay</th><th class="aging-col">&gt;90 ngay</th>'
      + '<th>Trang thai</th></tr></thead>'
      + '<tbody>' + rows + '</tbody>'
      + '<tfoot><tr>'
      + '<td><strong>TONG CONG (' + list.length + ' dai ly)</strong></td>'
      + '<td class="num-col">' + _arH.money(tot.ar) + '</td>'
      + '<td class="num-col" style="color:#027a48">' + _arH.money(tot.collected) + '</td>'
      + '<td class="num-col" style="color:' + (tot.outstanding>0?'#b42318':'#64748b') + '">' + _arH.money(tot.outstanding) + '</td>'
      + '<td class="aging-col" style="border-left:2px solid #cbd5e1">' + agingCell(tot.d0,'a0') + '</td>'
      + '<td class="aging-col">' + agingCell(tot.d31,'a31') + '</td>'
      + '<td class="aging-col">' + agingCell(tot.d61,'a61') + '</td>'
      + '<td class="aging-col">' + agingCell(tot.d91,'a91') + '</td>'
      + '<td></td></tr></tfoot></table>';
  }

  function exportCsv() {
    if (!_data) return;
    const list = _filtered.length ? _filtered : _data.dealers;
    const BOM = '\uFEFF';
    const hdr = ['Ma dai ly','Ten dai ly','Khu vuc','Phai thu (d)','Da thu (d)','Con no (d)','0-30 ngay (d)','31-60 ngay (d)','61-90 ngay (d)','>90 ngay (d)','Trang thai'];
    const rows = list.map(d => [d.code,d.name,d.region,d.ar,d.collected,d.outstanding,d.aging.d0||0,d.aging.d31||0,d.aging.d61||0,d.aging.d91||0,agingStatusLabel(agingStatusClass(d))].map(v=>'\"'+String(v).replace(/"/g,'""')+'\"').join(','));
    const csv = BOM + [hdr.map(h=>'\"'+h+'\"').join(','),...rows].join('\r\n');
    const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const now = new Date();
    const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
    a.href = url; a.download = `SoCongNo_TuoiNo_${stamp}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  function bindEvents() {
    let t;
    document.getElementById('arSearch')?.addEventListener('input', e => { clearTimeout(t); t=setTimeout(()=>{ _fs.keyword=e.target.value; applyFilterAndRender(); },200); });
    document.getElementById('arAgeFilter')?.addEventListener('change', e => { _fs.ageGroup=e.target.value; applyFilterAndRender(); });
    document.getElementById('arRegionFilter')?.addEventListener('change', e => { _fs.region=e.target.value; applyFilterAndRender(); });
    document.getElementById('arResetFilter')?.addEventListener('click', () => {
      _fs = {keyword:'',ageGroup:'',region:''};
      ['arSearch','arAgeFilter','arRegionFilter'].forEach(id => { const el = document.getElementById(id); if(el) el.value=''; });
      applyFilterAndRender();
    });
    document.getElementById('arRefreshBtn')?.addEventListener('click', async () => {
      const btn = document.getElementById('arRefreshBtn');
      if(btn) btn.disabled=true;
      _data=null; await loadData(); renderKpi(); applyFilterAndRender();
      if(btn) btn.disabled=false;
    });
    document.getElementById('arExportBtn')?.addEventListener('click', exportCsv);
  }

  async function render() {
    const host = document.getElementById(ROOT);
    if (!host) return;
    host.innerHTML = '<header class="ar-header"><div><span class="ar-eyebrow">KE TOAN CONG NO · PHAN TICH TUOI NO</span><h1 class="ar-title">So cong no theo dai ly</h1><p class="ar-desc">Tong hop phai thu, da thu va phan tich tuoi no 0-30 / 31-60 / 61-90 / &gt;90 ngay cho tung dai ly.</p></div><div class="ar-header-actions"><button class="ar-btn" id="arRefreshBtn">↻ Lam moi</button><button class="ar-btn primary" id="arExportBtn">⬇ Xuat Excel (.csv)</button></div></header>'
      + '<section id="arKpiSection"></section>'
      + '<section class="ar-card" id="arTableCard"><div class="ar-toolbar"><div class="ar-search-wrap"><span class="ar-search-icon">🔍</span><input type="text" id="arSearch" class="ar-input" placeholder="Tim dai ly, ma, khu vuc..."></div><select id="arAgeFilter" class="ar-select"><option value="">Tat ca nhom tuoi no</option><option value="31">Qua han 31-60 ngay</option><option value="61">Qua han 61-90 ngay</option><option value="91">Qua han &gt;90 ngay (Nghiem trong)</option><option value="any">Co no qua han (bat ky nhom)</option><option value="clear">Da thanh toan hoan toan</option></select><select id="arRegionFilter" class="ar-select"><option value="">Tat ca khu vuc</option></select><button class="ar-btn" id="arResetFilter">↺ Xoa loc</button><span class="ar-filter-summary" id="arFilterSummary"></span></div><div class="ar-table-wrap" id="arTableWrap"></div></section>';
    await loadData();
    renderKpi();
    populateRegions();
    applyFilterAndRender();
    bindEvents();
  }

  return { render };
})();
</script>
