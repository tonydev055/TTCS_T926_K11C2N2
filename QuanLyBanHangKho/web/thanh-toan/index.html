<style>
.finance-page{display:flex;flex-direction:column;gap:20px;color:var(--ink,#172033)}.finance-page .finance-card{background:#fff;border:1px solid #e4e9ef;border-radius:14px;padding:22px}.finance-page .finance-head,.finance-page .finance-toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.finance-page h2{margin:0 0 8px}.finance-page p{color:#64748b;line-height:1.6}.finance-page .finance-scroll{overflow-x:auto}.finance-page table{width:100%;border-collapse:collapse;min-width:650px}.finance-page th,.finance-page td{padding:12px;text-align:left;border-bottom:1px solid #e4e9ef}.finance-page th{background:#f8fafc;white-space:nowrap}.finance-page td{vertical-align:top}.finance-page td:last-child{white-space:nowrap}.finance-page td button+button{margin-left:8px}.finance-page button{padding:10px 14px;border:1px solid #dbe2ea;background:#fff;border-radius:9px;cursor:pointer;color:#172033}.finance-page button.primary{background:var(--orange,#f97316);color:white;border-color:transparent}.finance-page button:disabled{opacity:.5;cursor:wait}.finance-page button:focus-visible,.finance-page input:focus-visible,.finance-page select:focus-visible{outline:3px solid #fdba74;outline-offset:2px}.finance-page input,.finance-page select{padding:10px;border:1px solid #dbe2ea;border-radius:8px;max-width:100%}.finance-page .finance-error{color:#b42318}.finance-page .finance-empty{padding:28px;text-align:center;color:#64748b}.finance-page .finance-summary{font-size:18px;font-weight:600}.finance-page .finance-actions{display:flex;gap:8px;flex-wrap:wrap}@media print{body>*{display:none!important}body>.finance-print{display:block!important}.finance-print table{width:100%;border-collapse:collapse}.finance-print td,.finance-print th{padding:8px;border:1px solid #ccc}.finance-print h2{text-align:center}}
</style>
<script>
window.financeUi={
 e:value=>escapeHtml(String(value??'')),m:value=>formatMoney(value),
 date:()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;},
 table(headers,rows){return '<div class="finance-scroll"><table><thead><tr>'+headers.map(x=>'<th>'+this.e(x)+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.map(cells=>'<tr>'+cells.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+headers.length+'" class="finance-empty">Chưa có dữ liệu</td></tr>')+'</tbody></table></div>';},
 print(title,html){const section=document.createElement('section');section.className='finance-print';section.innerHTML='<h2>'+this.e(title)+'</h2>'+html;document.body.append(section);try{window.print();}finally{section.remove();}},
 async screen(name,description,endpoint,draw){const host=moduleContent,revision=viewRevision;host.innerHTML='<section class="finance-page"><header class="finance-card"><h2>'+this.e(name)+'</h2><p>'+this.e(description)+'</p></header><section class="finance-card" id="financeBody" role="status">Đang tải…</section></section>';try{const data=await apiRequest(endpoint);if(revision!==viewRevision)return;const body=host.querySelector('#financeBody');body.removeAttribute('role');draw(data,body,revision);}catch(error){if(revision===viewRevision){const body=host.querySelector('#financeBody');body.innerHTML='<p class="finance-error" role="alert">'+this.e(error.message)+'</p><button type="button">Thử lại</button>';body.querySelector('button').onclick=()=>this.screen(name,description,endpoint,draw);}}},
 bindForm(dialog,submit){let busy=false;dialog.form.onsubmit=async event=>{event.preventDefault();if(busy)return;busy=true;const button=dialog.form.querySelector('[type=submit]');if(button)button.disabled=true;try{await submit(dialog.form);dialog.close();}catch(error){const target=dialog.form.querySelector('#s2FormError');if(target)target.textContent=error.message;else showRequestError(error);}finally{busy=false;if(button)button.disabled=false;}};}
};
window.sprint5Features=window.sprint5Features||{};
window.sprint5Features['Thanh toán và đối trừ']={path:'thanh-toan',permission:'payments.write',render(){
 const ui=financeUi,e=ui.e,m=ui.m;
 ui.screen('Thanh toán và đối trừ','Ghi nhận tiền thu, đối trừ hóa đơn cũ nhất trước hoặc chọn một hóa đơn cụ thể.','payments',(data,body,revision)=>{
  body.innerHTML='<div class="finance-toolbar"><button class="primary" id="paymentCreate">Ghi nhận khoản thu</button><input id="paymentSearch" aria-label="Tìm khoản thu" placeholder="Tìm mã phiếu, đại lý…"></div><div id="paymentRows"></div>';
  function renderRows(){const q=body.querySelector('#paymentSearch').value.toLocaleLowerCase('vi');body.querySelector('#paymentRows').innerHTML=ui.table(['Phiếu thu','Đại lý','Ngày thu','Số tiền','Hình thức','Người thu','Trạng thái','Thao tác'],data.payments.filter(p=>(p.receipt_code+' '+p.customer_code+' '+p.customer_name).toLocaleLowerCase('vi').includes(q)).map(p=>[e(p.receipt_code),e(p.customer_code+' · '+p.customer_name),e(p.received_date),m(p.amount),e(({CASH:'Tiền mặt',BANK_TRANSFER:'Chuyển khoản',OTHER:'Khác'})[p.payment_method]),e(p.collector_name),p.reversed?'Đã hoàn tác':'Đã đối trừ','<button data-detail="'+p.id+'">Chi tiết</button>'+(p.reversed?'':' <button data-reverse="'+p.id+'">Hoàn tác</button>')]));}
  renderRows();body.querySelector('#paymentSearch').oninput=renderRows;
  body.onclick=async event=>{const detail=event.target.closest('[data-detail]'),reverse=event.target.closest('[data-reverse]');if(!detail&&!reverse)return;
   if(detail){try{const p=await apiRequest('payments/'+detail.dataset.detail);if(revision!==viewRevision)return;openFormDialog('Khoản thu '+p.receipt_code,'<p>Đại lý: '+e(p.customer_name)+'</p><p>Tiền thu: '+m(p.amount)+'</p><p>Ghi chú: '+e(p.note)+'</p>'+ui.table(['Hóa đơn','Đối trừ'],p.allocations.map(a=>[e(a.invoice_number),m(a.amount)])),null);}catch(error){showRequestError(error);}}
   if(reverse){const dialog=openFormDialog('Lập bút toán hoàn tác khoản thu','<div class="form-group full"><label>Lý do bắt buộc<textarea name="reason" required maxlength="1000"></textarea></label><small>Giữ nguyên phiếu thu gốc và hoàn lại công nợ của các hóa đơn đã đối trừ.</small></div>','Ghi bút toán');ui.bindForm(dialog,async form=>{await apiRequest('payments/'+reverse.dataset.reverse+'/reversals',jsonRequestOptions('POST',{reason:form.reason.value}));if(revision===viewRevision)window.sprint5Features['Thanh toán và đối trừ'].render();});}
  };
  body.querySelector('#paymentCreate').onclick=()=>{
   const requestKey=crypto.randomUUID(),dialog=openFormDialog('Ghi nhận thanh toán','<div class="form-group"><label>Đại lý *<select name="customerId" required>'+data.customers.map(c=>'<option value="'+c.id+'">'+e(c.code+' · '+c.name)+'</option>').join('')+'</select></label></div><div class="form-group"><label>Hóa đơn<select name="invoiceId"></select></label></div><div class="form-group"><label>Số tiền *<input name="amount" type="number" min="0.01" step="0.01" required></label></div><div class="form-group"><label>Ngày thu *<input name="receivedDate" type="date" required max="'+ui.date()+'" value="'+ui.date()+'"></label></div><div class="form-group"><label>Hình thức<select name="paymentMethod"><option value="CASH">Tiền mặt</option><option value="BANK_TRANSFER">Chuyển khoản</option><option value="OTHER">Khác</option></select></label></div><div class="form-group full"><label>Ghi chú<textarea name="note" maxlength="1000"></textarea></label></div>','Ghi nhận');
   const form=dialog.form;function invoices(){form.invoiceId.innerHTML='<option value="">Tự động: hóa đơn cũ nhất trước</option>'+data.invoices.filter(i=>String(i.customer_id)===form.customerId.value).map(i=>'<option value="'+i.id+'">'+e(i.invoice_number)+' · còn '+e(m(i.outstanding))+'</option>').join('');}form.customerId.onchange=invoices;invoices();
   ui.bindForm(dialog,async form=>{await apiRequest('payments',jsonRequestOptions('POST',{customerId:form.customerId.value,invoiceId:form.invoiceId.value||null,amount:form.amount.value,receivedDate:form.receivedDate.value,paymentMethod:form.paymentMethod.value,note:form.note.value,requestKey}));showToast('Đã ghi nhận và đối trừ khoản thu','success');if(revision===viewRevision)window.sprint5Features['Thanh toán và đối trừ'].render();});
  };
 });
}};
</script>
