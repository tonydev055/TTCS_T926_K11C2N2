<script>
window.sprint5Features['Thẻ kho sản phẩm']={path:'the-kho',permission:'inventory.read',render:()=>warehouseUi.screen('Thẻ kho sản phẩm','Biến động theo thời gian, số dư sau từng dòng và chứng từ nguồn. Số lượng theo đơn vị cơ sở.',()=>apiRequest('stock-card/masters'),(host,m,rev)=>{
 const ui=warehouseUi,e=ui.esc;let page=1,seq=0;host.innerHTML='<div class="wh-toolbar"><label>Kho<select id="cardWh">'+m.warehouses.map(w=>'<option value="'+w.id+'">'+e(w.name)+'</option>').join('')+'</select></label><label>Sản phẩm<select id="cardProduct">'+m.products.map(p=>'<option value="'+p.id+'">'+e(p.sku)+' — '+e(p.name)+'</option>').join('')+'</select></label><label>Từ ngày<input id="cardFrom" type="date"></label><label>Đến ngày<input id="cardTo" type="date"></label><button id="cardLoad">Xem thẻ kho</button></div><div id="cardRows" aria-live="polite">Chọn sản phẩm để xem thẻ kho.</div><div class="wh-toolbar"><button id="cardPrev" disabled>Trang trước</button><span id="cardPage"></span><button id="cardNext" disabled>Trang sau</button></div>';
 async function load(){const n=++seq;try{const d=await apiRequest('stock-card?'+new URLSearchParams({warehouseId:host.querySelector('#cardWh').value,productId:host.querySelector('#cardProduct').value,from:host.querySelector('#cardFrom').value,to:host.querySelector('#cardTo').value,page}));if(n!==seq||rev!==viewRevision)return;host.querySelector('#cardRows').innerHTML='<h3>'+e(d.product.sku)+' — '+e(d.product.name)+'</h3><p>Tồn đầu kỳ: '+e(d.openingBalance)+' '+e(d.product.base_unit)+'</p>'+ui.table(['Thời gian','Nghiệp vụ','Chứng từ','Nhập','Xuất','Tồn sau'],d.items.map(x=>'<tr><td>'+e(x.occurred_at)+'</td><td>'+e(({RECEIPT:'Nhập/điều chỉnh',COUNT:'Kiểm kê',TRANSFER_IN:'Chuyển đến',TRANSFER_OUT:'Chuyển đi',SHIPMENT_OUT:'Xuất hàng',DELIVERY_RETURN:'Giao không thành công',SALES_RETURN:'Đại lý trả hàng'})[x.kind]||x.kind)+'</td><td><button data-doc="'+x.id+'">'+e(x.documentCode)+'</button></td><td>'+e(x.delta>0?x.delta:'')+'</td><td>'+e(x.delta<0?-x.delta:'')+'</td><td>'+e(x.balance)+'</td></tr>'));host.querySelector('#cardPage').textContent='Trang '+page+' · '+d.total+' dòng';host.querySelector('#cardPrev').disabled=page===1;host.querySelector('#cardNext').disabled=page*50>=d.total;host.querySelectorAll('[data-doc]').forEach(b=>b.onclick=async()=>{try{const doc=await apiRequest('stock-card/documents/'+b.dataset.doc);if(rev!==viewRevision)return;openFormDialog('Chứng từ '+doc.code,ui.table(['SKU','Sản phẩm','Lô','Biến động','Lý do'],doc.items.map(x=>'<tr><td>'+e(x.sku)+'</td><td>'+e(x.name)+'</td><td>'+e(x.lot_number)+'</td><td>'+e(x.delta)+'</td><td>'+e(x.reason)+'</td></tr>')),null);}catch(err){showToast(err.message,'error');}});}catch(err){if(n===seq&&rev===viewRevision)host.querySelector('#cardRows').innerHTML='<p role="alert" class="wh-error">'+e(err.message)+'</p>';}}
 host.querySelector('#cardLoad').onclick=()=>{page=1;load();};host.querySelector('#cardPrev').onclick=()=>{page--;load();};host.querySelector('#cardNext').onclick=()=>{page++;load();};
})};
</script>
