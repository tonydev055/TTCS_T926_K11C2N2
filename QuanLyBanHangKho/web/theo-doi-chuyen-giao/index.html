<script>
window.sprint5Features['Theo doi chuyen giao']={path:'theo-doi-chuyen-giao',permission:'inventory.read',render:()=>warehouseUi.screen('Theo dõi chuyến giao','Hàng chưa giao vẫn thuộc trách nhiệm chuyến. Quá giờ dự kiến chỉ cảnh báo, không tự nhập trả kho.',()=>apiRequest('trip-monitor'),(host,d,rev)=>{
 const ui=warehouseUi,e=ui.esc,reload=()=>sprint5Features['Theo doi chuyen giao'].render();host.innerHTML='<div class="wh-toolbar"><button id="monitorRefresh">Làm mới</button><span>'+d.items.length+' chuyến đang giao · '+d.items.filter(t=>t.overdue&&Number(t.remaining_stops)>0).length+' chuyến quá giờ còn hàng</span></div>'+ui.table(['Chuyến / Khu vực','Kho','Tài xế / Xe','Dự kiến','Đã giao','Đã trả kho','Còn trách nhiệm','Thao tác'],d.items.map(t=>'<tr class="'+(t.overdue&&Number(t.remaining_stops)>0?'wh-low':'')+'"><td>'+e(t.code)+' / '+e(t.region)+(t.overdue&&Number(t.remaining_stops)>0?' · Quá giờ dự kiến':'')+'</td><td>'+e(t.warehouse)+'</td><td>'+e(t.driver)+' / '+e(t.vehicle)+'</td><td>'+e(t.expected_at)+'</td><td>'+e(t.delivered_stops)+'/'+e(t.total_stops)+'</td><td>'+e(t.returned_stops)+'</td><td>'+e(t.remaining_stops)+' điểm</td><td><button data-detail="'+t.id+'">Chi tiết hàng</button>'+(d.canWrite&&Number(t.remaining_stops)===0?' <button data-complete="'+t.id+'">Kết thúc chuyến</button>':'')+'</td></tr>'));host.querySelector('#monitorRefresh').onclick=reload;
 host.querySelectorAll('[data-detail]').forEach(b=>b.onclick=async()=>{try{const t=await apiRequest('trip-monitor/'+b.dataset.detail);if(rev!==viewRevision)return;openFormDialog(t.code,ui.table(['Điểm','Đơn','Người nhận / Điện thoại','Địa chỉ','Số lượng đã xuất','Kết quả'],t.stops.map(s=>'<tr><td>'+s.sequence+'</td><td>'+e(s.order_code)+'</td><td>'+e(s.recipient_name)+' / '+e(s.phone)+'</td><td>'+e(s.address)+'</td><td>'+e(s.shipped_quantity)+'</td><td>'+e(s.outcome==='SUCCESS'?'Đã giao':s.returned_to_warehouse?'Đã xử lý trả kho':'Hàng thuộc trách nhiệm chuyến')+(s.failure_reason?' — '+e(s.failure_reason):'')+'</td></tr>')),null);}catch(err){showToast(err.message,'error');}});
 host.querySelectorAll('[data-complete]').forEach(b=>b.onclick=async()=>{if(b.disabled)return;b.disabled=true;try{await apiRequest('trip-monitor/'+b.dataset.complete+'/complete',jsonRequestOptions('POST',{}));if(rev===viewRevision)reload();}catch(err){showToast(err.message,'error');}finally{b.disabled=false;}});
 setTimeout(()=>{if(rev===viewRevision&&host.isConnected&&!document.getElementById('s2Dialog'))reload();},60000);
})};
</script>
