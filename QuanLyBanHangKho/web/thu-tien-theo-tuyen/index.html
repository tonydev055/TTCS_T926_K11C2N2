<script>
(()=>{
 function render(accountant){const ui=financeUi,e=ui.e,m=ui.m,endpoint=accountant?'collection-settlements':'route-collections';ui.screen(accountant?'Nhận tiền thu theo tuyến':'Thu tiền theo tuyến','Ảnh biên lai lưu tại máy chủ. Khoản thu chờ nộp chỉ được đối trừ khi kế toán xác nhận đã nhận tiền.',endpoint,(data,body,revision)=>{
  body.innerHTML='<div class="finance-toolbar">'+(accountant?'':'<button class="primary" id="routeCreate">Ghi khoản thu tại cửa hàng</button>')+'<input id="routeQ" aria-label="Tìm nhân viên hoặc đại lý" placeholder="Tìm nhân viên hoặc đại lý"><label>Ngày thu <input type="date" id="routeDate"></label></div><div id="routeRows"></div><h3>Đối chiếu theo nhân viên và ngày</h3><div id="routeTotals"></div>';
  function rows(){const q=body.querySelector('#routeQ').value.toLocaleLowerCase('vi'),date=body.querySelector('#routeDate').value;
   body.querySelector('#routeRows').innerHTML=ui.table(['Khoản thu','Đại lý','Nhân viên','Ngày thu','Tiền thu','Trạng thái','Biên lai','Thao tác'],data.items.filter(r=>(r.customer_name+' '+r.customer_code+' '+r.collector_name).toLocaleLowerCase('vi').includes(q)&&(!date||r.collected_date===date)).map(r=>[e('TT-'+r.id),e(r.customer_code+' · '+r.customer_name),e(r.collector_name),e(r.collected_date),m(r.amount),r.status==='PENDING'?'Chờ nộp':'Kế toán đã nhận','<a target="_blank" rel="noopener" href="api/'+endpoint+'/'+r.id+'/proof">Ảnh biên lai</a>',accountant&&r.status==='PENDING'?'<button data-accept="'+r.id+'">Xác nhận nhận tiền</button>':e(r.accountant_name||'—')]));
   body.querySelector('#routeTotals').innerHTML=ui.table(['Nhân viên','Ngày','Đã thu','Đã nộp','Chờ nộp'],data.totals.filter(r=>r.full_name.toLocaleLowerCase('vi').includes(q)&&(!date||r.collected_date===date)).map(r=>[e(r.full_name),e(r.collected_date),m(r.collected),m(r.submitted),m(r.pending)]));
  }rows();body.querySelector('#routeQ').oninput=rows;body.querySelector('#routeDate').oninput=rows;
  body.onclick=async event=>{const button=event.target.closest('[data-accept]');if(!button)return;if(!confirm('Xác nhận công ty đã nhận đủ tiền của khoản thu TT-'+button.dataset.accept+'?'))return;button.disabled=true;try{await apiRequest(endpoint+'/'+button.dataset.accept+'/accept',jsonRequestOptions('POST',{}));showToast('Đã nhận tiền và đối trừ hóa đơn','success');if(revision===viewRevision)render(accountant);}catch(error){showRequestError(error);}finally{button.disabled=false;}};
  if(!accountant)body.querySelector('#routeCreate').onclick=()=>{const key=crypto.randomUUID(),today=ui.date(),dialog=openFormDialog('Ghi khoản thu tại cửa hàng','<div class="form-group full"><label>Đại lý được phân công<select name="customerId" required>'+data.customers.map(c=>'<option value="'+c.id+'">'+e(c.code+' · '+c.name)+'</option>').join('')+'</select></label></div><div class="form-group"><label>Số tiền *<input name="amount" type="number" min="0.01" step="0.01" required></label></div><div class="form-group"><label>Ngày thu *<input name="collectedDate" type="date" value="'+today+'" max="'+today+'" required></label></div><div class="form-group full"><label>Ảnh biên lai *<input name="proof" type="file" accept="image/jpeg,image/png" required></label><small>JPG/PNG tối đa 2 MB.</small></div><div class="form-group full"><label>Ghi chú<textarea name="note" maxlength="1000"></textarea></label></div>','Lưu khoản thu chờ nộp');ui.bindForm(dialog,async form=>{const file=form.proof.files[0];if(!file||file.size>2097152)throw new Error('Chọn ảnh JPG/PNG tối đa 2 MB');const payload=new FormData(form);payload.set('requestKey',key);const response=await apiFetch('api/'+endpoint,{method:'POST',body:payload});const result=await response.json();if(!response.ok)throw new Error(result.message||'Không ghi nhận được khoản thu');showToast('Đã lưu khoản thu chờ nộp','success');if(revision===viewRevision)render(false);});};
 });}
 window.sprint5Features=window.sprint5Features||{};
 sprint5Features['Thu tiền theo tuyến']={path:'thu-tien-theo-tuyen',permission:'orders.own',render:()=>render(false)};
 sprint5Features['Nhận tiền thu theo tuyến']={path:'thu-tien-theo-tuyen',permission:'payments.write',render:()=>render(true)};
})();
</script>
