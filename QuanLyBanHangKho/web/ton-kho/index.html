<script>
window.sprint5Features=window.sprint5Features||{};
window.sprint5Features['Sổ tồn kho']={path:'ton-kho',permission:'inventory.read',render:()=>warehouseUi.screen('Sổ tồn kho','Tồn khả dụng = tồn thực tế − tồn giữ chỗ. Tất cả số lượng theo đơn vị cơ sở.',()=>apiRequest('inventory/masters'),(host,masters,revision)=>{
 const ui=warehouseUi,esc=ui.esc;let page=1,seq=0,applied=null;
 host.innerHTML='<div class="wh-toolbar"><label>Kho<select id="tkWarehouse"><option value="">Tất cả kho được cấp</option>'+masters.warehouses.map(w=>'<option value="'+w.id+'">'+esc(w.name)+'</option>').join('')+'</select></label><label>Nhóm hàng<select id="tkCategory"><option value="">Tất cả nhóm</option>'+masters.categories.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></label><label>Trạng thái tồn<select id="tkState"><option value="">Tất cả</option><option value="AVAILABLE">Còn khả dụng</option><option value="EMPTY">Hết khả dụng</option><option value="RESERVED">Có giữ chỗ</option></select></label><label>Tìm mã/tên<input id="tkSearch" type="search"></label><button class="orange-button" id="tkLoad">Lọc</button></div><button type="button" id="tkExport" disabled>Xuất Excel</button><div id="tkRows" aria-live="polite"></div><div class="wh-toolbar"><button id="tkPrev">Trang trước</button><span id="tkPage"></span><button id="tkNext">Trang sau</button></div>';
 // Ngưỡng tồn thấp (S5-09) lấy trực tiếp từ API cảnh báo; lỗi tải ngưỡng không chặn sổ tồn.
 async function lowStock(){try{const d=await apiRequest('stock-alerts');return new Map(d.items.filter(r=>r.low).map(r=>[r.warehouse_id+'-'+r.product_id,r.minimum_quantity]));}catch(e){return new Map();}}
 async function load(){applied=null;host.querySelector('#tkExport').disabled=true;const current=++seq,params=new URLSearchParams({warehouseId:host.querySelector('#tkWarehouse').value,categoryId:host.querySelector('#tkCategory').value,state:host.querySelector('#tkState').value,q:host.querySelector('#tkSearch').value,page,pageSize:20});try{const [data,low]=await Promise.all([apiRequest('inventory?'+params),lowStock()]);if(current!==seq||revision!==viewRevision)return;
  applied=params;host.querySelector('#tkExport').disabled=!hasPermission('reports.inventory');host.querySelector('#tkRows').innerHTML=ui.table(['Kho','SKU','Sản phẩm','Đơn vị cơ sở','Tồn thực tế','Giữ chỗ','Khả dụng','Chi tiết'],data.items.map(r=>{const min=low.get(r.warehouse_id+'-'+r.product_id);return '<tr class="'+(min!==undefined?'wh-low':'')+'"><td>'+esc(r.warehouse_name)+'</td><td>'+esc(r.sku)+'</td><td>'+esc(r.name)+(min!==undefined?' · Dưới tồn tối thiểu ('+esc(min)+')':'')+'</td><td>'+esc(r.base_unit)+'</td><td>'+r.on_hand+'</td><td>'+r.reserved+'</td><td>'+r.available+'</td><td><button data-wh="'+r.warehouse_id+'" data-product="'+r.product_id+'">Lô/vị trí & sổ</button></td></tr>';}));
  host.querySelector('#tkPage').textContent='Trang '+page+' · '+data.total+' dòng';host.querySelector('#tkPrev').disabled=page===1;host.querySelector('#tkNext').disabled=page*20>=data.total;
  host.querySelectorAll('[data-product]').forEach(b=>b.onclick=async()=>{try{const d=await apiRequest('inventory/ledger?warehouseId='+b.dataset.wh+'&productId='+b.dataset.product);if(revision!==viewRevision)return;openFormDialog('Lô/vị trí và biến động',ui.table(['Vị trí','Số lô','Hạn dùng','Tồn'],d.bins.map(l=>'<tr><td>'+esc(l.location_name)+'</td><td>'+esc(l.lot_number)+'</td><td>'+esc(l.expiry_date)+'</td><td>'+l.on_hand+'</td></tr>'))+ui.table(['Thời gian','Nghiệp vụ','Phiếu','Biến động','Lý do'],d.movements.map(m=>'<tr><td>'+esc(m.created_at)+'</td><td>'+esc(({RECEIPT:'Nhập/điều chỉnh',TRANSFER_OUT:'Chuyển đi',TRANSFER_IN:'Nhận chuyển',COUNT:'Kiểm kê'})[m.kind]||m.kind)+'</td><td>'+m.document_id+'</td><td>'+m.delta+'</td><td>'+esc(m.reason)+'</td></tr>')),null);}catch(e){showToast(e.message,'error');}});
 }catch(e){if(current===seq&&revision===viewRevision)host.querySelector('#tkRows').innerHTML='<p class="wh-error">'+esc(e.message)+'</p>';}}
 const exportButton=host.querySelector('#tkExport');exportButton.hidden=!hasPermission('reports.inventory');
 for(const id of ['tkWarehouse','tkCategory','tkState','tkSearch'])host.querySelector('#'+id).addEventListener('input',()=>{seq++;applied=null;exportButton.disabled=true;});
 exportButton.onclick=async()=>{
  if(!applied)return;const params=new URLSearchParams(applied);params.delete('page');params.delete('pageSize');exportButton.disabled=true;
  try{const response=await apiFetch('api/inventory/export?'+params);if(!response.ok){const d=await response.json();throw new Error(d.message||'Không xuất được sổ tồn kho');}const blob=await response.blob();if(revision!==viewRevision)return;
   const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=response.headers.get('Content-Disposition')?.match(/filename=([^;]+)/)?.[1]||'ton-kho.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(error){if(revision===viewRevision)showRequestError(error);}finally{if(revision===viewRevision)exportButton.disabled=!applied;}
 };
 host.querySelector('#tkLoad').onclick=()=>{page=1;load();};host.querySelector('#tkSearch').onkeydown=e=>{if(e.key==='Enter'){page=1;load();}};host.querySelector('#tkPrev').onclick=()=>{page--;load();};host.querySelector('#tkNext').onclick=()=>{page++;load();};load();
})};
</script>
