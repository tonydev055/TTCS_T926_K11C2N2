<script>
window.sprint5Features=window.sprint5Features||{};
window.sprint5Features['Sổ tồn kho']={path:'ton-kho',permission:'inventory.read',render:()=>warehouseUi.screen('Sổ tồn kho','Tồn khả dụng = tồn thực tế − tồn giữ chỗ. Tất cả số lượng theo đơn vị cơ sở.',()=>apiRequest('inventory/masters'),(host,masters,revision)=>{
 const ui=warehouseUi,esc=ui.esc;let page=1,seq=0;
 host.innerHTML='<div class="wh-toolbar"><label>Kho<select id="tkWarehouse"><option value="">Tất cả kho được cấp</option>'+masters.warehouses.map(w=>'<option value="'+w.id+'">'+esc(w.name)+'</option>').join('')+'</select></label><label>Nhóm hàng<select id="tkCategory"><option value="">Tất cả nhóm</option>'+masters.categories.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></label><label>Trạng thái tồn<select id="tkState"><option value="">Tất cả</option><option value="AVAILABLE">Còn khả dụng</option><option value="EMPTY">Hết khả dụng</option><option value="RESERVED">Có giữ chỗ</option></select></label><label>Tìm mã/tên<input id="tkSearch" type="search"></label><button class="orange-button" id="tkLoad">Lọc</button></div><div id="tkRows" aria-live="polite"></div><div class="wh-toolbar"><button id="tkPrev">Trang trước</button><span id="tkPage"></span><button id="tkNext">Trang sau</button></div>';
 async function load(){const current=++seq,params=new URLSearchParams({warehouseId:host.querySelector('#tkWarehouse').value,categoryId:host.querySelector('#tkCategory').value,state:host.querySelector('#tkState').value,q:host.querySelector('#tkSearch').value,page,pageSize:20});try{const data=await apiRequest('inventory?'+params);let marks={};if(window.lowStockFeature)marks=await lowStockFeature.marks();if(current!==seq||revision!==viewRevision)return;
  host.querySelector('#tkRows').innerHTML=ui.table(['Kho','SKU','Sản phẩm','Đơn vị cơ sở','Tồn thực tế','Giữ chỗ','Khả dụng','Chi tiết'],data.items.map(r=>'<tr class="'+(marks[r.warehouse_id+'-'+r.product_id]?'wh-low':'')+'"><td>'+esc(r.warehouse_name)+'</td><td>'+esc(r.sku)+'</td><td>'+esc(r.name)+(marks[r.warehouse_id+'-'+r.product_id]?' · Dưới tồn tối thiểu':'')+'</td><td>'+esc(r.base_unit)+'</td><td>'+r.on_hand+'</td><td>'+r.reserved+'</td><td>'+r.available+'</td><td><button data-wh="'+r.warehouse_id+'" data-product="'+r.product_id+'">Lô/vị trí & sổ</button></td></tr>'));
  host.querySelector('#tkPage').textContent='Trang '+page+' · '+data.total+' dòng';host.querySelector('#tkPrev').disabled=page===1;host.querySelector('#tkNext').disabled=page*20>=data.total;
  host.querySelectorAll('[data-product]').forEach(b=>b.onclick=async()=>{try{const d=await apiRequest('inventory/ledger?warehouseId='+b.dataset.wh+'&productId='+b.dataset.product);if(revision!==viewRevision)return;openFormDialog('Lô/vị trí và biến động',ui.table(['Vị trí','Số lô','Hạn dùng','Tồn'],d.bins.map(l=>'<tr><td>'+esc(l.location_name)+'</td><td>'+esc(l.lot_number)+'</td><td>'+esc(l.expiry_date)+'</td><td>'+l.on_hand+'</td></tr>'))+ui.table(['Thời gian','Nghiệp vụ','Phiếu','Biến động','Lý do'],d.movements.map(m=>'<tr><td>'+esc(m.created_at)+'</td><td>'+esc(({RECEIPT:'Nhập/điều chỉnh',TRANSFER_OUT:'Chuyển đi',TRANSFER_IN:'Nhận chuyển',COUNT:'Kiểm kê'})[m.kind]||m.kind)+'</td><td>'+m.document_id+'</td><td>'+m.delta+'</td><td>'+esc(m.reason)+'</td></tr>')),null);}catch(e){showToast(e.message,'error');}});
 }catch(e){if(current===seq&&revision===viewRevision)host.querySelector('#tkRows').innerHTML='<p class="wh-error">'+esc(e.message)+'</p>';}}
 host.querySelector('#tkLoad').onclick=()=>{page=1;load();};host.querySelector('#tkSearch').onkeydown=e=>{if(e.key==='Enter'){page=1;load();}};host.querySelector('#tkPrev').onclick=()=>{page--;load();};host.querySelector('#tkNext').onclick=()=>{page++;load();};load();
})};
</script>
