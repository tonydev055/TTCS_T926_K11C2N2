<!-- Loaded by the application shell: ../index.html -->
<style>
  /* Common layout and controls use assets/shared/styles.css. */
</style>
<script>
  function renderRealHome() {
    const menu = (
      typeof getAvailableMenu === 'function' ? getAvailableMenu() : roleConfigs[activeRole].menu
    ).filter((view) => view !== 'Tổng quan');
    const areas = currentUser.warehouses?.length
      ? currentUser.warehouses.join(', ')
      : currentUser.territory || 'Toàn hệ thống';
    const permissionCount = (currentUser.permissions || []).length;
    moduleContent.innerHTML = `<section class="role-hero app-welcome"><div><span class="eyebrow">KHÔNG GIAN LÀM VIỆC</span><h2>Chào ${escapeHtml(currentUser.fullName || currentUser.email || 'bạn')}</h2><p>${escapeHtml(roleConfigs[activeRole].label)} · Phạm vi: ${escapeHtml(areas)}</p><div class="welcome-badges"><span>✓ Phiên đăng nhập an toàn</span><span>✓ ${permissionCount} quyền đang hiệu lực</span></div></div><div class="welcome-role"><small>VAI TRÒ HIỆN TẠI</small><strong>${escapeHtml(roleConfigs[activeRole].label)}</strong><span>${escapeHtml(areas)}</span></div></section><section class="home-overview"><article><span>01</span><div><small>QUYỀN TRUY CẬP</small><strong>${permissionCount}</strong><p>Chức năng được server cho phép</p></div></article><article><span>02</span><div><small>PHẠM VI</small><strong>${escapeHtml(areas)}</strong><p>Kho hoặc địa bàn đang phụ trách</p></div></article><article><span>03</span><div><small>TRẠNG THÁI</small><strong>Sẵn sàng</strong><p>Dữ liệu được tải trực tiếp từ hệ thống</p></div></article></section><section class="panel home-shortcuts"><div class="panel-heading"><div><span class="eyebrow">TRUY CẬP NHANH</span><h3>Công việc của bạn</h3><p>Chỉ hiển thị các chức năng phù hợp với quyền hiện tại.</p></div></div><div class="role-shortcuts">${menu.map((view, index) => `<button data-open-view="${escapeHtml(view)}"><span>${String(index + 1).padStart(2, '0')}</span><strong>${escapeHtml(view)}</strong><small>Mở chức năng →</small></button>`).join('')}</div></section>`;
    moduleContent
      .querySelectorAll('[data-open-view]')
      .forEach((button) =>
        button.addEventListener('click', () => openView(button.dataset.openView))
      );
  }
</script>
