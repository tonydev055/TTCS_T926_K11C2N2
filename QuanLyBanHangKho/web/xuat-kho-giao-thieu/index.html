<script>
window.sprint5Features = window.sprint5Features || {};

/* ===================================================================
   S6-05: Xac nhan xuat kho va xu ly giao thieu
   User Story: Nhan vien kho xac nhan xuat, phan thieu ghi no hang.
   Acceptance Criteria:
     1. Xac nhan xuat -> chuyen ton giu cho thanh xuat thuc
     2. Giao thieu -> ghi nhan no hang tu dong
     3. Phieu da xac nhan: khoa, read-only
     4. Tab/bang rieng don con no hang
   =================================================================== */

window.sprint5Features['Xuat kho & Giao thieu'] = {
  path: 'xuat-kho-giao-thieu',
  permission: 'inventory.write',
  render: () => warehouseUi.screen(
    'Xuat kho & Giao thieu',
    'Xac nhan chuyen ton giu cho thanh xuat thuc. Giao thieu se ghi nhan no hang de xu ly o luot giao sau.',
    () => Promise.resolve(xkgt_mockData()),
    (host, data, revision) => {
      const ui = warehouseUi, esc = ui.esc;
      const vnd = (v) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND', maximumFractionDigits: 0 }).format(v || 0);
      let activeTab = 'pending';

      // Khoi tao shell
      host.innerHTML = `
        <div id="xkgtFeature">
          <div class="xk-card">
            <div style="padding:14px 20px;border-bottom:1px solid #edf1f5">
              <div class="xk-tabs" role="tablist">
                <button class="xk-tab" role="tab" id="xkTabPending" aria-selected="true" aria-controls="xkPanel">
                  Don cho xuat <span class="xk-badge" id="xkCntPending">${data.pending.length}</span>
                </button>
                <button class="xk-tab" role="tab" id="xkTabShipped" aria-selected="false" aria-controls="xkPanel">
                  Da xuat kho <span class="xk-badge" id="xkCntShipped">${data.shipped.length}</span>
                </button>
                <button class="xk-tab" role="tab" id="xkTabDebt" aria-selected="false" aria-controls="xkPanel">
                  No hang <span class="xk-badge warn" id="xkCntDebt">${data.shortfall.length}</span>
                </button>
              </div>
            </div>
            <div id="xkPanel" role="tabpanel"></div>
          </div>
        </div>`;

      function switchTab(tab) {
        activeTab = tab;
        ['Pending','Shipped','Debt'].forEach(t => {
          const btn = document.getElementById('xkTab' + t);
          if (btn) btn.setAttribute('aria-selected', tab === t.toLowerCase() ? 'true' : 'false');
        });
        renderPanel();
      }

      document.getElementById('xkTabPending').onclick = () => switchTab('pending');
      document.getElementById('xkTabShipped').onclick = () => switchTab('shipped');
      document.getElementById('xkTabDebt').onclick    = () => switchTab('debt');

      function renderPending(q = '', wh = '') {
        const panel = document.getElementById('xkPanel');
        const rows = data.pending.filter(o => {
          const matchQ = !q || [o.orderCode, o.customer, o.warehouse].some(v => v.toLowerCase().includes(q.toLowerCase()));
          const matchWh = !wh || o.warehouse === wh;
          return matchQ && matchWh;
        });
        const totalVal = rows.reduce((s, o) => s + o.payable, 0);
        panel.innerHTML = `
          <div class="xk-toolbar">
            <label class="xk-search"><span>⌕</span><input id="xkSearchPending" type="search" placeholder="Tim ma don, dai ly, kho..." value="${esc(q)}"></label>
            <select class="xk-select" id="xkFilterWh">
              <option value="">Tat ca kho</option>
              ${[...new Set(data.pending.map(o=>o.warehouse))].map(w=>`<option value="${esc(w)}" ${wh===w?'selected':''}>${esc(w)}</option>`).join('')}
            </select>
          </div>
          <div class="xk-summary">
            <span><strong>${rows.length}</strong> don cho xuat</span>
            <span>Tong gia tri: <strong style="color:#f47a00">${vnd(totalVal)}</strong></span>
          </div>
          <div class="xk-table-wrap">
            <table class="xk-table">
              <thead><tr>
                <th>Ma don</th><th>Dai ly</th><th>Kho</th><th>Ngay giao</th>
                <th>So dong</th><th style="text-align:right">Gia tri</th><th>Trang thai</th><th>Thao tac</th>
              </tr></thead>
              <tbody>
                ${rows.length ? rows.map(o => `
                  <tr class="xk-row" data-id="${o.id}">
                    <td><strong>${esc(o.orderCode)}</strong></td>
                    <td>${esc(o.customer)}<small>${esc(o.address)}</small></td>
                    <td>${esc(o.warehouse)}</td>
                    <td>${esc(o.desiredDate)}</td>
                    <td>${o.lines.length} dong</td>
                    <td style="text-align:right;font-weight:700;color:#f47a00">${vnd(o.payable)}</td>
                    <td><span class="xk-status pending">Da duyet</span></td>
                    <td><button class="xk-btn primary xk-confirm-btn" data-id="${o.id}">Xac nhan xuat</button></td>
                  </tr>`).join('') : `
                  <tr><td colspan="8"><div class="xk-empty"><strong>Khong co don nao cho xuat.</strong>Cac don da duyet se xuat hien o day.</div></td></tr>`}
              </tbody>
            </table>
          </div>
          <div class="xk-footer"><span id="xkCountPending">${rows.length} don hang</span></div>`;

        document.getElementById('xkSearchPending').addEventListener('input', e => renderPending(e.target.value, document.getElementById('xkFilterWh').value));
        document.getElementById('xkFilterWh').addEventListener('change', e => renderPending(document.getElementById('xkSearchPending').value, e.target.value));
      }

      function renderPanel() {
        if (activeTab === 'pending') renderPending();
        else {
          document.getElementById('xkPanel').innerHTML = `<div class="xk-empty"><strong>Dang tai du lieu...</strong></div>`;
        }
      }

      renderPanel();
    }
  )
};
</script>
