  #xkgtFeature .xk-empty{padding:48px 20px;text-align:center;color:#7a8699}

  #xkgtFeature .xk-summary{display:flex;flex-wrap:wrap;gap:8px 24px;padding:12px 20px;border-bottom:1px solid #edf1f5;background:#fbfcfd;color:#475569;font-size:13px}
  #xkgtFeature .xk-summary strong{color:#172033}
  /* Dialog so luong xuat & chi tiet */
  .xk-lines-table{width:100%;border-collapse:collapse;font-size:13px}

  .xk-lines-table td{padding:8px 10px;border-top:1px solid #edf1f5;vertical-align:middle}
  .xk-qty-input{width:90px;min-height:36px;padding:4px 8px;border:1px solid #dce3ea;border-radius:7px;font:inherit;font-size:13px;text-align:right}
  .xk-qty-input:focus{border-color:#f47a00;outline:none}
  .xk-qty-input.short{border-color:#e53935;background:#fff8f8}

  @media(max-width:720px){#xkgtFeature .xk-toolbar{flex-direction:column;align-items:stretch}}
</style>
<script>
window.sprint5Features = window.sprint5Features || {};

/* ===================================================================
   S6-05: Xac nhan xuat kho va xu ly giao thieu
   User Story: Nhan vien kho xac nhan xuat, phan thieu ghi no hang.
   Acceptance Criteria:
     1. Xac nhan xuat -> chuyen ton giu cho thanh xuat thuc
     2. Giao thieu -> ghi nhan no hang tu dong
     3. Phieu da xac nhan: khoa, read-only
     4. Tab/bang rieng don con no hang
   =================================================================== */

// Dữ liệu được nạp và ghi qua API shipments.
window.sprint5Features['Xuất kho & giao thiếu'] = {
  path: 'xuat-kho-giao-thieu',
  permission: 'inventory.write',
  render: () => warehouseUi.screen(
    'Xuất kho & giao thiếu',
    'Xac nhan chuyen ton giu cho thanh xuat thuc. Giao thieu se ghi nhan no hang de xu ly o luot giao sau.',
    () => apiRequest('shipments'),
    (host, data, revision) => {
      const ui = warehouseUi, esc = ui.esc;
      const vnd = (v) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND', maximumFractionDigits: 0 }).format(v || 0);
      let activeTab = 'pending';

      // Trạng thái nghiệp vụ lấy từ database.


      // Khoi tao shell
      host.innerHTML = `
        <div id="xkgtFeature">
          <div class="xk-card">
            <div style="padding:14px 20px;border-bottom:1px solid #edf1f5">
              <div class="xk-tabs" role="tablist">
                <button class="xk-tab" role="tab" id="xkTabPending" aria-selected="true" aria-controls="xkPanel">
                  Don cho xuat <span class="xk-badge" id="xkCntPending">${data.pending.length}</span>
                </button>
                <button class="xk-tab" role="tab" id="xkTabShipped" aria-selected="false" aria-controls="xkPanel">
                  Da xuat kho <span class="xk-badge" id="xkCntShipped">${data.shipped.length}</span>
                </button>
                <button class="xk-tab" role="tab" id="xkTabDebt" aria-selected="false" aria-controls="xkPanel">
                  No hang <span class="xk-badge warn" id="xkCntDebt">${data.shortfall.length}</span>
                </button>
              </div>
            </div>
            <div id="xkPanel" role="tabpanel"></div>
          </div>
        </div>`;

      function switchTab(tab) {
        activeTab = tab;
        ['Pending','Shipped','Debt'].forEach(t => {
          const btn = document.getElementById('xkTab' + t);
          if (btn) btn.setAttribute('aria-selected', tab === t.toLowerCase() ? 'true' : 'false');
        });
        renderPanel();
      }

      document.getElementById('xkTabPending').onclick = () => switchTab('pending');
      document.getElementById('xkTabShipped').onclick = () => switchTab('shipped');
      document.getElementById('xkTabDebt').onclick    = () => switchTab('debt');

      // ─── TAB 1: DON CHO XUAT
      function renderPending(q = '', wh = '') {
        const panel = document.getElementById('xkPanel');
        const rows = data.pending.filter(o => {
          const matchQ = !q || [o.orderCode, o.customer, o.warehouse].some(v => v.toLowerCase().includes(q.toLowerCase()));
          const matchWh = !wh || o.warehouse === wh;
          return matchQ && matchWh;
        });
        const totalVal = rows.reduce((s, o) => s + o.payable, 0);
        panel.innerHTML = `
          <div class="xk-toolbar">
            <label class="xk-search"><span>⌕</span><input id="xkSearchPending" type="search" placeholder="Tim ma don, dai ly, kho..." value="${esc(q)}"></label>
            <select class="xk-select" id="xkFilterWh">
              <option value="">Tat ca kho</option>
              ${[...new Set(data.pending.map(o=>o.warehouse))].map(w=>`<option value="${esc(w)}" ${wh===w?'selected':''}>${esc(w)}</option>`).join('')}
            </select>
          </div>
          <div class="xk-summary">
            <span><strong>${rows.length}</strong> don cho xuat</span>
            <span>Tong gia tri: <strong style="color:#f47a00">${vnd(totalVal)}</strong></span>
          </div>
          <div class="xk-table-wrap">
            <table class="xk-table">
              <thead><tr>
                <th>Ma don</th><th>Dai ly</th><th>Kho</th><th>Ngay giao</th>
                <th>So dong</th><th style="text-align:right">Gia tri</th><th>Trang thai</th><th>Thao tac</th>
              </tr></thead>
              <tbody>
                ${rows.length ? rows.map(o => `
                  <tr class="xk-row" data-id="${o.id}">
                    <td><strong>${esc(o.orderCode)}</strong></td>
                    <td>${esc(o.customer)}<small>${esc(o.address)}</small></td>
                    <td>${esc(o.warehouse)}</td>
                    <td>${esc(o.desiredDate)}</td>
                    <td>${o.lines.length} dong</td>
                    <td style="text-align:right;font-weight:700;color:#f47a00">${vnd(o.payable)}</td>
                    <td><span class="xk-status pending">Đã soạn xong</span></td>
                    <td><button class="xk-btn primary xk-confirm-btn" data-id="${o.id}">Xac nhan xuat</button></td>
                  </tr>`).join('') : `
                  <tr><td colspan="8"><div class="xk-empty"><strong>Khong co don nao cho xuat.</strong>Các đơn có phiếu soạn hoàn tất sẽ xuất hiện ở đây.</div></td></tr>`}
              </tbody>
            </table>
          </div>
          <div class="xk-footer"><span id="xkCountPending">${rows.length} don hang</span></div>`;

        document.getElementById('xkSearchPending').addEventListener('input', e => renderPending(e.target.value, document.getElementById('xkFilterWh').value));
        document.getElementById('xkFilterWh').addEventListener('change', e => renderPending(document.getElementById('xkSearchPending').value, e.target.value));

        panel.querySelectorAll('.xk-confirm-btn').forEach(btn => {
          btn.onclick = (e) => {
            e.stopPropagation();
            openConfirmDialog(data.pending.find(o => o.id === Number(btn.dataset.id)));
          };
        });
      }

      // ─── TAB 2: DA XUAT KHO
      function renderShipped(q = '') {
        const panel = document.getElementById('xkPanel');
        const all = data.shipped;
        const rows = all.filter(o => !q || [o.orderCode, o.customer, o.warehouse].some(v => v.toLowerCase().includes(q.toLowerCase())));
        panel.innerHTML = `
          <div class="xk-toolbar">
            <label class="xk-search"><span>⌕</span><input id="xkSearchShipped" type="search" placeholder="Tim ma don, dai ly..." value="${esc(q)}"></label>
          </div>
          <div class="xk-summary">
            <span><strong>${rows.length}</strong> don da xuat</span>
            <span>Co giao thieu: <strong style="color:#e53935">${rows.filter(o=>o.hasShortfall).length} don</strong></span>
          </div>
          <div class="xk-table-wrap">
            <table class="xk-table">
              <thead><tr>
                <th>Ma don</th><th>Dai ly</th><th>Kho</th><th>Thoi gian xuat</th>
                <th>Trang thai giao</th><th style="text-align:right">Gia tri</th><th>Thao tac</th>
              </tr></thead>
              <tbody>
                ${rows.length ? rows.map(o => `
                  <tr data-id="${o.id}">
                    <td><strong>${esc(o.orderCode)}</strong></td>
                    <td>${esc(o.customer)}<small>${esc(o.address)}</small></td>
                    <td>${esc(o.warehouse)}</td>
                    <td><small>${esc(o.confirmedAt)}</small></td>
                    <td><span class="xk-status ${o.hasShortfall ? 'short' : 'shipped'}">${o.hasShortfall ? 'Co giao thieu' : 'Giao du'}</span></td>
                    <td style="text-align:right;font-weight:700">${vnd(o.payable)}</td>
                    <td><button class="xk-btn" data-view="${o.id}">Xem phieu (Khoa)</button></td>
                  </tr>`).join('') : `
                  <tr><td colspan="7"><div class="xk-empty"><strong>Chua co don da xuat.</strong></div></td></tr>`}
              </tbody>
            </table>
          </div>`;

        document.getElementById('xkSearchShipped').addEventListener('input', e => renderShipped(e.target.value));
        panel.querySelectorAll('[data-view]').forEach(btn => {
          btn.onclick = () => {
            const id = Number(btn.dataset.view);
            const o = all.find(x => x.id === id);
            if (o) showOrderDetail(o, true);
          };
        });
      }

      // ─── TAB 3: NO HANG (DANH SACH DON CON NO)
      function renderDebt(q = '') {
        const panel = document.getElementById('xkPanel');
        const all = data.shortfall;
        const rows = all.filter(o => !q || [o.orderCode, o.customer, o.warehouse].some(v => v.toLowerCase().includes(q.toLowerCase())));
        const totalDebt = rows.reduce((s, o) => s + o.debtValue, 0);

        panel.innerHTML = `
          <div class="xk-toolbar">
            <label class="xk-search"><span>⌕</span><input id="xkSearchDebt" type="search" placeholder="Tim ma don, dai ly no hang..." value="${esc(q)}"></label>
          </div>
          <div class="xk-summary">
            <span><strong>${rows.length}</strong> don con no hang</span>
            <span>Tong gia tri no: <strong style="color:#e53935">${vnd(totalDebt)}</strong></span>
          </div>
          <div class="xk-table-wrap">
            <table class="xk-table">
              <thead><tr>
                <th>Ma don</th><th>Dai ly</th><th>Kho</th><th>Thoi gian xuat</th>
                <th>So kien con no</th><th style="text-align:right">Gia tri no</th><th>Trang thai</th><th>Thao tac</th>
              </tr></thead>
              <tbody>
                ${rows.length ? rows.map(o => `
                  <tr>
                    <td><strong>${esc(o.orderCode)}</strong></td>
                    <td>${esc(o.customer)}<small>${esc(o.address)}</small></td>
                    <td>${esc(o.warehouse)}</td>
                    <td><small>${esc(o.confirmedAt)}</small></td>
                    <td style="color:#e53935;font-weight:700">${o.debtItems} san pham</td>
                    <td style="text-align:right;font-weight:700;color:#e53935">${vnd(o.debtValue)}</td>
                    <td>${o.backorderCode ? `<span class="xk-status">Đã lập đơn bù ${esc(o.backorderCode)}</span>` : '<span class="xk-status debt">Nợ hàng · chờ lập đơn bù</span>'}</td>
                    <td><button class="xk-btn" data-debt="${o.id}">Chi tiet no</button></td>
                  </tr>`).join('') : `
                  <tr><td colspan="8"><div class="xk-empty"><strong>Khong co don nao con no hang.</strong>Tat ca don deu da duoc xuat du!</div></td></tr>`}
              </tbody>
            </table>
          </div>`;

        document.getElementById('xkSearchDebt').addEventListener('input', e => renderDebt(e.target.value));
        panel.querySelectorAll('[data-debt]').forEach(btn => {
          btn.onclick = () => {
            const o = all.find(x => x.id === Number(btn.dataset.debt));
            if (o) showDebtDetail(o);
          };
        });
      }

      // ─── DIALOG: XAC NHAN XUAT KHO (NHAP SO LUONG THUC)
      function openConfirmDialog(order) {
        if (!order) return;
        const linesHtml = order.lines.map(l => `
          <tr>
            <td><strong>${esc(l.sku)}</strong><small>${esc(l.name)}</small></td>
            <td style="text-align:center">${l.orderedQty} ${esc(l.unit)}</td>
            <td style="text-align:center"><strong style="color:#175cd3">${l.reservedQty}</strong></td>
            <td style="text-align:center">
              <input class="xk-qty-input" type="number" name="qty_${l.id}"
                min="0" max="${l.reservedQty}" step="0.000001" value="${l.reservedQty}"
                data-ordered="${l.orderedQty}" data-line="${l.id}" data-unit="${esc(l.unit)}" data-price="${l.unitPrice||0}">
            </td>
            <td class="xk-diff" id="diff_${l.id}">—</td>
          </tr>`).join('');

        const body = `
          <div class="form-group full">
            <div style="padding:10px 14px;background:#eff8ff;border-radius:10px;border:1px solid #b2ddff;color:#175cd3;font-size:13px;margin-bottom:14px">
              <strong>Huong dan:</strong> He thong mac dinh xuat theo <em>Ton giu cho</em>. Neu thuc te giao thieu, hay nhap dung so luong thuc xuat. Phan chenh lech se duoc tu dong ghi nhan thanh <strong>No hang</strong>.
            </div>
            <div class="xk-table-wrap">
              <table class="xk-lines-table">
                <thead><tr>
                  <th>San pham</th>
                  <th style="text-align:center">Dat hang</th>
                  <th style="text-align:center">Giu cho</th>
                  <th style="text-align:center">Thuc xuat *</th>
                  <th>Giao thieu</th>
                </tr></thead>
                <tbody id="xkConfirmLines">${linesHtml}</tbody>
              </table>
            </div>
            <label for="xkReason">Lý do giao thiếu (bắt buộc nếu xuất thiếu)</label><textarea id="xkReason" maxlength="1000"></textarea><p id="xkSubmitError" role="alert"></p>
            <div id="xkConfirmSummary" style="margin-top:14px;padding:12px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0;font-size:13px"></div>
          </div>`;

        const { form, close } = openFormDialog(`Xac nhan xuat kho — ${order.orderCode}`, body, 'Xac nhan xuat kho');

        function updateDiff() {
          let totalShort = 0, totalShortVal = 0;
          form.querySelectorAll('.xk-qty-input').forEach(input => {
            const lineId = input.dataset.line;
            const ordered = Number(input.dataset.ordered);
            const actual = Math.max(0, Math.min(ordered, Number(input.value) || 0));
            const short = ordered - actual;
            const diffEl = document.getElementById('diff_' + lineId);
            if (diffEl) diffEl.textContent = short > 0 ? `−${short} ${input.dataset.unit}` : '—';
            input.classList.toggle('short', short > 0);
            totalShort += short;
            totalShortVal += short * Number(input.dataset.price);
          });
          const sumEl = document.getElementById('xkConfirmSummary');
          if (totalShort > 0) {
            sumEl.innerHTML = `<span style="color:#e53935;font-weight:600">⚠ Phat hien giao thieu ${totalShort} san pham — Se tu dong ghi nhan No hang: <strong>${vnd(totalShortVal)}</strong></span>`;
          } else {
            sumEl.innerHTML = `<span style="color:#067647;font-weight:600">✓ Giao du toan bo — Chuyen toan bo ton giu cho thanh xuat thuc</span>`;
          }
        }

        form.querySelectorAll('.xk-qty-input').forEach(inp => {
          inp.addEventListener('input', updateDiff);
        });
        updateDiff();

        form.onsubmit = async (e) => {
          e.preventDefault();
          const button = form.querySelector('button[type="submit"]');
          if (button.disabled) return;
          const error = form.querySelector('#xkSubmitError');
          const lines = [];
          for (const line of order.lines) {
            const input = form.querySelector('[name="qty_'+line.id+'"]');
            const quantity = Number(input.value);
            if (input.value === '' || !Number.isFinite(quantity) || quantity < 0 || quantity > line.orderedQty) {
              error.textContent = 'Nhập số lượng hợp lệ, không vượt số lượng đặt.'; return;
            }
            lines.push({lineId: line.id, actualQuantity: quantity});
          }
          button.disabled = true; error.textContent = '';
          try {
            await apiRequest('shipments/'+order.id, jsonRequestOptions('POST', {lines, reason: form.querySelector('#xkReason').value.trim()}));
            close(); showToast('Đã xác nhận xuất kho '+order.orderCode);
            await window.sprint5Features['Xuất kho & giao thiếu'].render();
          } catch (err) { error.textContent = err.message || 'Không thể xác nhận xuất kho'; }
          finally { if (button.isConnected) button.disabled = false; }
        };
      }

      // ─── DIALOG: XEM PHIEU XUAT (KHOA / READ-ONLY)
      function showOrderDetail(order, locked) {
        const linesHtml = (order.lines || []).map(l => {
          const delivered = l.deliveredQty ?? l.actualQty ?? l.orderedQty;
          const short = l.shortQty ?? Math.max(0, l.orderedQty - delivered);
          return `
            <tr>
              <td><strong>${esc(l.sku||'')}</strong><small>${esc(l.name||'')}</small></td>
              <td style="text-align:right">${vnd(l.unitPrice||0)}</td>
              <td style="text-align:center">${l.orderedQty}</td>
              <td style="text-align:center;color:#067647;font-weight:700">${delivered}</td>
              <td style="text-align:center;color:#e53935;font-weight:700">${short > 0 ? short : '—'}</td>
              <td style="text-align:right;font-weight:700">${vnd(delivered * (l.unitPrice||0))}</td>
            </tr>`;
        }).join('');

        const body = `
          <div class="form-group full">
            ${locked ? `
              <div style="padding:10px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0;color:#475569;font-size:12px;margin-bottom:12px;display:flex;align-items:center;gap:8px">
                <span style="font-size:16px">🔒</span>
                <span><strong>Phieu xuat da hoan tat & khoa chinh sua:</strong> Toan bo ton giu cho da duoc chuyen thanh xuat thuc te vao kho. Don hang o che do Read-only.</span>
              </div>` : ''}
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;font-size:13px">
              <div><strong>Dai ly:</strong> ${esc(order.customer)}</div>
              <div><strong>Kho xuat:</strong> ${esc(order.warehouse)}</div>
              <div><strong>Thoi gian xuat:</strong> ${esc(order.confirmedAt || '—')}</div>
              <div><strong>Tong gia tri xuat:</strong> <span style="color:#067647;font-weight:700">${vnd(order.payable)}</span></div>
            </div>
            <div class="xk-table-wrap">
              <table class="xk-lines-table">
                <thead><tr>
                  <th>San pham</th>
                  <th style="text-align:right">Don gia</th>
                  <th style="text-align:center">Da dat</th>
                  <th style="text-align:center">Thuc xuat</th>
                  <th style="text-align:center">Giao thieu</th>
                  <th style="text-align:right">Thanh tien</th>
                </tr></thead>
                <tbody>${linesHtml}</tbody>
              </table>
            </div>
          </div>`;
        openFormDialog(`Phieu xuat — ${order.orderCode}`, body, null);
      }

      // ─── DIALOG: CHI TIET NO HANG
      function showDebtDetail(order) {
        const linesHtml = (order.lines || []).map(l => `
          <tr>
            <td><strong>${esc(l.sku||'')}</strong><small>${esc(l.name||'')}</small></td>
            <td style="text-align:center">${l.orderedQty}</td>
            <td style="text-align:center;color:#067647;font-weight:600">${l.deliveredQty}</td>
            <td style="text-align:center;color:#e53935;font-weight:700">${l.shortQty}</td>
            <td style="text-align:right;color:#e53935;font-weight:700">${vnd(l.shortQty * (l.unitPrice||0))}</td>
          </tr>`).join('');

        const body = `
          <div class="form-group full">
            <div style="padding:12px 14px;background:#fef3f2;border-radius:10px;border:1px solid #fee4e2;color:#b42318;font-size:13px;margin-bottom:12px">
              <strong>Danh sach mat hang con thieu:</strong> Cac mat hang duoi day can duoc uu tien xuat bo sung trong dot giao hang tiep theo. Tong gia tri con no: <strong>${vnd(order.debtValue)}</strong>.
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;font-size:13px">
              <div><strong>Dai ly nhan:</strong> ${esc(order.customer)}</div>
              <div><strong>Kho xuat:</strong> ${esc(order.warehouse)}</div>
              <div><strong>Dia chi giao:</strong> ${esc(order.address || '—')}</div>
              <div><strong>Ngay xuat lan 1:</strong> ${esc(order.confirmedAt || '—')}</div>
            </div>
            <div class="xk-table-wrap">
              <table class="xk-lines-table">
                <thead><tr>
                  <th>San pham</th>
                  <th style="text-align:center">Da dat</th>
                  <th style="text-align:center">Da giao</th>
                  <th style="text-align:center">Con no</th>
                  <th style="text-align:right">Gia tri no</th>
                </tr></thead>
                <tbody>${linesHtml}</tbody>
              </table>
            </div>
          </div>`;
        openFormDialog(`Chi tiet no hang — ${order.orderCode}`, body, null);
      }

      function renderPanel() {
        if (activeTab === 'pending') renderPending();
        else if (activeTab === 'shipped') renderShipped();
        else renderDebt();
      }

      renderPanel();
    }
  )
};
</script>
